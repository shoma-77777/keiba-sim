<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1d6b3e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="競馬シミュ">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<title>競馬展開シミュレーター</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=IBM+Plex+Mono:wght@400;600&display=swap">
<style>
/* Layout: 出馬表ボード型。上部にレース帯、本体はタブ切替（出馬表／結果／3D再生／馬DB／データ） */
:root{
  --bg:#eef2ee; --surface:#ffffff; --surface2:#f6f8f5; --ink:#17221b; --muted:#5b6a60; --line:#d6ded7;
  --turf:#1d6b3e; --turf-ink:#ffffff; --gold:#a8771c; --dirt:#8a5a2b; --bad:#b33a2e; --good:#1f7a45;
  --bar:#cfe3d5;
  --f-display:"Dela Gothic One","Zen Kaku Gothic New",system-ui,sans-serif;
  --f-body:"Zen Kaku Gothic New","Hiragino Sans","Noto Sans JP",system-ui,sans-serif;
  --f-data:"IBM Plex Mono",ui-monospace,"SFMono-Regular",monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0d1511; --surface:#141e18; --surface2:#18241d; --ink:#e6eee8; --muted:#91a297; --line:#26352c;
  --turf:#46b874; --turf-ink:#06140c; --gold:#dcae55; --dirt:#c98f58; --bad:#e2685a; --good:#5cc98a; --bar:#1f3d2b; color-scheme:dark; } }
:root[data-theme="dark"]{
  --bg:#0d1511; --surface:#141e18; --surface2:#18241d; --ink:#e6eee8; --muted:#91a297; --line:#26352c;
  --turf:#46b874; --turf-ink:#06140c; --gold:#dcae55; --dirt:#c98f58; --bad:#e2685a; --good:#5cc98a; --bar:#1f3d2b; color-scheme:dark; }

*{box-sizing:border-box}
body{padding-bottom:env(safe-area-inset-bottom);background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.55}
.wrap{max-width:1180px;margin:0 auto;padding-inline:16px;padding-block:14px 48px}
h1,h2,h3{margin:0;text-wrap:balance}
.num,.mono{font-family:var(--f-data);font-variant-numeric:tabular-nums}
button,select,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

/* ヘッダ */
.top{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;justify-content:space-between}
.brand{font-family:var(--f-display);font-size:22px;letter-spacing:.02em}
.brand small{font-family:var(--f-body);font-size:12px;color:var(--muted);margin-left:8px;letter-spacing:.06em}
.src{font-size:12px;color:var(--muted)}

/* 開催日・レース選択 */
.days{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.day{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 12px;cursor:pointer;display:flex;flex-direction:column;align-items:flex-start;min-width:110px}
.day b{font-family:var(--f-data);font-size:15px}
.day span{font-size:11px;color:var(--muted)}
.day[aria-pressed="true"]{background:var(--turf);color:var(--turf-ink);border-color:var(--turf)}
.day[aria-pressed="true"] span{color:inherit;opacity:.85}
.venues{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px;margin-top:12px}
.venue{background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden;min-width:0}
.venue h3{font-size:13px;padding:8px 12px;background:var(--surface2);border-bottom:1px solid var(--line);display:flex;justify-content:space-between}
.venue h3 span{color:var(--muted);font-weight:500}
.rlist{list-style:none;margin:0;padding:0}
.rlist button{all:unset;box-sizing:border-box;width:100%;display:grid;grid-template-columns:34px 1fr auto;gap:8px;align-items:center;padding:6px 12px;border-bottom:1px solid var(--line);cursor:pointer}
.rlist li:last-child button{border-bottom:0}
.rlist button:hover{background:var(--surface2)}
.rlist button[aria-current="true"]{background:color-mix(in srgb,var(--turf) 14%,transparent)}
.rno{font-family:var(--f-data);font-weight:600;color:var(--muted)}
.rname{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rmeta{font-size:11px;color:var(--muted);font-family:var(--f-data);white-space:nowrap}
.surf{display:inline-block;font-size:10px;padding:0 5px;border-radius:3px;margin-right:4px;color:#fff;font-family:var(--f-body)}
.surf.芝{background:#2f8a46}.surf.ダ{background:#9a6a3a}.surf.障{background:#6c5aa8}
.dot{width:7px;height:7px;border-radius:50%;display:inline-block;background:var(--line);margin-left:6px;vertical-align:middle}
.dot.on{background:var(--gold)}

/* レース帯 */
.raceband{margin-top:18px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.raceband .no{font-family:var(--f-display);font-size:28px;color:var(--turf);line-height:1}
.raceband h2{font-family:var(--f-display);font-size:22px;font-weight:400}
.raceband .cond{color:var(--muted);font-size:13px}
.raceband .grow{flex:1;min-width:200px}
.ctrls{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.ctrls label{font-size:12px;color:var(--muted);display:flex;gap:6px;align-items:center}
select,input[type=number],input[type=search],input[type=text]{background:var(--surface2);border:1px solid var(--line);border-radius:6px;padding:5px 8px}
.btn{border:1px solid var(--line);background:var(--surface2);border-radius:8px;padding:7px 14px;cursor:pointer;font-weight:700}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--turf);color:var(--turf-ink);border-color:var(--turf)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.progress{height:4px;background:var(--line);border-radius:2px;overflow:hidden;width:160px}
.progress i{display:block;height:100%;width:0;background:var(--gold);transition:width .1s}

/* タブ */
.tabs{display:flex;gap:2px;margin-top:16px;border-bottom:1px solid var(--line);overflow-x:auto}
.tab{all:unset;cursor:pointer;padding:9px 14px;font-weight:700;color:var(--muted);border-bottom:3px solid transparent;white-space:nowrap}
.tab[aria-selected="true"]{color:var(--ink);border-color:var(--turf)}
.panel{padding-top:14px}

/* テーブル */
.tbl-wrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:7px 9px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
th{font-size:11px;letter-spacing:.06em;color:var(--muted);font-weight:700;background:var(--surface2);position:sticky;top:0}
td.r,th.r{text-align:right}
tr:last-child td{border-bottom:0}
tbody tr:hover{background:var(--surface2)}
.ub{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:5px;font-family:var(--f-data);font-weight:600;font-size:13px;border:1px solid rgba(0,0,0,.35)}
.hname{font-weight:700}
.hname button{all:unset;cursor:pointer;border-bottom:1px dotted var(--muted)}
.style{font-size:11px;padding:1px 6px;border-radius:10px;border:1px solid var(--line)}
.style.逃げ{border-color:#c0392b;color:#c0392b}.style.先行{border-color:#d68910;color:#b9770e}.style.差し{border-color:#2874a6;color:#2874a6}.style.追込{border-color:#7d3c98;color:#7d3c98}
:root[data-theme="dark"] .style.差し, :root[data-theme="dark"] .style.追込{filter:brightness(1.6)}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .style.差し, :root:not([data-theme="light"]) .style.追込{filter:brightness(1.6)} }
.pt{font-family:var(--f-data);font-weight:600}
.small{font-size:12px;color:var(--muted)}
input.tiny{width:64px;padding:3px 6px}
.mark{font-size:16px;font-weight:700;color:var(--bad);width:20px;display:inline-block;text-align:center}
.barcell{min-width:150px}
.bar{position:relative;height:18px;background:var(--surface2);border-radius:3px;overflow:hidden}
.bar i{position:absolute;inset:0 auto 0 0;background:var(--turf);opacity:.85}
.bar span{position:relative;font-family:var(--f-data);font-size:12px;padding-left:6px;line-height:18px;font-weight:600}
.dist{display:flex;gap:1px}
.dist i{width:7px;height:16px;border-radius:1px;background:var(--turf)}
.breakdown{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:11px;font-family:var(--f-data);color:var(--muted);white-space:normal}
.breakdown b{color:var(--ink);font-weight:600}
.pos{color:var(--good)}.neg{color:var(--bad)}

.note{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--gold);border-radius:8px;padding:10px 14px;font-size:13px;margin-top:12px;max-width:80ch}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:10px;padding:22px;color:var(--muted);text-align:left}
.empty h3{color:var(--ink);font-size:15px;margin-bottom:6px}

/* 3D */
.stage{position:relative;height:min(68vh,620px);min-height:360px;border-radius:12px;overflow:hidden;background:#bcd6e8;border:1px solid var(--line)}
.stage canvas{display:block}
.hud{position:absolute;left:10px;top:10px;right:10px;display:flex;justify-content:space-between;gap:10px;pointer-events:none;flex-wrap:wrap}
.hud .box{background:rgba(10,18,14,.78);color:#f1f5f2;border-radius:8px;padding:6px 10px;font-family:var(--f-data)}
.hud .rn{font-family:var(--f-display);font-size:14px}
.hud .clock{font-size:20px;font-weight:600}
.phase{font-family:var(--f-display);font-size:18px;color:#f3c76b;letter-spacing:.04em}
.hudsub{color:#bcd}
.minimap{position:absolute;right:10px;top:72px;width:220px;height:150px;background:rgba(10,18,14,.72);border-radius:10px;pointer-events:none;transition:all .25s}
.minimap.big{width:min(560px,70%);height:auto;aspect-ratio:22/15;top:50%;right:50%;transform:translate(50%,-50%);background:rgba(10,18,14,.86)}
.commentary{position:absolute;left:10px;bottom:62px;max-width:min(460px,62%);display:flex;flex-direction:column;gap:3px;pointer-events:none}
.commentary div{background:rgba(10,18,14,.72);color:#e8efe9;border-radius:6px;padding:3px 9px;font-size:13px;line-height:1.45;width:fit-content;max-width:100%}
.commentary div:last-child{background:rgba(10,18,14,.9);color:#fff;font-weight:700;font-size:14px;border-left:3px solid #f3c76b}
.lineup{position:absolute;left:10px;right:10px;bottom:8px;height:46px;background:rgba(10,18,14,.72);border-radius:8px;pointer-events:none;overflow:hidden}
.lu-axis{position:absolute;left:8px;right:8px;top:0;bottom:0}
.lu-axis span{position:absolute;top:0;bottom:0;border-left:1px dashed rgba(255,255,255,.18);font-size:9px;color:rgba(255,255,255,.55);padding-left:2px}
.lu-track{position:absolute;left:8px;right:22px;top:0;bottom:0}
.lu-track .ub{position:absolute;width:20px;height:20px;font-size:11px;transform:translateX(-50%);transition:left .12s linear;box-shadow:0 1px 3px rgba(0,0,0,.5)}
.lu-track .ub.focus{outline:2px solid #ffd23a;outline-offset:1px;z-index:3}
.legend3d{margin-top:8px;max-width:90ch}
@media (max-width:620px){ .minimap{width:150px;height:102px;top:auto;bottom:62px;right:10px} .commentary{max-width:calc(100% - 180px)} .phase{font-size:15px} }
.finish{position:absolute;right:10px;top:64px;background:rgba(10,18,14,.86);color:#f1f5f2;border-radius:10px;padding:10px 12px;font-size:13px;min-width:240px}
.finish h4{margin:0 0 6px;font-family:var(--f-display);font-weight:400;font-size:15px;color:#f3c76b}
.finish table{font-size:12px}
.finish td{border-color:rgba(255,255,255,.12);padding:3px 6px;color:#f1f5f2}
.replay-ctrls{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:10px}
.replay-ctrls input[type=range]{flex:1;min-width:160px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{all:unset;cursor:pointer;padding:6px 10px;font-size:12px;font-weight:700;background:var(--surface)}
.seg button[aria-pressed="true"]{background:var(--turf);color:var(--turf-ink)}
.passing{font-family:var(--f-data);font-size:12px;color:var(--muted);margin-top:8px}

/* 馬DB */
.db{display:grid;grid-template-columns:260px 1fr;gap:14px}
@media (max-width:760px){ .db{grid-template-columns:1fr} }
.hl{background:var(--surface);border:1px solid var(--line);border-radius:10px;max-height:620px;overflow:auto;min-width:0}
.hl button{all:unset;box-sizing:border-box;width:100%;padding:7px 12px;border-bottom:1px solid var(--line);cursor:pointer;display:flex;justify-content:space-between;gap:6px}
.hl button[aria-current="true"]{background:color-mix(in srgb,var(--turf) 14%,transparent)}
.hl small{color:var(--muted);font-family:var(--f-data)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;min-width:0}
.card h2{font-family:var(--f-display);font-weight:400;font-size:24px}
.ped{color:var(--muted);font-size:13px;margin-top:2px}
.apts{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin:14px 0}
.apt{border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--surface2)}
.apt .k{font-size:11px;color:var(--muted);letter-spacing:.06em}
.apt .v{font-family:var(--f-data);font-size:17px;font-weight:600}
.apt .s{font-size:11px;color:var(--muted)}
.meter{height:6px;border-radius:3px;background:var(--line);margin-top:4px;position:relative}
.meter i{position:absolute;top:-2px;width:10px;height:10px;border-radius:50%;background:var(--turf);transform:translateX(-50%)}
.drop{border:2px dashed var(--line);border-radius:10px;padding:18px;background:var(--surface)}
textarea{width:100%;min-height:120px;background:var(--surface2);border:1px solid var(--line);border-radius:8px;padding:8px;font-family:var(--f-data);font-size:12px;color:var(--ink)}
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:8px;font-size:13px;z-index:9}
.sec{font-family:var(--f-display);font-weight:400;font-size:17px;margin:22px 0 8px;display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.sec:first-child{margin-top:0}
.stale{display:flex;gap:12px;align-items:center;flex-wrap:wrap;background:color-mix(in srgb,var(--gold) 16%,var(--surface));border:1px solid var(--gold);border-radius:10px;padding:10px 14px;margin-bottom:14px;font-size:13px}
th.c{text-align:center}
td.hi{font-weight:700;color:var(--turf)}
.pacecards{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin-bottom:10px}
.pc{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:4px}
.pc span{font-size:12px;color:var(--muted)}
.pc div{display:flex;gap:4px}
.plans{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:12px}
.plan{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;min-width:0;display:flex;flex-direction:column;gap:10px}
.plan h4{margin:0;font-family:var(--f-display);font-weight:400;font-size:16px}
.plan .tbl-wrap{border-radius:8px}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kpis div{background:var(--surface2);border-radius:8px;padding:6px 8px;display:flex;flex-direction:column}
.kpis span{font-size:11px;color:var(--muted)}
.kpis b{font-size:17px}
.chips{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.chip{font-size:10.5px;padding:1px 7px;border-radius:10px;border:1px solid var(--line);white-space:nowrap;font-weight:500}
.chip.ana{border-color:var(--gold);color:var(--gold);background:color-mix(in srgb,var(--gold) 10%,transparent)}
.chip.disc{border-color:var(--muted);color:var(--muted)}
.legend{margin:6px 0;padding-left:18px;display:flex;flex-direction:column;gap:3px}
.matrix{display:flex;flex-direction:column;gap:6px;overflow-x:auto;padding-bottom:4px}
.mrow{display:grid;grid-template-columns:34px repeat(3,minmax(150px,1fr));gap:6px}
.mhead{font-size:12px;color:var(--muted);font-weight:700;display:flex;align-items:center;justify-content:center}
.tile{all:unset;box-sizing:border-box;cursor:pointer;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px 8px;display:flex;flex-direction:column;gap:3px;min-width:0}
.tile:hover{border-color:var(--muted)}
.tile[aria-pressed="true"]{border-color:var(--turf);box-shadow:inset 0 0 0 1px var(--turf)}
.tile .tl{font-size:11px;color:var(--muted)}
.tile .tr{display:flex;align-items:center;gap:6px;font-size:12px}
.tile .tr .ub{width:20px;height:20px;font-size:11px}
.sub{font-size:14px;margin:12px 0 6px}
.forecast{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:10px;margin-bottom:10px}
.forecast > div{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:6px;min-width:0}
.fc-order > div{display:flex;flex-direction:column;gap:4px}
.fo{display:flex;align-items:center;gap:6px;font-weight:700}
.fc-tri div{display:flex;align-items:center;gap:4px;flex-wrap:wrap}
.fc-tri .best{font-weight:700;background:color-mix(in srgb,var(--gold) 12%,transparent);border-radius:6px;padding:2px 4px}
tr.darkrow{background:color-mix(in srgb,var(--gold) 9%,transparent)}
.darkcard{display:grid;gap:6px;background:var(--surface);border:1px solid var(--gold);border-radius:12px;padding:12px 14px;margin-bottom:14px}
.dk-badge{font-family:var(--f-display);color:var(--gold);font-size:13px;letter-spacing:.08em}
.dk-main{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.dk-name{font-family:var(--f-display);font-weight:400;font-size:22px}
.dk-stats{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13px;color:var(--muted)}
.dk-stats b{color:var(--ink)}
.bigfinish{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;background:radial-gradient(ellipse at center,rgba(5,12,8,.55),rgba(5,12,8,.15) 70%)}
.bigfinish .panel2{pointer-events:auto;background:rgba(8,16,11,.9);color:#f2f5f2;border:1px solid rgba(243,199,107,.5);border-radius:14px;padding:16px 20px;min-width:min(560px,92%);max-width:92%;box-shadow:0 10px 40px rgba(0,0,0,.4)}
.bigfinish h4{margin:0 0 10px;font-family:var(--f-display);font-weight:400;font-size:20px;color:#f3c76b;text-align:center;letter-spacing:.06em}
.bigfinish table{width:100%;font-size:clamp(14px,2.4vw,20px)}
.bigfinish td{border-color:rgba(255,255,255,.12);color:#f2f5f2;padding:7px 10px}
.bigfinish .ub{width:32px;height:32px;font-size:17px}
.bigfinish .pl{font-family:var(--f-display);font-size:1.1em;color:#f3c76b;white-space:nowrap}
.fin-note{font-size:12.5px;color:#d8e2db;margin:10px 0 0;line-height:1.6}
.fin-note b{color:#f3c76b}
.bigfinish .close{display:block;margin:10px auto 0;background:transparent;color:#cfd8d2;border:1px solid rgba(255,255,255,.3);border-radius:8px;padding:5px 14px;cursor:pointer}
.recline{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:6px}
.chip.tr{border-color:var(--turf);color:var(--turf)}
.chip.tk{border-color:#3b7fc4;color:#3b7fc4}
.trackline{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;color:var(--muted);margin-top:4px}
.trackline b{color:var(--ink)}
.chip.bl{border-color:#8a5cc2;color:#8a5cc2}
.chip.mvup{border-color:var(--bad);color:var(--bad);font-weight:700}
.chip.mvdn{border-color:#3b7fc4;color:#3b7fc4}
.chip.ok{border-color:var(--good);color:var(--good)}
.trouble{font-size:11px;color:var(--gold);white-space:normal;max-width:280px}
.vtabs{display:none}
@media (max-width:700px){
  .days{flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px;-webkit-overflow-scrolling:touch}
  .day{min-width:92px;flex:0 0 auto}
  .venues{display:block}

<script>
// ===== 競馬シミュレーションエンジン =====
const Engine = (() => {
  // --- コース諸元（周長・直線・回り）。内/外回りは距離で切替 ---
  const COURSE = {
    "東京": { dir:"左", 芝:{lap:2083,str:525.9}, ダ:{lap:1899,str:501.6} },
    "中山": { dir:"右", 芝:{lap:1840,str:310.0}, ダ:{lap:1493,str:308.0}, 芝外:{lap:1839,str:310.0} },
    "京都": { dir:"右", 芝:{lap:1894,str:403.7}, 芝内:{lap:1782,str:328.4}, ダ:{lap:1608,str:329.1} },
    "阪神": { dir:"右", 芝:{lap:2089,str:473.6}, 芝内:{lap:1689,str:356.5}, ダ:{lap:1517,str:352.7} },
    "中京": { dir:"左", 芝:{lap:1705,str:412.5}, ダ:{lap:1530,str:410.7} },
    "新潟": { dir:"左", 芝:{lap:2223,str:658.7}, 芝内:{lap:1623,str:358.7}, ダ:{lap:1472,str:353.9} },
    "札幌": { dir:"右", 芝:{lap:1641,str:266.1}, ダ:{lap:1487,str:264.3} },
    "函館": { dir:"右", 芝:{lap:1627,str:262.1}, ダ:{lap:1476,str:260.3} },
    "福島": { dir:"右", 芝:{lap:1600,str:292.0}, ダ:{lap:1445,str:295.7} },
    "小倉": { dir:"右", 芝:{lap:1615,str:293.0}, ダ:{lap:1445,str:291.3} }
  };
  function courseOf(venue, surface, dist){
    const c = COURSE[venue] || COURSE["東京"];
    let key = surface === "ダ" ? "ダ" : "芝";
    if (surface !== "ダ") {
      if (venue === "京都" && c["芝内"] && (dist === 1200 || dist === 2000)) key = "芝内";
      if (venue === "阪神" && c["芝内"] && [1200,2000,2200,3000].includes(dist)) key = "芝内";
      if (venue === "新潟" && c["芝内"] && [2000,2200,2400].includes(dist) ) key = "芝内";
    }
    const g = c[key];
    return { dir:c.dir, lap:g.lap, str:g.str, key };
  }

  // --- 騎手補正（目安値。リーディング・重賞実績から設定。1Pt≒0.1秒） ---
  const JOCKEY = {"ルメール":2.0,"川田":2.0,"モレイラ":1.8,"Ｍデム":1.5,"Mデム":1.5,"レーン":1.5,"ムーア":1.5,"坂井":1.4,"戸崎圭":1.2,"横山武":1.2,"武豊":1.1,"松山":1.0,"岩田望":1.0,"西村淳":0.9,"鮫島駿":0.8,"鮫島克":0.8,"コレット":0.8,"北村友":0.7,"横山典":0.6,"田辺":0.6,"横山和":0.6,"菅原明":0.6,"佐々木":0.6,"津村":0.5,"団野":0.5,"池添":0.4,"浜中":0.4,"岩田康":0.3,"吉田隼":0.3,"丹内":0.3,"ゴンサル":0.3,"松若":0.2,"荻野極":0.2,"藤岡佑":0.2,"三浦":0.2,"幸":0.0,"吉村":0.0,"高杉":0.0,"丸山":0.0,"大野":0.0,"中村将":0.0,"石橋":-0.1,"斎藤":-0.2,"吉田豊":-0.2,"松本":-0.2,"内田博":-0.2,"古川吉":-0.2,"古川奈":-0.2,"小沢":-0.2,"小崎":-0.2,"石川":-0.2,"原":-0.3,"菊沢":-0.3,"川又":-0.3,"田口":-0.3,"太宰":-0.3,"西村太":-0.4,"酒井":-0.4};
  const JKEYS = Object.keys(JOCKEY).sort((a, b) => b.length - a.length);
  // 出馬表の略称（坂井）とDBのフルネーム（坂井瑠星）を同じ騎手として扱う
  function jockeyKey(j){
    j = (j || "").trim().replace("鮫島克駿", "鮫島駿").replace("ミルコ", "Ｍデム");
    for (const k of JKEYS) if (j.startsWith(k)) return k;
    return j;
  }
  const jockeyPts = j => JOCKEY[jockeyKey(j)] ?? 0;

  // --- クラス判定 ---
  const GRADE_BASE = {G1:80,G2:74,G3:70,L:67,OP:66,"3勝":62,"2勝":56,"1勝":50,"未勝利":44,"新馬":42,"障害":40};
  const GRADE_RANK = {G1:7,G2:6,G3:5,L:4,OP:4,"3勝":3,"2勝":2,"1勝":1,"未勝利":0,"新馬":0,"障害":0};
  function gradeOf(name){
    const n = name || "";
    if (/障害/.test(n)) return /G|J・G/.test(n) ? "OP" : "障害";
    if (/GIII|JpnIII|G3/.test(n)) return "G3";
    if (/GII|JpnII|G2/.test(n)) return "G2";
    if (/GI|JpnI|G1/.test(n)) return "G1";
    if (/新馬/.test(n)) return "新馬";
    if (/未勝利/.test(n)) return "未勝利";
    if (/1勝|500万/.test(n)) return "1勝";
    if (/2勝|1000万/.test(n)) return "2勝";
    if (/3勝|1600万/.test(n)) return "3勝";
    if (/L$|\(L\)|リステッド/.test(n)) return "L";
    return "OP";
  }
  const JRA = new Set(["札幌","函館","福島","新潟","東京","中山","中京","京都","阪神","小倉"]);
  const DIR = { "東京":"左","中京":"左","新潟":"左","中山":"右","京都":"右","阪神":"右","札幌":"右","函館":"右","福島":"右","小倉":"右" };

  // --- 過去走パース（文字列・オブジェクト両対応） ---
  const num = v => (v === "" || v == null || v === "-") ? null : (isFinite(+v) ? +v : null);
  function parseRun(s){
    let r;
    if (typeof s !== "string") {
      r = { ...s };
      r.surface = r.surface || "芝"; r.dist = +r.dist;
      r.passing = Array.isArray(r.passing) ? r.passing : (r.passing ? String(r.passing).split("-").map(Number).filter(x => x > 0) : []);
    } else {
      const [date, venue, race, sd, going, pos, field, time, passing, last3f, margin, pop, gate, jockey, kg, note] = s.split("|");
      r = { date, venue, race, surface: sd[0], dist: parseInt(sd.slice(1), 10), going, pos, field, time, last3f, margin, pop, gate, jockey, weight: kg, note,
            passing: (passing && passing !== "-") ? passing.split("-").map(Number).filter(x => x > 0) : [] };
    }
    r.pos = +r.pos; r.field = +r.field; r.going = r.going || "-"; r.time = r.time || "-";
    r.last3f = num(r.last3f); r.margin = num(r.margin); r.pop = num(r.pop ?? r.popularity); r.gate = num(r.gate); r.weight = num(r.weight);
    r.grade = r.grade || gradeOf(r.race || ""); r.note = r.note || r.comment || "";
    r.overseas = !JRA.has(r.venue) && !/川崎|大井|船橋|浦和|園田|名古屋|盛岡|門別|佐賀|金沢|笠松|高知|水沢/.test(r.venue);
    return r;
  }
  // オッズが一部欠けている（取消・発売前の一部など）ときは、欠けた馬を最低人気の2倍とみなす
  function oddsReady(field){ const n = field.filter(f => f.odds > 1).length; return n >= 2 && n >= field.length * 0.75; }
  function filledOdds(field){ const mx = Math.max(...field.map(f => f.odds > 1 ? f.odds : 0)); return field.map(f => f.odds > 1 ? f.odds : Math.max(mx * 2, 100)); }
  const daysBetween = (a,b) => Math.round((new Date(b) - new Date(a)) / 86400000);
  const wet = g => g === "稍" || g === "重" || g === "不";
  const clamp = (x,a,b) => Math.max(a, Math.min(b, x));
  const mean = a => a.length ? a.reduce((x,y)=>x+y,0)/a.length : null;
  const median = a => { if (!a.length) return null; const s = a.slice().sort((x,y)=>x-y); return s[Math.floor(s.length/2)]; };

  // 1走の内容：着差があれば着差（勝ち馬からの秒差）、なければ着順で評価
  function runScore(r){ return r.field > 1 ? 1 - (r.pos - 1) / (r.field - 1) : 0.5; }
  function runRating(r){
    const base = GRADE_BASE[r.grade] ?? 64;
    if (r.margin != null && !r.overseas) return base + 4 - 9 * clamp(r.margin, -0.8, 3.0);
    return base + 16 * runScore(r) - 10;
  }

  // --- 不利・度外視の判定（コメントのキーワード＋データからの推定） ---
  const TROUBLE_WORDS = ["出遅","不利","挟ま","詰ま","前が壁","外を回","大外","ブレーキ","落鉄","躓","つまず","口向き","掛か","折り合","鼻出血","心房細動","斜行","接触","進路","窮屈","寄られ","立ち遅","スタートで","滑","外傷","跛行","向いてない","不向き","休み明け","距離"];
  function detectTrouble(r, prev, usualEarly, avgL3, mainSurf){
    const why = [];
    if (r.note && TROUBLE_WORDS.some(w => r.note.includes(w))) why.push(r.note);
    if (r.margin != null && r.margin >= 2.5) why.push(`大敗（${r.margin.toFixed(1)}秒差）＝故障・競走能力外の要因の可能性`);
    if (mainSurf && r.surface !== mainSurf && r.surface !== "障" && runScore(r) < 0.5) why.push(`${r.surface === "ダ" ? "ダート" : "芝"}替わり`);
    if ((r.going === "重" || r.going === "不") && r.margin != null && r.margin >= 1.5) why.push("道悪で失速");
    const rel = r.passing.length && r.field > 7 ? (r.passing[0] - 1) / (r.field - 1) : null;
    if (rel != null && usualEarly != null && rel - usualEarly >= 0.35) why.push("出遅れ・位置取り後方（通過順から推定）");
    if (rel != null && rel <= 0.15 && r.last3f && avgL3 && r.last3f - avgL3 >= 1.5 && (r.margin ?? 0) >= 1.0) why.push("先行して失速（ハイペース推定）");
    if (rel != null && rel >= 0.6 && r.last3f && avgL3 && avgL3 - r.last3f >= 0.5 && r.pos >= 4 && (r.margin ?? 9) <= 0.6) why.push("差し届かず（展開不向き推定）");
    if (prev && daysBetween(prev.date, r.date) >= 180) why.push(`長期休み明け（${Math.round(daysBetween(prev.date, r.date) / 30)}か月）`);
    if (r.overseas) why.push("海外遠征");
    return why;
  }

  // --- 穴馬好走パターン（既定値は一般的に言われる傾向の仮置き。analyze_upsets.py の結果で上書き可） ---
  const ANA_DEFAULT = {
    "前走度外視": { pts: 0.8, sig: 0.6, desc: "前走に不利・大敗などの度外視材料" },
    "G1からの格下げ": { pts: 0.6, sig: 0.4, desc: "前走G1で負けての格下げ戦" },
    "実績の割に人気薄": { pts: 0.7, sig: 0.6, desc: "重賞3着以内の実績がありながら6番人気以下" },
    "距離短縮": { pts: 0.4, sig: 0.3, desc: "前走より200m以上の距離短縮" },
    "叩き2戦目": { pts: 0.5, sig: 0.2, desc: "休み明けを一度使われての2戦目" },
    "鞍上強化": { pts: 0.4, sig: 0.2, desc: "前走より騎手評価が上がる乗り替わり" },
    "内枠の先行馬": { pts: 0.4, sig: 0.3, desc: "内枠×先行脚質でロスなく運べる" },
    "コース巧者": { pts: 0.5, sig: 0.3, desc: "同コースで好走歴" }
  };
  let ANA = JSON.parse(JSON.stringify(ANA_DEFAULT));
  function setAnaWeights(w){ ANA = JSON.parse(JSON.stringify(ANA_DEFAULT)); Object.entries(w || {}).forEach(([k, v]) => { if (ANA[k]) Object.assign(ANA[k], v); }); }

  // 枠の有利不利（コース別の目安。正＝内枠有利の強さ）
  function courseGateBias(venue, surface, dist){
    if (surface === "ダ") return dist <= 1400 ? -0.4 : 0.2;          // 短距離ダートは外枠（砂を被らない）
    const key = venue + dist;
    const table = { "東京1800": 0.6, "東京1600": 0.2, "東京2000": 0.8, "京都2400": 0.7, "京都2000": 0.6, "中山2000": 0.6, "中山1600": 1.0, "阪神2000": 0.5, "京都1600": 0.4 };
    return table[key] ?? (dist <= 1400 ? 0.5 : 0.4);
  }

  // ===== 全馬の全走から作る「スピード指数」 =====
  // DBにある全ての走（出走予定馬の過去走すべて）から、コース・距離ごとの基準タイムと
  // 開催日ごとの馬場差（その日の時計の速さ）を推定し、各走を同じ物差し（G3勝ち馬水準＝100）で数値化する。
  const tsec = t => { const m = /^(\d+):(\d+(?:\.\d+)?)$/.exec(t || ""); return m ? +m[1] * 60 + +m[2] : null; };
  const GOING_F = { 芝: { 良: 1, 稍: 1.006, 重: 1.013, 不: 1.022 }, ダ: { 良: 1, 稍: 0.995, 重: 0.99, 不: 0.988 } };
  const formulaTime = (surface, D) => D / (surface === "ダ" ? 17.5 - 0.7 * D / 1000 : 17.9 - 0.5 * D / 1000);
  let SPEED = null, SPEED_KEY = null;
  function buildSpeedModel(horsesDB){
    const key = Object.keys(horsesDB).length + ":" + Object.values(horsesDB).reduce((a, h) => a + (h.runs?.length || 0), 0);
    if (SPEED && SPEED_KEY === key) return SPEED;
    const all = [];
    Object.values(horsesDB).forEach(h => (h.runs || []).forEach(s => {
      const r = parseRun(s); const t = tsec(r.time);
      if (!t || r.overseas || r.surface === "障" || !JRA.has(r.venue) || !(r.dist > 0)) return;
      const win = t - Math.max(0, r.margin ?? 0);
      const gF = GOING_F[r.surface]?.[r.going] ?? 1;
      const classAdj = ((GRADE_BASE[r.grade] ?? 64) - 70) * 0.04 * r.dist / 1000;   // G3水準へ揃える
      all.push({ r, t, win, gF, classAdj, k: `${r.venue}|${r.surface}|${r.dist}`, day: `${r.date}|${r.venue}|${r.surface}`, race: `${r.date}|${r.venue}|${r.surface}${r.dist}|${r.grade}|${r.field}` });
    }));
    // レース単位に重複排除（同じレースに複数頭いる場合）
    const races = new Map(); all.forEach(x => { if (!races.has(x.race)) races.set(x.race, x); });
    const byKey = new Map();
    races.forEach(x => { const v = (x.win + x.classAdj) / x.gF; if (!byKey.has(x.k)) byKey.set(x.k, []); byKey.get(x.k).push(v); });
    const std = new Map(); byKey.forEach((v, k) => { const [, s, d] = k.split("|"); const f = formulaTime(s, +d); std.set(k, v.length >= 3 ? median(v) : (median(v) * v.length + f * 2) / (v.length + 2)); });
    // 開催日ごとの馬場差（2レース以上ある日のみ）
    const dayRes = new Map();
    races.forEach(x => { const e = std.get(x.k); const res = (x.win + x.classAdj) / x.gF - e; if (!dayRes.has(x.day)) dayRes.set(x.day, []); dayRes.get(x.day).push(res); });
    const variant = new Map(); dayRes.forEach((v, k) => { if (v.length >= 2) variant.set(k, mean(v) * v.length / (v.length + 1)); });
    SPEED = { std, variant, nRaces: races.size, nRuns: all.length, nKeys: std.size };
    SPEED_KEY = key;
    return SPEED;
  }
  function speedFigure(r, model){
    const t = tsec(r.time);
    if (!t || !model || r.overseas || r.surface === "障" || !JRA.has(r.venue)) return null;
    const k = `${r.venue}|${r.surface}|${r.dist}`;
    const e = model.std.get(k) ?? formulaTime(r.surface, r.dist);
    const gF = GOING_F[r.surface]?.[r.going] ?? 1;
    const v = model.variant.get(`${r.date}|${r.venue}|${r.surface}`) ?? 0;
    const tAdj = t - ((r.weight ?? 57) - 57) * 0.15;                 // 斤量1kg≒0.15秒
    const scale = 10 * Math.sqrt(1800 / r.dist);
    return Math.round((100 + ((e + v) * gF - tAdj) * scale) * 10) / 10;
  }

  // --- 馬プロファイル（DBに保持する派生指標） ---
  function profile(horse, race, entry, model){
    const runs = (horse.runs || []).map(parseRun).filter(r => r.pos > 0 && r.field > 0)
      .sort((a,b) => b.date.localeCompare(a.date));
    // 取り込んだレース後コメント・SNSの反応（馬ごとに 日付→テキスト）
    runs.forEach(r => { const c = horse.notes?.[r.date]; if (c) r.note = (r.note ? r.note + "／" : "") + c; });
    const D = race.distance, surf = race.surface === "障" ? "芝" : race.surface;
    const flat = runs.filter(r => r.surface !== "障");
    const out = { runs, n: runs.length };
    const surfCount = { 芝: flat.filter(r => r.surface === "芝").length, ダ: flat.filter(r => r.surface === "ダ").length };
    const mainSurf = surfCount.芝 >= surfCount.ダ ? "芝" : "ダ";

    // 脚質（1角通過/頭数）
    const earlyArr = flat.filter(r => r.passing.length && r.field > 4).map(r => (r.passing[0] - 1) / Math.max(1, r.field - 1));
    const usualEarly = median(earlyArr);
    out.earlyPos = earlyArr.length ? mean(earlyArr) : 0.5;
    out.style = out.earlyPos < 0.12 ? "逃げ" : out.earlyPos < 0.35 ? "先行" : out.earlyPos < 0.68 ? "差し" : "追込";
    const gains = flat.filter(r => r.passing.length).map(r => (r.passing[r.passing.length-1] - r.pos) / r.field);
    out.kick = gains.length ? mean(gains) : 0;
    const l3 = flat.map(r => r.last3f).filter(x => x && x < 40);
    out.avgLast3f = l3.length ? mean(l3) : null;

    // 1走ごとの評価と度外視判定
    runs.forEach((r, i) => { r.rating = runRating(r); r.trouble = detectTrouble(r, runs[i + 1], usualEarly, out.avgLast3f, mainSurf); });
    const baseLine = median(runs.map(r => r.rating)) ?? 60;
    runs.forEach(r => {
      r.adjRating = r.rating;
      if (r.trouble.length && r.rating < baseLine){ r.adjRating = baseLine + 0.5 * (r.rating - baseLine); r.discounted = true; }   // マイナス分を0.5倍
    });
    out.discounted = runs.filter(r => r.discounted).length;
    // スピード指数（全馬の全走から作った基準タイムで算出）
    runs.forEach(r => { r.fig = speedFigure(r, model); });
    const figRuns = runs.filter(r => r.fig != null && r.surface === surf && !r.discounted).slice(0, 8);
    if (figRuns.length){
      const w = figRuns.map((r, i) => Math.pow(0.88, i) * (0.5 + 0.5 * Math.exp(-Math.pow((r.dist - D) / 700, 2))));
      const top = figRuns.map((r, i) => ({ f: r.fig, w: w[i] })).sort((a, b) => b.f - a.f).slice(0, Math.max(2, Math.ceil(figRuns.length / 2)));
      out.speedFig = top.reduce((a, x) => a + x.f * x.w, 0) / top.reduce((a, x) => a + x.w, 0);
      out.bestFig = Math.max(...figRuns.map(r => r.fig));
    } else { out.speedFig = null; out.bestFig = null; }
    const l3t = runs.filter(r => r.surface === "芝" && r.last3f && r.last3f < 40).map(r => r.last3f);
    out.bestLast3f = l3t.length ? Math.min(...l3t) : null;

    // 能力（関連度×新しさで加重、度外視補正後）
    let sw = 0, sr = 0, best = -1e9;
    runs.forEach((r, i) => {
      const rec = Math.pow(0.85, i);
      const surfW = r.surface === surf ? 1 : (r.surface === "障" || race.surface === "障") ? 0.2 : 0.5;
      const distW = 0.5 + 0.5 * Math.exp(-Math.pow((r.dist - D) / 800, 2));
      const w = rec * surfW * distW * (r.overseas ? 0.6 : 1);
      sw += w; sr += w * r.adjRating; if (i < 5) best = Math.max(best, r.adjRating - (surfW < 1 ? 4 : 0));
    });
    const raceBase = GRADE_BASE[race.grade] ?? 64;
    out.ability = sw > 0 ? 0.65 * (sr / sw) + 0.35 * best : raceBase - 6;

    // 直近の調子：直近2走と3〜5走目の比較
    const a2 = mean(runs.slice(0, 2).map(r => r.adjRating)), b3 = mean(runs.slice(2, 5).map(r => r.adjRating));
    out.trend = (a2 != null && b3 != null) ? a2 - b3 : 0;

    // 距離適性（着差ベースの内容で重み付け）
    const same = runs.filter(r => r.surface === surf);
    const good = r => clamp((r.adjRating - baseLine + 10) / 20, 0.05, 1);
    let ws = 0, wd = 0;
    same.forEach(r => { const s = good(r); ws += s; wd += s * r.dist; });
    if (ws > 0) {
      const c = wd / ws;
      let v = 0; same.forEach(r => { v += good(r) * (r.dist - c) ** 2; });
      const sd = Math.max(250, Math.sqrt(v / ws));
      out.distCenter = Math.round(c); out.distSpread = Math.round(sd);
      let pts = -6 * Math.min(1, ((D - c) / (sd * 2.5)) ** 2);
      if (same.some(r => (r.pos <= 3 || (r.margin != null && r.margin <= 0.3)) && Math.abs(r.dist - D) <= 200)) pts += 0.8;
      out.distApt = pts * (same.length >= 3 ? 1 : 0.6);
    } else { out.distApt = 0; out.distCenter = null; }

    const rel = arr => { const m = mean(arr.map(r => r.adjRating)), all = mean(flat.map(r => r.adjRating)); return (m != null && all != null) ? m - all : null; };
    // 芝/ダート
    const sDiff = rel(flat.filter(r => r.surface === surf));
    out.surfApt = race.surface === "障" ? 0 : sDiff != null ? clamp(sDiff * 0.3, -3, 2) : (flat.length ? -3.5 : 0);
    // 馬場状態
    const wetR = flat.filter(r => wet(r.going)), dryR = flat.filter(r => r.going === "良");
    out.wetDiff = (wetR.length && dryR.length) ? mean(wetR.map(r => r.adjRating)) - mean(dryR.map(r => r.adjRating)) : null;
    out.wetN = wetR.length;
    out.goingApt = wet(race.going) && out.wetDiff != null ? clamp(out.wetDiff * 0.3, -3, 3) * (race.going === "稍" ? 0.5 : 1) * wetR.length / (wetR.length + 1) : 0;
    // 競馬場（同場・同馬場種別）
    const cr = flat.filter(r => r.venue === race.venue && r.surface === surf);
    const cDiff = rel(cr);
    out.courseRuns = cr.length;
    out.courseGood = cr.some(r => r.pos <= 3 && Math.abs(r.dist - D) <= 400);
    out.courseApt = cDiff != null ? clamp(cDiff * 0.25, -2, 2) * cr.length / (cr.length + 2) : 0;
    // 回り（右/左）
    const dir = DIR[race.venue];
    const dr = flat.filter(r => DIR[r.venue] === dir);
    const dDiff = rel(dr);
    out.dirApt = dDiff != null && dr.length < flat.length ? clamp(dDiff * 0.2, -1.5, 1.5) * dr.length / (dr.length + 2) : 0;
    // 枠（その馬の内外別成績＋コースの枠傾向）
    const N = race.entries?.length || 16;
    const gr = flat.filter(r => r.gate && r.field > 7);
    const inR = gr.filter(r => (r.gate - 1) / (r.field - 1) <= 0.4), outR = gr.filter(r => (r.gate - 1) / (r.field - 1) >= 0.6);
    out.gateHorse = (inR.length && outR.length) ? mean(inR.map(r => r.adjRating)) - mean(outR.map(r => r.adjRating)) : null;
    if (entry){
      const gRel = (entry.num - 1) / Math.max(1, N - 1);                // 0=最内 1=大外
      let g = courseGateBias(race.venue, race.surface, D) * (0.5 - gRel) * 2;
      if (out.gateHorse != null) g += clamp(out.gateHorse * 0.08, -0.6, 0.6) * (gRel <= 0.4 ? 1 : gRel >= 0.6 ? -1 : 0);
      out.gateApt = g;
    } else out.gateApt = 0;

    // 安定度 → 当日のばらつき（度外視補正後）
    const sc = runs.slice(0, 6).map(r => r.adjRating);
    const m = mean(sc); const sdv = sc.length > 1 ? Math.sqrt(sc.reduce((a,x)=>a+(x-m)**2,0)/sc.length) : 6;
    out.sigma = runs.length ? clamp(3.5 + 0.35 * sdv, 4, 9) + (runs.length < 3 ? 1 : 0) : 7;

    // 前走情報（ローテーション）
    const last = runs[0], prev = runs[1];
    out.daysOff = last ? daysBetween(last.date, race.date) : null;
    out.last = last || null;
    out.secondStart = !!(last && prev && daysBetween(prev.date, last.date) >= 90 && out.daysOff <= 70);
    out.distChange = last ? D - last.dist : 0;
    out.weightChange = (last && last.weight && entry?.weight) ? entry.weight - last.weight : 0;
    out.lastJockey = last?.jockey || null;
    out.gradeChange = last ? (GRADE_RANK[race.grade] ?? 4) - (GRADE_RANK[last.grade] ?? 4) : 0;
    out.bigRaceTop3 = runs.some(r => (r.grade === "G1" || r.grade === "G2") && r.pos <= 3);
    return out;
  }

  // ===== 血統（種牡馬の傾向。一般に言われる適性を数値化した目安。DB内の同じ父の産駒成績で補正） =====
  // line: 父系 / dist: 芝の得意距離帯 / wet: 道悪適性(-1〜+1) / grow: 成長力（晩成ほど+）
  const SIRES = {
    "ディープインパクト": { line: "ディープ系", dist: [1600, 2400], wet: -0.3, grow: 0 },
    "キズナ": { line: "ディープ系", dist: [1600, 2400], wet: 0.4, grow: 0.2 },
    "リアルスティール": { line: "ディープ系", dist: [1600, 2000], wet: 0, grow: 0 },
    "シルバーステート": { line: "ディープ系", dist: [1400, 2000], wet: 0.1, grow: 0 },
    "ディープブリランテ": { line: "ディープ系", dist: [1600, 2000], wet: 0.2, grow: 0 },
    "キタサンブラック": { line: "サンデー系", dist: [1800, 3000], wet: 0.2, grow: 0.3 },
    "ヴィクトワールピサ": { line: "サンデー系", dist: [1800, 2400], wet: 0.3, grow: 0 },
    "アドマイヤマーズ": { line: "サンデー系", dist: [1400, 2000], wet: 0, grow: 0 },
    "ゴールドシップ": { line: "ステイゴールド系", dist: [2000, 3200], wet: 0.5, grow: 0.3 },
    "ハーツクライ": { line: "ハーツクライ系", dist: [1800, 2500], wet: 0, grow: 0.4 },
    "スワーヴリチャード": { line: "ハーツクライ系", dist: [1800, 2400], wet: 0, grow: 0.2 },
    "ジャスタウェイ": { line: "ハーツクライ系", dist: [1600, 2400], wet: 0.1, grow: 0.3 },
    "ロードカナロア": { line: "キンカメ系", dist: [1200, 1800], wet: 0, grow: -0.1 },
    "サートゥルナーリア": { line: "キンカメ系", dist: [1600, 2400], wet: 0, grow: 0 },
    "ドゥラメンテ": { line: "キンカメ系", dist: [1800, 2400], wet: 0, grow: 0 },
    "ルーラーシップ": { line: "キンカメ系", dist: [2000, 3200], wet: 0.2, grow: 0.3 },
    "スクリーンヒーロー": { line: "ロベルト系", dist: [1600, 2500], wet: 0.3, grow: 0.3 },
    "モーリス": { line: "ロベルト系", dist: [1600, 2000], wet: 0.2, grow: 0.2 },
    "エピファネイア": { line: "ロベルト系", dist: [1600, 2400], wet: 0.2, grow: 0 },
    "ポエティックフレア": { line: "サドラーズウェルズ系", dist: [1600, 2000], wet: 0.3, grow: 0 },
    "シスキン": { line: "ミスプロ系", dist: [1200, 1800], wet: 0, grow: -0.1 },
    "ファインニードル": { line: "ミスプロ系", dist: [1200, 1600], wet: 0, grow: 0 },
    "アメリカンペイトリオット": { line: "ダンチヒ系", dist: [1400, 1800], wet: 0, grow: 0 },
    "マインドユアビスケッツ": { line: "ノーザンダンサー系", dist: [1400, 2000], wet: 0.2, grow: 0 }
  };
  // 母父の道悪・スタミナの目安
  const DAMSIRE_WET = { "ステイゴールド": 0.4, "Galileo": 0.4, "Frankel": 0.3, "High Chaparral": 0.4, "Lomitas": 0.3, "ジェネラス": 0.3, "Shamardal": 0.2, "ディープインパクト": -0.2, "マンハッタンカフェ": 0.1, "フレンチデピュティ": 0.1, "ルーラーシップ": 0.2, "ブライアンズタイム": 0.3, "ハーツクライ": 0.1, "ネオユニヴァース": 0.2 };
  function bloodProfile(horse, race, horsesDB){
    const s = SIRES[horse.sire];
    const out = { sire: horse.sire || null, line: s?.line || null, why: [] };
    if (!horse.sire) return { ...out, pts: 0 };
    let pts = 0;
    const D = race.distance;
    const runs = (horse.runs || []).map(parseRun);
    const nNear = runs.filter(r => r.surface === race.surface && Math.abs(r.dist - D) <= 200).length;
    const rely = 1 / (1 + nNear / 3);                         // 実績が多い距離ほど血統の重みは小さく
    if (s && race.surface === "芝"){
      const [lo, hi] = s.dist;
      const off = D < lo ? lo - D : D > hi ? D - hi : 0;
      const v = (off === 0 ? 0.5 : -0.9 * Math.min(1, off / 400)) * rely;
      pts += v; if (Math.abs(v) > 0.15) out.why.push(off === 0 ? `父${horse.sire}の得意距離` : `父${horse.sire}には距離${D < lo ? "短い" : "長い"}`);
    }
    if (wet(race.going)){
      const wetN = runs.filter(r => wet(r.going)).length;
      const w = ((s?.wet || 0) * 0.9 + (DAMSIRE_WET[horse.damsire] || 0) * 0.5) * ({ 稍: 0.6, 重: 1, 不: 1.3 }[race.going] || 0) / (1 + wetN / 2);
      pts += w; if (Math.abs(w) > 0.15) out.why.push(w > 0 ? "道悪の血統" : "道悪割引の血統");
    }
    // DB内の同じ父の産駒（他の出走馬・過去走）の成績：この距離帯・馬場種別での着差評価
    const sibs = Object.values(horsesDB).filter(h => h !== horse && h.sire && h.sire === horse.sire);
    if (sibs.length){
      const rs = sibs.flatMap(h => (h.runs || []).map(parseRun)).filter(r => r.surface === race.surface && Math.abs(r.dist - D) <= 400 && r.margin != null && !r.overseas);
      if (rs.length >= 4){ const m = mean(rs.map(r => Math.min(2, r.margin))); const v = clamp((0.8 - m) * 0.6, -0.6, 0.6); pts += v; out.sibs = { n: rs.length, m }; if (Math.abs(v) > 0.15) out.why.push(`同じ父の産駒がこの条件で${v > 0 ? "好成績" : "苦戦"}`); }
    }
    out.pts = pts; return out;
  }
  // ===== 季節：その馬の季節別の成績（今回の開催月の季節と比較） =====
  const seasonOf = d => { const m = +d.slice(5, 7); return m >= 3 && m <= 5 ? "春" : m >= 6 && m <= 8 ? "夏" : m >= 9 && m <= 11 ? "秋" : "冬"; };
  function seasonProfile(runs, raceDate){
    const sNow = seasonOf(raceDate);
    // クラスの上下の影響を除くため「そのレースの中での走り（勝ち馬との着差）」で比較
    const perf = r => r.adjRating - (GRADE_BASE[r.grade] ?? 64);
    const rel = runs.filter(r => !r.overseas && r.adjRating != null && r.margin != null);
    const inS = rel.filter(r => seasonOf(r.date) === sNow), all = mean(rel.map(perf));
    const bySeason = {}; ["春","夏","秋","冬"].forEach(k => { const x = rel.filter(r => seasonOf(r.date) === k); bySeason[k] = x.length ? { n: x.length, top3: x.filter(r => r.pos <= 3).length } : { n: 0, top3: 0 }; });
    if (!inS.length || all == null) return { pts: 0, season: sNow, bySeason };
    const d = mean(inS.map(perf)) - all;
    return { pts: clamp(d * 0.18, -1.2, 1.2) * inS.length / (inS.length + 2), season: sNow, bySeason, diff: d };
  }

  // ===== 学習済みの重み（learn_model.py の出力で上書き。既定は全て1） =====
  let WEIGHTS = {};
  function setWeights(w){ WEIGHTS = { ...(w || {}) }; }

  // --- レース文脈の構築（各馬の総合ポイント内訳） ---
  function buildContext(race, horsesDB, opts = {}){
    const going = opts.going || race.going || "良";
    const R = { ...race, going, grade: race.grade || gradeOf(race.name) };
    const N = R.entries.length;
    const course = courseOf(R.venue, R.surface, R.distance);
    const meanKg = R.entries.reduce((a,e)=>a+e.weight,0) / N;

  // 単勝・複勝それぞれ「モデル確率^(1-β) × 市場確率^β」に統合し、シミュレーションの各回に重みを付けて

  // 市場確率は大穴が過大評価されやすい（本命・大穴バイアス）ので、オッズの逆数を1.1乗して補正。
  let BETA = 0.5;
  function setMarketBeta(b){ if (b >= 0 && b <= 1) BETA = b; }
  function blendWeights(ctx, res, odds){
    const N = ctx.N, R = res.runs, o = res.orders, f = ctx.field, placeK = N <= 7 ? 2 : 3;
    const norm = (a, tot) => { const s = a.reduce((x, y) => x + y, 0) || 1; return a.map(x => x / s * tot); };
    const mWin = norm(odds.map(x => Math.pow(1 / x, 1.1)), 1);
    const hasPlace = f.filter(x => x.placeLo > 0).length >= N * 0.75;
    const w = new Float64Array(R).fill(1);
    const marg = () => { const W1 = new Float64Array(N), P1 = new Float64Array(N); let t = 0;
      for (let r = 0; r < R; r++){ const q = w[r]; t += q; W1[o[r*N]] += q; for (let k = 0; k < placeK; k++) P1[o[r*N+k]] += q; }
      return { win: Array.from(W1, x => x / t), place: Array.from(P1, x => x / t) }; };
    const m0 = marg();
    const comb = (pm, pk) => pm.map((x, i) => Math.pow(Math.max(x, 1e-5), 1 - BETA) * Math.pow(Math.max(pk[i], 1e-5), BETA));
    const tWin = norm(comb(m0.win, mWin), 1);
    let tPlace = null;
    if (hasPlace){
      const mid = f.map((x, i) => x.placeLo > 0 ? (x.placeLo + (x.placeHi || x.placeLo)) / 2 : null);
      const mx = Math.max(...mid.filter(Boolean));
      const mPl = norm(mid.map(v => Math.pow(1 / (v || mx * 2), 1.1)), placeK);
      tPlace = norm(comb(m0.place, mPl), placeK).map(x => Math.min(0.97, x));
    }
    for (let it = 0; it < 6; it++){
      if (tPlace){
        const m = marg(), fac = tPlace.map((t, i) => m.place[i] > 1e-6 ? Math.pow(t / m.place[i], 0.7) : 1);
        for (let r = 0; r < R; r++){ let g = 1; for (let k = 0; k < placeK; k++) g *= fac[o[r*N+k]]; w[r] *= Math.pow(g, 1 / placeK); }
      }
      const m = marg(), fw = tWin.map((t, i) => m.win[i] > 1e-6 ? t / m.win[i] : 1);
      for (let r = 0; r < R; r++) w[r] *= fw[o[r*N]];
    }
    let s = 0; for (let r = 0; r < R; r++) s += w[r];
    for (let r = 0; r < R; r++) w[r] *= R / s;
    let s2 = 0; for (let r = 0; r < R; r++) s2 += w[r] * w[r];
    return { w, ess: R * R / s2, modelWin: m0.win, marketWin: mWin, finalWin: tWin };
  }

  // 候補の買い目を列挙（期待値 = 統合確率 × 払戻倍率）
  //  ・馬連/ワイド/3連複は実オッズ（race.comboOdds）があればそれを使い、なければ単勝オッズから控えめに推定
  //  ・モンテカルロの誤差を見込んだ「控えめな期待値」evL（確率を1標準誤差だけ下げて計算）も持つ
  function candidates(ctx, res){
    const N = ctx.N, f = ctx.field;
    const nOdds = f.filter(x => x.odds > 1).length;
    if (nOdds < 2 || nOdds < N * 0.75) return null;
    const mx = Math.max(...f.map(x => x.odds > 1 ? x.odds : 0));
    const odds = f.map(x => x.odds > 1 ? x.odds : Math.max(mx * 2, 100));
    const B = blendWeights(ctx, res, odds);
    const wres = { orders: res.orders, runs: res.runs, w: B.w, ess: B.ess };
    const M = modelProbs(wres, N), K = marketProbs(odds);
    calibrateToPlace(K, f);
    const R = B.ess, CO = ctx.race?.comboOdds || {};
    const real = { 馬連: !!CO.馬連, ワイド: !!CO.ワイド, 三連複: !!CO.三連複 };
    const out = [];
    const push = (type, idx, p, odds, est, hi) => {
      if (p < MIN_P[type] || !(odds > 1)) return;
      odds = Math.round(odds * 10) / 10;
      const se = Math.sqrt(p * (1 - p) / R);
      out.push({ type, idx, nums: idx.map(i => f[i].num), p, odds, oddsHi: hi || null, est, ev: p * odds, evL: Math.max(0, p - se) * odds, kelly: (p * odds - 1) / (odds - 1) });
    };
    for (let i = 0; i < N; i++){
      if (!(f[i].odds > 1)) continue;          // オッズ不明の馬の単複は買わない
      push("単勝", [i], M.win[i], f[i].odds, false);
      const po = f[i].placeLo > 0 ? f[i].placeLo : Math.max(1.1, (1 - TAKE.複勝) / K.place[i]);
      push("複勝", [i], M.place[i], po, !(f[i].placeLo > 0), f[i].placeHi);
    }
    const est = (q, t) => Math.max(1.5, Math.round((1 - TAKE[t]) / q * 0.85 * 10) / 10);   // 推定配当は控えめに（×0.85）
    const key = idx => idx.map(i => f[i].num).sort((a, b) => a - b).join("-");
    for (let i = 0; i < N; i++) for (let j = i + 1; j < N; j++){
      const k2 = key([i, j]);
      if (real.馬連){ const v = CO.馬連[k2]; if (v) push("馬連", [i, j], M.pair[i*N + j], v, false); }
      else push("馬連", [i, j], M.pair[i*N + j], est(K.pair[i*N + j], "馬連"), true);
      if (real.ワイド){ const v = CO.ワイド[k2]; if (v) push("ワイド", [i, j], M.wide[i*N + j], Array.isArray(v) ? v[0] : v, false, Array.isArray(v) ? v[1] : null); }
      else push("ワイド", [i, j], M.wide[i*N + j], est(K.wide[i*N + j], "ワイド"), true);
      for (let k = j + 1; k < N; k++){
        const p3 = M.trio[(i*N + j)*N + k];
        if (real.三連複){ const v = CO.三連複[key([i, j, k])]; if (v) push("三連複", [i, j, k], p3, v, false); }
        else push("三連複", [i, j, k], p3, est(K.trio[(i*N + j)*N + k], "三連複"), true);
      }
    }
    return { list: out.sort((a, b) => b.ev - a.ev), M, K, real, wres, blend: B };
  }

  function hits(t, o, N, R, placeK, step){
    const h = [];
    const a0 = t.idx[0], a1 = t.idx[1], a2 = t.idx[2];
    for (let r = 0, m = 0; r < R; r += step, m++){
      const x = o[r*N], y = o[r*N+1], z = o[r*N+2];
      let ok = false;
      if (t.type === "単勝") ok = x === a0;
      else if (t.type === "複勝") ok = x === a0 || y === a0 || (placeK === 3 && z === a0);
      else if (t.type === "馬連") ok = (x === a0 && y === a1) || (x === a1 && y === a0);
      else if (t.type === "ワイド") ok = (x === a0 || y === a0 || z === a0) && (x === a1 || y === a1 || z === a1);
      else if (t.type === "三連複") ok = (x === a0 || y === a0 || z === a0) && (x === a1 || y === a1 || z === a1) && (x === a2 || y === a2 || z === a2);
      if (ok) h.push(m);
    }
    return Int32Array.from(h);
  }

  // 予算の配分：シミュレーションの着順（数千〜1万レース分）の上で、資金の対数の期待値（＝長期の資金成長率）を最大にする
  // ケリー基準を、券種どうしの相関（同じレースで同時に当たる・外れる）も含めて100円単位の貪欲法で厳密に解く。
  // 資金は予算の10倍（1レースに資金の1割を使う）と仮定。
  const BANK_MUL = 10;
  function plan(ctx, res, budget, cands){
    if (!cands) return { noOdds: true };
    res = cands.wres; const RW = res.w;
    const units = Math.floor(budget / 100), N = ctx.N, R = res.runs, placeK = N <= 7 ? 2 : 3;
    const maxBets = budget <= 1000 ? 5 : 10;
    const good = cands.list.filter(c => c.ev >= EV_MIN && c.evL >= 1.0);
    const evmax = planEVMax(cands, budget, cands.wres, N);
    if (!good.length){
      const ref = cands.list.slice().sort((a, b) => b.ev - a.ev).slice(0, 3);
      return { none: true, ref, evmax };
    }
    const pool = good.sort((a, b) => b.evL - a.evL).slice(0, 40);
    const step = Math.max(1, Math.floor(R / 6000)), Msz = Math.ceil(R / step);
    const H = pool.map(c => hits(c, res.orders, N, R, placeK, step));
    const W = new Float64Array(Msz).fill(budget * BANK_MUL);
    const QW = new Float64Array(Msz); let qs = 0; for (let m = 0; m < Msz; m++){ QW[m] = RW[m * step]; qs += QW[m]; }
    const stake = new Int32Array(pool.length);
    let used = 0;
    for (let u = 0; u < units; u++){
      let best = -Infinity, bi = -1;
      for (let i = 0; i < pool.length; i++){
        if (!stake[i] && used >= maxBets) continue;
        const pay = 100 * pool[i].odds, h = H[i];
        let g = 0;
        for (let q = 0; q < h.length; q++){ const w = W[h[q]] - 100; g += QW[h[q]] * (Math.log(w + pay) - Math.log(w)); }
        if (g > best){ best = g; bi = i; }
      }
      if (bi < 0) break;
      if (!stake[bi]) used++;
      stake[bi]++;
      for (let m = 0; m < Msz; m++) W[m] -= 100;
      const pay = 100 * pool[bi].odds; H[bi].forEach(m => W[m] += pay);
    }
    const tickets = pool.map((c, i) => ({ ...c, stake: stake[i] * 100 })).filter(t => t.stake > 0)
      .sort((a, b) => b.stake - a.stake || b.ev - a.ev);
    const growth = (() => { let s = 0; for (let m = 0; m < Msz; m++) s += QW[m] * Math.log(W[m] / (budget * BANK_MUL)); return s / qs; })();
    return { tickets, budget, growth, evmax, ...evaluate(res, tickets, N, budget) };
  }

  // 期待値（払戻の平均）だけを最大にする買い方＝期待値が最も高い1点に全額。
  // 確率が小さすぎる買い目は推定誤差が大きいので、誤差を見込んだ控えめな期待値 evL で選ぶ。
  function planEVMax(cands, budget, res, N){
    const c = cands.list.filter(x => x.evL >= 1.0).sort((a, b) => b.evL - a.evL)[0];
    if (!c) return null;
    const t = { ...c, stake: Math.floor(budget / 100) * 100 };
    return { tickets: [t], budget, ...evaluate(res, [t], N, budget) };
  }

  // シミュレーションの着順を使って配分全体の成績を評価
  function evaluate(res, tickets, N, budget){
    const R = res.runs, o = res.orders, placeK = N <= 7 ? 2 : 3, Wt = res.w;
    let sum = 0, hit = 0, profit = 0, hitSum = 0, maxPay = 0, tw = 0;
    for (let r = 0; r < R; r++){
      const top = [o[r*N], o[r*N+1], o[r*N+2]];
      let pay = 0;
      for (const t of tickets){
        const h = t.idx; let ok = false;
        if (t.type === "単勝") ok = top[0] === h[0];
        else if (t.type === "複勝") ok = top.slice(0, placeK).includes(h[0]);
        else if (t.type === "馬連") ok = (top[0] === h[0] && top[1] === h[1]) || (top[0] === h[1] && top[1] === h[0]);
        else if (t.type === "ワイド") ok = top.includes(h[0]) && top.includes(h[1]);
        else if (t.type === "三連複") ok = h.every(x => top.includes(x));
        if (ok) pay += t.stake * t.odds;
      }
      const q = Wt ? Wt[r] : 1; tw += q;
      sum += q * pay; if (pay > 0){ hit += q; hitSum += q * pay; } if (pay > budget) profit += q; if (pay > maxPay) maxPay = pay;
    }
    return { expReturn: sum / tw, hitRate: hit / tw, profitRate: profit / tw, avgHitPay: hit ? hitSum / hit : 0, maxPay };
  }

  return { candidates, plan, EV_MIN, setMarketBeta, get BETA(){ return BETA; } };
})();

      const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.1, 0.1, 3.2, 6), new THREE.MeshStandardMaterial({ color: r % 400 === 0 ? 0xd23a3a : 0xf2f2f2 }));
      pole.position.set(a.x, 1.6, a.z); root.add(pole);
      if (r <= 1000){ const s = textSprite(String(r), "#fff", "#c22", 128, 64, false); s.position.set(a.x, 3.8, a.z); s.scale.set(2.4, 1.2, 1); root.add(s); }
    }
    // ゲート
    const startP = path.finishP - race.distance;
    const sg = path.at(startP - 1.5, (race.entries.length * 1.15) / 2);
    const gate = new THREE.Mesh(new THREE.BoxGeometry(1.2, 2.8, race.entries.length * 1.15 + 1), new THREE.MeshStandardMaterial({ color: 0x2f7a3a, transparent: true, opacity: .55 }));
    gate.position.set(sg.x, 1.4, sg.z); gate.rotation.y = Math.atan2(-sg.hz, sg.hx); root.add(gate);
    world = { root, path, gate };
  }

  // --- レースデータ読込（シミュレーション1回分のトレース） ---
  function load(ctx, trace){
    const race = ctx.race, N = ctx.N;
    buildWorld(ctx.course, race);
    const tWin = Math.min(...trace.times), vAvg = race.distance / tWin;
    const horses = ctx.field.map((f, i) => {
      const waku = f.waku || Engine.wakuOf(f.num, N);
      const hs = hash(f.name);
      const silk = new THREE.Color().setHSL((hs % 360) / 360, .65, .5);
      const m = makeHorse(COATS[hs % COATS.length], silk, new THREE.Color(WAKU[waku - 1]));
      const label = textSprite(String(f.num), WAKU[waku - 1], WAKU_TX[waku - 1]);
      label.scale.set(1.5, 1.5, 1); label.position.y = 3.4; m.add(label);
      world.root.add(m);
      const lead = (0.45 - trace.early[i]) * 30;
      const h = { i, f, waku, mesh: m, lead, delta: trace.times[i] - tWin, T: trace.times[i], lane: ((f.num - 1) * 1.15 + 0.6) / 1.25, tCross: null, d: 0 };
      return h;
    });
    const D = race.distance;
    const raw = (h, t) => {
      const base = t <= tWin ? D * t / tWin : D + vAvg * (t - tWin);
      const tau = t / tWin;
      const hlead = (1 - Math.exp(-tau / 0.06)) * (1 - smooth(0.6, 1.0, tau));
      return base + h.lead * hlead - h.delta * vAvg * smooth(0.55, 1.0, tau);
    };
    horses.forEach(h => {
      let lo = 0, hi = tWin * 1.6; for (let k = 0; k < 50; k++){ const mid = (lo + hi) / 2; if (raw(h, mid) >= D) hi = mid; else lo = mid; }
      h.tCross = hi;
    });
    const tEnd = Math.max(...horses.map(h => h.tCross)) + 4;
    // ゴール前スロー区間：先頭が残り120mに来た時点〜3着馬がゴールして1.2秒後
    const placing = horses.slice().sort((a, b) => a.tCross - b.tCross);
    const L0 = placing[0];
    let lo = 0, hi = L0.tCross; for (let k = 0; k < 40; k++){ const m = (lo + hi) / 2; if (raw(L0, m) >= D - 120) hi = m; else lo = m; }
    const slowStart = hi, slowEnd = placing[Math.min(2, placing.length - 1)].tCross + 1.2;
    const medal = [["1着", "#e2b23c", "#1b1405"], ["2着", "#c9ced6", "#111"], ["3着", "#c98a52", "#1b0f05"]];
    placing.slice(0, 3).forEach((h, k) => {
      const b = textSprite(medal[k][0], medal[k][1], medal[k][2], 160, 80, false);
      b.scale.set(2.8, 1.4, 1); b.position.y = 5.0; b.visible = false; h.mesh.add(b); h.badge = b; h.place = k + 1;
    });
    const prevCam = S?.cam, prevSpeed = S?.speed, prevAuto = S?.autoGoal, prevFocus = S?.focus;
    S = { ctx, trace, horses, raw, D, tWin, vAvg, t: 0, tEnd, playing: false, speed: prevSpeed || 2, cam: prevCam || "中継", autoGoal: prevAuto ?? true,
          slowStart, slowEnd, placing, finishedFired: false, camPos: null, camLook: null, slowMix: 0, focus: prevFocus ?? null };
    const ring = new THREE.Mesh(new THREE.RingGeometry(1.6, 2.2, 32), new THREE.MeshBasicMaterial({ color: 0xffd23a, transparent: true, opacity: 0.9, side: THREE.DoubleSide }));
    ring.rotation.x = -Math.PI / 2; ring.visible = false; world.root.add(ring); S.ring = ring;
    positionAll(0, 0); placeCamera(1, true, 1);
    renderOnce();
  }

  function distAt(h, t){
    if (t <= h.tCross) return Math.max(0, S.raw(h, t));
    const v = S.vAvg; const dt = t - h.tCross;
    return S.D + v * 7 * (1 - Math.exp(-dt / 7));
  }

  function positionAll(t, dt){
    const { horses, D } = S, path = world.path;
    horses.forEach(h => { h.d = distAt(h, t); });
    const sorted = horses.slice().sort((a, b) => b.d - a.d);
    const occ = [];
    const N = horses.length;
    sorted.forEach((h, rank) => {
      const u = h.d / D, rem = D - h.d;
      let pref;
      if (t < 0.01) pref = ((h.f.num - 1) * 1.15 + 0.6) / 1.25;
      else if (rem > 450) pref = 0.3 + Math.min(4, rank * 0.18);
      else pref = 0.3 + Math.max(0, (h.f.prof?.kick || 0) * 10 + (rank > 4 ? 2.5 : 0));
      let best = pref, bestCost = Infinity;
      for (let L = 0; L <= 14; L += 0.5){
        let blocked = false;
        for (const o of occ){ const dd = o.d - h.d; if (Math.abs(o.lane - L) < 1.0 && dd > -0.5 && dd < 3.2){ blocked = true; break; } }
        if (blocked) continue;
        const cost = Math.abs(L - pref) + 0.6 * Math.abs(L - h.lane);
        if (cost < bestCost){ bestCost = cost; best = L; }
      }
      if (t > 0.01 && dt > 0){ const maxStep = 1.4 * dt; h.lane += Math.max(-maxStep, Math.min(maxStep, best - h.lane)); }
      else if (t <= 0.01) h.lane = pref;
      occ.push({ d: h.d, lane: h.lane });
      const p = path.finishP - D + h.d;
      const a = path.at(p, h.lane * 1.25);
      const m = h.mesh;
      m.position.set(a.x, 0, a.z);
      m.rotation.y = Math.atan2(-a.hz, a.hx);
      const phase = h.d / 6.8 * Math.PI * 2;
      const run = t > 0 ? Math.min(1, (h.tCross && t > h.tCross + 5) ? 0.4 : 1) : 0;
      const L = m.userData.legs, amp = 0.65 * run;
      L[0].rotation.z = amp * Math.sin(phase); L[1].rotation.z = amp * Math.sin(phase + 0.35);
      L[2].rotation.z = amp * Math.sin(phase + Math.PI); L[3].rotation.z = amp * Math.sin(phase + Math.PI + 0.35);
      m.position.y = run * 0.1 * Math.abs(Math.sin(phase));
    });
    S.sorted = sorted;
  }

  function placeCamera(dt, snap, rate = 1){
    const path = world.path, { D } = S;
    const sorted = S.sorted, leader = sorted[0], lastH = sorted[sorted.length - 1];
    // 馬群全体（先頭〜最後方）が収まるように、中央を見てカメラ距離を広げる
    const dLead = Math.min(leader.d, D + 30), dLast = Math.min(lastH.d, D + 30);
    const spread = Math.max(8, dLead - dLast);
    const dMid = (dLead + dLast) / 2;
    const pm = path.finishP - D + dMid;
    const pl = path.finishP - D + dLead;
    let pos, look;
    const f = path.at(pm, 6);
    const goalMode = S.cam === "ゴール" || (S.autoGoal && S.cam !== "俯瞰" && S.cam !== "注目馬" && S.t >= S.slowStart - 0.6);
    const wantFov = goalMode ? 24 : 40;
    if (Math.abs(camera.fov - wantFov) > 0.05){ camera.fov += (wantFov - camera.fov) * (snap ? 1 : Math.min(1, dt * 3)); camera.updateProjectionMatrix(); }
    if (goalMode && !S.goalMode) snap = true;   // ゴールカメラへは即切替
    S.goalMode = goalMode;
    const fit = Math.min(260, 40 + spread * 1.15);        // 馬群の長さに応じて引く
    switch (goalMode ? "ゴール" : S.cam){
      case "ゴール": {   // ゴール線の延長上（スタンド側）から線に沿って見る＝写真判定の画角
        const g = path.at(path.finishP, 46); pos = new THREE.Vector3(g.x, 7, g.z);
        const c = path.at(path.finishP, 5); look = new THREE.Vector3(c.x, 1.4, c.z); break; }
      case "追走": { const b = path.at(pm - spread / 2 - 30, 5); pos = new THREE.Vector3(b.x, 10 + spread * 0.25, b.z); const l = path.at(pl + 10, 6); look = new THREE.Vector3(l.x, 1.5, l.z); break; }
      case "俯瞰": { pos = new THREE.Vector3(0, (path.St + 2 * path.R) * 1.15 + 60, 0.01); look = new THREE.Vector3(0, 0, 0); break; }
      case "先頭": { const a = path.at(pl - 4, 22); pos = new THREE.Vector3(a.x, 4, a.z); const l = path.at(pl - 3, 2); look = new THREE.Vector3(l.x, 1.6, l.z); break; }
      case "注目馬": {
        const h = S.horses.find(x => x.f.num === S.focus) || leader;
        const ph = path.finishP - D + Math.min(h.d, D + 30);
        const a = path.at(ph - 12, 24); pos = new THREE.Vector3(a.x, 7, a.z); const l = path.at(ph + 4, h.lane * 1.25); look = new THREE.Vector3(l.x, 1.4, l.z); break; }
      default: { const a = path.at(pm - 4, fit * 0.75); pos = new THREE.Vector3(a.x, 12 + fit * 0.22, a.z); look = new THREE.Vector3(f.x, 1.5, f.z); }
    }
    if (snap || !S.camPos){ S.camPos = pos.clone(); S.camLook = look.clone(); }
    else { const k = 1 - Math.exp(-dt * 2.8 * Math.max(1, rate / 1.2)); S.camPos.lerp(pos, k); S.camLook.lerp(look, k); }   // 倍速ほど速く追従
    camera.position.copy(S.camPos); camera.lookAt(S.camLook);
    const sun = scene.userData.sun; sun.position.set(f.x + 60, 120, f.z + 40); sun.target.position.set(f.x, 0, f.z);
    const sc = sun.shadow.camera, half = Math.max(70, spread / 2 + 30);
    if (Math.abs(sc.right - half) > 5){ sc.left = -half; sc.right = half; sc.top = half; sc.bottom = -half; sc.updateProjectionMatrix(); }
    if (S.ring){ const h = S.horses.find(x => x.f.num === S.focus); S.ring.visible = !!h; if (h){ S.ring.position.set(h.mesh.position.x, 0.12, h.mesh.position.z); } }
  }

  function renderOnce(){ renderer.render(scene, camera); }

  function frame(ts){
    raf = requestAnimationFrame(frame);
    const dt = Math.min(0.05, (ts - (last || ts)) / 1000); last = ts;
    if (!S) return;
    const inSlow = S.autoGoal && S.t >= S.slowStart && S.t <= S.slowEnd;
    S.slowMix += ((inSlow ? 1 : 0) - S.slowMix) * Math.min(1, dt * 4);     // なめらかに減速・復帰
    const rate = S.speed * (1 - 0.8 * S.slowMix);                               // 最大 1/5 速
    if (S.playing){
      S.t = Math.min(S.tEnd, S.t + dt * rate);
      if (S.t >= S.tEnd) S.playing = false;
    }
    S.horses.forEach(h => { if (h.badge) h.badge.visible = S.t >= h.tCross; });
    positionAll(S.t, dt * (S.playing ? rate : 1));
    placeCamera(dt, false, S.playing ? rate : 1);
    if (world.gate) world.gate.visible = S.t < 1.5;
    renderer.render(scene, camera);
    if (onTick) onTick(status());
    const allIn = S.horses.every(h => S.t >= h.tCross);
    if (allIn && !S.finishedFired){ S.finishedFired = true; if (onFinish) onFinish(results()); }
  }

  function status(){
    const lead = S.sorted[0];
    return { t: S.t, tEnd: S.tEnd, playing: S.playing, slow: S.slowMix > 0.5, goalMode: S.goalMode, remaining: Math.max(0, S.D - lead.d),
             D: S.D, str: world.path.St, curveLen: Math.PI * world.path.R, tWin: S.tWin, focus: S.focus,
             order: S.sorted.map(h => ({ num: h.f.num, waku: h.waku, name: h.f.name, d: h.d, done: S.t >= h.tCross, tCross: h.tCross,
               x: h.mesh.position.x, z: h.mesh.position.z })) };
  }
  // 真上から見た全体図用：コースの外形（内ラチ）とゴール・スタート位置
  function mapData(){
    if (!world) return null;
    const path = world.path, pts = [];
    for (let p = 0; p < path.L; p += 8){ const a = path.at(p, -1.5), b = path.at(p, 27); pts.push([a.x, a.z, b.x, b.z]); }
    const g = path.at(path.finishP, -2), g2 = path.at(path.finishP, 29), st = path.at(path.finishP - S.D, 12);
    const marks = []; for (let r = 200; r < S.D; r += 200){ const m = path.at(path.finishP - r, -4); marks.push({ r, x: m.x, z: m.z }); }
    return { pts, goal: [g.x, g.z, g2.x, g2.z], start: [st.x, st.z], marks, R: path.R, St: path.St };
  }
  function setFocus(num){ if (S) S.focus = num; }
  function results(){
    return S.horses.slice().sort((a, b) => a.tCross - b.tCross).map(h => ({ num: h.f.num, waku: h.waku, name: h.f.name, time: h.tCross, jockey: h.f.jockey }));
  }

  function start(){ if (!raf){ last = 0; raf = requestAnimationFrame(frame); } }
  function stop(){ if (raf){ cancelAnimationFrame(raf); raf = 0; } }
  function play(){ if (!S) return; if (S.t >= S.tEnd){ S.t = 0; S.finishedFired = false; } S.playing = true; }
  function pause(){ if (S) S.playing = false; }
  function seek(t){ if (!S) return; S.t = Math.max(0, Math.min(S.tEnd, t)); if (S.t < S.tEnd - 0.1) S.finishedFired = S.horses.every(h => S.t >= h.tCross); }
  function setSpeed(v){ if (S) S.speed = v; }
  function setCam(c){ if (S){ S.cam = c; placeCamera(0, true); } }
  function setAutoGoal(v){ if (S){ S.autoGoal = v; } }
  return { init, load, start, stop, play, pause, seek, setSpeed, setCam, setAutoGoal, setFocus, mapData, resize, WAKU, WAKU_TX, get state(){ return S; } };
})();

<script>
(() => {

      entries: ents ? ents.map((e, i) => ({ num: e[0], waku: Engine.wakuOf(e[0], ents.length), horseId: e[1], name: e[1], sexAge: e[2], weight: e[3], jockey: e[4], trainer: e[5],
        odds: od?.list[i]?.[0], placeLo: od?.list[i]?.[1], placeHi: od?.list[i]?.[2], pop: od?.list[i]?.[3] })) : null });
  });

      entries: N ? r.entries.map(e => ({ ...e, waku: e.waku || Engine.wakuOf(e.num, N), horseId: e.horseId || e.name })) : (DB.races[r.id]?.entries || null) });
    nr++;

function persist(){

const iso = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;

function curRace(){ return DB.races[ST.raceId]; }
// 条件変更時：結果は消さずに「条件変更あり・再実行してください」と表示
function markStale(id){ if (ST.sims[id]) ST.sims[id].stale = true; }
function trackOf(r){ const t = SEED.track?.[r.date + "|" + r.venue]; if (!t) return null; const c = ST.cushion[r.id]; return c != null ? { ...t, cushion: c } : t; }
function trendOf(r){ const k = Object.keys(SEED.trends || {}).find(k => (r.name || "").includes(k)); return k ? { key: k, ...SEED.trends[k] } : null; }
function forecastGoing(r){ const t = trackOf(r); if (!t?.goingProb) return null; return Object.entries(t.goingProb).sort((a, b) => b[1] - a[1])[0][0]; }
function goingOf(r){ return ST.going[r.id] || r.going || forecastGoing(r) || "良"; }
function paceOf(r){ return ST.pace[r.id] || "auto"; }
const PACE_LABEL = { auto: "自然発生", slow: "スロー", mid: "ミドル", high: "ハイ" };
const GOINGS = ["良", "稍", "重", "不"], PACES = ["slow", "mid", "high"];
function makeCtx(r, goingOverride){
  const race = { ...r, going: goingOverride || goingOf(r) };
  const tw = tweaks[r.id] || {};
  if (tw.odds) race.entries = race.entries.map(e => tw.odds[e.num] != null ? { ...e, odds: tw.odds[e.num] || null } : e);
  if (tw.place) race.entries = race.entries.map(e => tw.place[e.num] != null ? { ...e, placeLo: tw.place[e.num] || null } : e);
  return Engine.buildContext(race, DB.horses, { going: race.going, training: tw.training || {}, manual: tw.manual || {}, trend: trendOf(r), track: trackOf(r) });
}

// 複数条件の平均
function averageStats(list, field){
  const N = field.length;
  return field.map((f, i) => {
    const s = list.map(x => x.stats[i]);
    const avg = k => s.reduce((a, x) => a + x[k], 0) / s.length;
    const hist = Array.from({ length: N }, (_, p) => s.reduce((a, x) => a + x.hist[p], 0) / s.length);
    const win = avg("win");
    return { i, num: f.num, name: f.name, win, top2: avg("top2"), top3: avg("top3"), avgPos: avg("avgPos"), fairOdds: win ? 1 / win : null, hist };
  });
}

// 注目穴馬：6番人気以下（オッズ10倍以上）から、複勝期待値と穴要素で選ぶ
function pickDarkHorse(ctx, stats, avgStats, M){
  const cand = ctx.field.map((f, i) => ({ f, i, s: stats[i], a: avgStats[i] }))
    .filter(x => x.f.odds > 1 && (x.f.odds >= 10 || (x.f.pop && x.f.pop >= 6)));
  if (!cand.length || !Engine.oddsReady(ctx.field)) return null;
  cand.forEach(x => {
    const po = x.f.placeLo || Math.max(1.5, x.f.odds / 4);
    x.placeEV = (M ? M.place[x.i] : x.a.top3) * po; x.winEV = (M ? M.win[x.i] : x.a.win) * x.f.odds;
    x.score = x.placeEV + 0.5 * x.winEV + 0.15 * x.f.ana.length;
  });
  cand.sort((a, b) => b.score - a.score);
  return cand[0];
}

// 条件ごとの着順を、重みに比例した本数ずつ混ぜて1つの「予想条件の着順」にする
function mixRes(cells, N){
  const tot = cells.reduce((a, c) => a + c.w, 0) || 1, R = cells[0].m.orders.length / N;
  const out = new Uint8Array(R * N); let k = 0;
  cells.forEach((c, ci) => {
    const o = c.m.orders, Rc = o.length / N;
    const n = ci === cells.length - 1 ? R - k : Math.round(c.w / tot * R);
    for (let j = 0; j < n && k < R; j++, k++) out.set(o.subarray((j % Rc) * N, (j % Rc) * N + N), k * N);
  });
  return { orders: out.subarray(0, k * N), runs: k };
}
let simBusy = false;
async function runSim(silent, opt = {}){
  const r = opt.id ? DB.races[opt.id] : curRace(); if (!r?.entries?.length || simBusy) return;
  simBusy = true;
  const RUNS = opt.runs || ST.runs, isCur = r.id === ST.raceId;
  const btn = isCur ? $("#runBtn") : null; if (btn){ btn.disabled = true; btn.textContent = "計算中…"; }
  try {
    const t0 = performance.now();
    const seed = (Math.random() * 1e9) >>> 0;          // 実行ごとに新しい乱数列
    const total = 1 + GOINGS.length * PACES.length;
    let done = 0;
    const prog = () => p => { if (opt.onProgress) opt.onProgress((done + p) / total); if (!isCur) return; const el = $("#prog"); if (el) el.style.width = ((done + p) / total * 100) + "%"; };
    // 選択条件（馬場×ペース）
    const ctx = makeCtx(r);
    const pm = paceOf(r) === "auto" ? null : paceOf(r);
    const res = await Engine.monteCarlo(ctx, RUNS, seed, prog(), pm); done++;
    // 馬場4×ペース3 の全12条件
    const matrix = {};
    for (const g of GOINGS){
      const cg = makeCtx(r, g);
      for (const p of PACES){
        const m = await Engine.monteCarlo(cg, RUNS, seed + 7919 * (done + 1), prog(), p); done++;

        matrix[g + "|" + p] = { going: g, pace: p, stats: m.stats, ctx: cg, orders: m.orders, seedBase: m.seedBase };
      }
    }
    const avgAll = averageStats(Object.values(matrix), ctx.field);
    // 予想条件で加重：馬場は当日の天気予報、ペースは出走馬の脚質構成から自然に起きる割合
    const t = trackOf(r), pd = res.paceDist;
    const gW = t?.goingProb || Object.fromEntries(GOINGS.map(g => [g, g === goingOf(r) ? 1 : 0]));
    const pf = Engine.paceForecast(ctx);                      // 選んだペースに関係なく、脚質構成から自然に起きる割合
    const pW = { slow: pf.slow, mid: pf.mid, high: pf.high };
    const cells = []; Object.values(matrix).forEach(m => { const w = (gW[m.going] || 0) * (pW[m.pace] || 0); if (w > 0) cells.push({ m, w }); });
    const wsum = cells.reduce((a, c) => a + c.w, 0) || 1;
    const weighted = ctx.field.map((f, i) => {
      const g = k => cells.reduce((a, c) => a + c.m.stats[i][k] * c.w, 0) / wsum;
      const hist = Array.from({ length: ctx.N }, (_, p) => cells.reduce((a, c) => a + c.m.stats[i].hist[p] * c.w, 0) / wsum);
      const win = g("win"); return { i, num: f.num, name: f.name, win, top2: g("top2"), top3: g("top3"), avgPos: g("avgPos"), fairOdds: win ? 1 / win : null, hist };
    });
    // 最も多かった決着（3連単）を加重で集計
    const tri = new Map(); const N = ctx.N;
    cells.forEach(({ m, w }) => { const o = m.orders, R = o.length / N; for (let k = 0; k < R; k++){ const key = o[k*N] + "-" + o[k*N+1] + "-" + o[k*N+2]; tri.set(key, (tri.get(key) || 0) + w / R / wsum); } });
    const triTop = [...tri.entries()].sort((a, b) => b[1] - a[1]).slice(0, 5).map(([k, p]) => ({ idx: k.split("-").map(Number), p }));
    const weightsInfo = { gW, pW, cells: cells.length };
    const replayCells = cells;
    const prev = ST.sims[r.id] || ST.lastSims?.[r.id];
    const runNo = (ST.runCount[r.id] || 0) + 1; ST.runCount[r.id] = runNo;
    // 買い方の計算に使う着順：馬場・ペースを指定したらその条件、指定なしなら予報で加重した全条件の混合
    const explicit = !!ST.going[r.id] || paceOf(r) !== "auto";
    const planRes = explicit ? res : mixRes(cells, ctx.N);
    const cands = Bets.candidates(ctx, planRes);
    const plans = cands ? { 1000: Bets.plan(ctx, planRes, 1000, cands), 5000: Bets.plan(ctx, planRes, 5000, cands) } : null;
    const planBasis = explicit ? `馬場「${ctx.race.going}」・ペース「${PACE_LABEL[paceOf(r)]}」` : "馬場予報×起きやすいペースで加重した全条件";
    const dark = pickDarkHorse(ctx, res.stats, weighted, cands?.M);
    ST.sims[r.id] = { runs: RUNS, ctx, res, matrix, avgAll, weighted, triTop, triMap: tri, replayCells, weightsInfo, cands, plans, planBasis, planRuns: planRes.runs, planRes, dark, seed, runNo, prevStats: prev?.res?.stats || null,
      ms: performance.now() - t0, runPick: "best", going: ctx.race.going, pace: paceOf(r), cell: goingOf(r) + "|" + (pm || "mid") };
    ST.lastSims[r.id] = ST.sims[r.id];
  } catch (err) {
    console.error(err); toast("計算中にエラーが起きました：" + err.message);
  } finally {
    simBusy = false;
    const b = isCur ? $("#runBtn") : null; if (b){ b.disabled = false; b.textContent = "シミュレーション実行"; }
  }
  if (ST.sims[r.id]) BATCH.rows[r.id] = summarizeSim(r, ST.sims[r.id]);
  if (isCur){ renderBand(); renderResult(); }
  if (ST.tab === "all" && !BATCH.running) renderAllTab();
  if (silent === true) return;
  toast(`選択条件＋全12条件（各${RUNS.toLocaleString()}回）の計算が完了しました`);
  setTab("result");
}

// ===== 出馬表 =====
const ADJ_ORDER = ["スピード","レース傾向","当日馬場","血統","季節","調子","距離","芝ダ","馬場","競馬場","回り","枠","斤量","騎手","乗替","調教","ローテ","年齢","穴要素","人気変動","市場","手動"];
function renderCard(){
  const r = curRace(), el = $("#p-card");
  if (!r) { el.innerHTML = ""; return; }
  if (!r.entries){
    el.innerHTML = `<div class="empty"><h3>このレースの出馬表データはまだありません</h3>レース一覧（${r.fieldSize}頭立て）は取得済みです。各馬の過去成績・調教を含む出馬表は、収集スクリプトで取得した JSON を「データ取込」から読み込むと使えます。重賞の毎日王冠・京都大賞典は収録済みなので、すぐに試せます。</div>`;
    return;
  }
  const ctx = makeCtx(r), tw = tweaks[r.id] || {};

    const p = f.prof, h = horseOf(f);

    const disc = p.discounted ? `<span class="chip disc" title="不利・大敗などでマイナス評価を半分にした走">度外視${p.discounted}走</span>` : "";
    return `<tr>
      <td>${ub(f.num, f.waku)}</td>
      <td class="hname"><button data-h="${esc(f.horseId)}">${esc(f.name)}</button><div class="small">${esc(f.sexAge)}・${esc(f.trainer || "")}${f.pop ? `・${f.pop}人気` : ""} ${popMoveHtml(f)}</div><div class="small">${h?.sire ? `父 ${esc(h.sire)}${p.blood?.line ? `（${esc(p.blood.line)}）` : ""}・母父 ${esc(h.damsire || "—")}` : ""}</div>${ana}</td>
      <td class="r num">${f.weight.toFixed(1)}</td>
      <td>${esc(f.jockey)}</td>
      <td><span class="style ${p.style}">${p.n ? p.style : "—"}</span></td>
      <td class="r num">${p.distCenter ? p.distCenter + "m" : "—"}</td>
      <td class="r num">${p.speedFig != null ? p.speedFig.toFixed(1) : "—"}</td>
      <td class="r pt">${p.ability.toFixed(1)}<div>${disc}</div></td>
      <td style="min-width:240px"><div class="breakdown">${bd}</div></td>
      <td><input class="tiny num" type="number" min="0" max="100" step="5" value="${tr}" data-tr="${f.num}" aria-label="${esc(f.name)} 調教評価"></td>
      <td><input class="tiny num" type="number" min="-5" max="5" step="0.5" value="${man}" data-man="${f.num}" aria-label="${esc(f.name)} 手動補正"></td>
      <td><input class="tiny num" type="number" min="1" step="0.1" value="${f.odds ?? ""}" data-odds="${f.num}" aria-label="${esc(f.name)} 単勝オッズ"></td>
      <td><input class="tiny num" type="number" min="1" step="0.1" value="${f.placeLo ?? ""}" data-place="${f.num}" aria-label="${esc(f.name)} 複勝オッズ下限"></td>
      <td class="r pt">${f.P.toFixed(1)}</td>
    </tr>`;
  }).join("");
  el.innerHTML = `
    <div class="tbl-wrap"><table>
      <thead><tr><th>馬番</th><th>馬名・穴要素</th><th class="r">斤量</th><th>騎手</th><th>脚質</th><th class="r">得意距離</th><th class="r">スピード指数</th><th class="r">能力</th><th>補正の内訳（Pt）</th><th>調教</th><th>手動</th><th>単勝</th><th>複勝</th><th class="r">総合Pt</th></tr></thead>
      <tbody>${rows}</tbody></table></div>
    <div class="note"><b>総合Pt</b>＝能力＋補正。1Pt はおよそ 0.1 秒差です。
      <ul class="legend">
        <li><b>スピード指数</b>：DBにある全馬の全走（約630走・約490レース）から、コース・距離ごとの基準タイムと開催日ごとの馬場差（その日の時計の速さ）を推定し、斤量も補正して各走の走破時計を同じ物差しにしたもの（G3勝ち馬の水準＝100、1＝約0.1秒）。</li>
        <li><b>レース傾向</b>：このレースの過去10〜20年の集計（脚質・前走レース・枠・騎手など）を加点に置き換えたもの${trendOf(r) ? `（出典：${esc(trendOf(r).source)}）` : "（このレースは傾向データなし）"}。<b>当日馬場</b>：クッション値・含水率・開催週・天気予報から、前残り・内外・時計の速さへの影響を評価。</li>
        <li><b>血統</b>：父の得意距離・道悪適性（一般に言われる傾向の目安）、母父の道悪適性、DB内の同じ父の産駒のこの条件での成績。その馬自身の実績が多い条件ほど血統の比重は小さくなります。<b>季節</b>：その馬の季節別（春夏秋冬）の走りを、クラスの影響を除いて今回の季節と比較。</li>
        <li><b>能力</b>：過去走を「クラス×勝ち馬との着差」で点数化し、新しい走ほど重く評価。出遅れ・不利・大敗などの<b>度外視材料</b>がある走は、マイナス分を0.5倍にして計算。</li>
        <li><b>調子</b>：直近2走と3〜5走前の比較。<b>競馬場・回り・枠</b>：その馬の同場・右/左回り・内/外枠別の成績と、コースの枠傾向。</li>
        <li><b>乗替</b>：前走騎手との評価差。<b>ローテ</b>：休み明け・連闘。<b>斤量</b>：場平均との差と前走からの増減。</li>
        <li><b>穴要素</b>：前走度外視、G1からの格下げ、実績の割に人気薄、距離短縮、叩き2戦目、鞍上強化、内枠の先行馬、コース巧者。該当すると加点し、当日のブレ（一発の可能性）も大きくします。</li>
      </ul>
      調教・手動・オッズは書き換えると次の実行に反映されます。オッズは${r.oddsAsOf ? ` ${esc(r.oddsAsOf)} 時点の前日オッズを入れてあります` : "空欄です"}。</div>`;
  el.querySelectorAll("[data-h]").forEach(b => b.onclick = () => { ST.dbHorse = b.dataset.h; setTab("db"); });
  const upd = (key, num, val) => { tweaks[r.id] = tweaks[r.id] || {}; tweaks[r.id][key] = tweaks[r.id][key] || {}; tweaks[r.id][key][num] = val; persist(); markStale(r.id); renderCard(); renderResult(); };
  el.querySelectorAll("[data-tr]").forEach(i => i.onchange = () => upd("training", i.dataset.tr, +i.value));
  el.querySelectorAll("[data-man]").forEach(i => i.onchange = () => upd("manual", i.dataset.man, +i.value));
  el.querySelectorAll("[data-odds]").forEach(i => i.onchange = () => upd("odds", i.dataset.odds, +i.value || 0));
  el.querySelectorAll("[data-place]").forEach(i => i.onchange = () => upd("place", i.dataset.place, +i.value || 0));
}
