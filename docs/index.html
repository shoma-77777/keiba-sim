function ticketLabel(t, field){
  return `${t.idx.map(i => ub(field[i].num, field[i].waku)).join(t.type === "単勝" || t.type === "複勝" ? "" : "<span class='small'>-</span>")}`;
}
const yen = x => Math.round(x).toLocaleString() + "円";
function ticketRows(tickets, ctx){
  return tickets.map(t => {
    const payLo = t.stake * t.odds, payHi = t.oddsHi ? t.stake * t.oddsHi : null;
    return `<tr><td>${t.type}</td><td>${ticketLabel(t, ctx.field)}</td><td class="r num"><b>${yen(t.stake)}</b></td>
      <td class="r num pay"><b>${yen(payLo)}</b>${payHi ? `<span class="small">〜${yen(payHi)}</span>` : ""}</td>
      <td class="r num">${t.odds.toFixed(1)}${t.oddsHi ? `<span class="small">〜${t.oddsHi.toFixed(1)}</span>` : ""}${t.est ? "<sup class='small'>推</sup>" : ""}</td>
      <td class="r num">${pct(t.p)}%</td><td class="r num ${evCls(t.ev)}">${t.ev.toFixed(2)}</td></tr>`;
  }).join("");
}
function planKpis(pl, budget){
  return `<div class="kpis">
      <div><span>期待払戻（平均）</span><b class="num">${yen(pl.expReturn)}</b><span class="small">回収率 ${Math.round(pl.expReturn / budget * 100)}%</span></div>
      <div><span>何か当たる確率</span><b class="num">${pct(pl.hitRate)}%</b></div>
      <div><span>当たったときの平均払戻</span><b class="num">${yen(pl.avgHitPay)}</b></div>
      <div><span>プラス収支の確率</span><b class="num">${pct(pl.profitRate)}%</b></div>
      <div><span>最大払戻</span><b class="num">${yen(pl.maxPay)}</b></div>
    </div>`;
}
const PLAN_HEAD = `<thead><tr><th>券種</th><th>買い目</th><th class="r">金額</th><th class="r">的中時の払戻</th><th class="r">オッズ</th><th class="r">的中率</th><th class="r">期待値</th></tr></thead>`;
function planCard(budget, pl, ctx){
  if (!pl) return "";
  if (pl.noOdds) return `<div class="plan"><h4>${budget.toLocaleString()}円</h4><p class="small">オッズが入っていないため期待値を計算できません。「オッズだけ更新」を押すか、「出馬表・補正」タブでオッズを入力してください。</p></div>`;
  const evm = pl.evmax ? `<div class="evmax"><h5>期待値最大（1点集中）<span class="small">払戻の平均が最も大きくなる買い方</span></h5>
      <div class="tbl-wrap"><table>${PLAN_HEAD}<tbody>${ticketRows(pl.evmax.tickets, ctx)}</tbody></table></div>
      <p class="small">期待払戻 <b>${yen(pl.evmax.expReturn)}</b>（回収率 ${Math.round(pl.evmax.expReturn / budget * 100)}%）・的中率 <b>${pct(pl.evmax.hitRate)}%</b>。数学的には期待値最大ですが、${pl.evmax.hitRate < 0.2 ? "外れる回が大半で、" : ""}結果のブレが最も大きい買い方です。</p></div>` : "";
  if (pl.none) return `<div class="plan"><h4>${budget.toLocaleString()}円</h4><p><b>見送り推奨</b>：誤差を見込んでも期待値が ${Bets.EV_MIN.toFixed(2)} を超える買い目がありません。</p><p class="small">参考（期待値上位）：${pl.ref.map(c => `${c.type} ${c.nums.join("-")}（期待値 ${c.ev.toFixed(2)}・${c.odds}倍・100円→${yen(100 * c.odds)}）`).join("、")}</p>${evm}</div>`;
  const total = pl.tickets.reduce((a, t) => a + t.stake, 0);
  return `<div class="plan"><h4>${budget.toLocaleString()}円の配分</h4>
    <h5>推奨（ケリー基準・資金の成長率が最大）</h5>
    <div class="tbl-wrap"><table>${PLAN_HEAD}<tbody>${ticketRows(pl.tickets, ctx)}</tbody>
      <tfoot><tr><td colspan="2" class="r small">合計</td><td class="r num"><b>${yen(total)}</b></td><td colspan="4"></td></tr></tfoot></table></div>
    ${planKpis(pl, budget)}

}
function statsTable(stats, ctx, opts = {}){
  const st = stats.slice().sort((a, b) => b.win - a.win || a.avgPos - b.avgPos);
  const marks = marksFor(st);
  const maxW = st[0].win || 1, N = ctx.N;
  const prevWin = opts.prev ? Object.fromEntries(opts.prev.map(x => [x.num, x.win])) : null;
  const rows = st.map((s, k) => {
    const f = ctx.field[s.i];
    const dist = s.hist.map((p, pos) => `<i title="${pos + 1}着 ${pct(p)}%" style="opacity:${Math.min(1, 0.06 + p * 3.2).toFixed(2)}"></i>`).join("");
    const dv = prevWin ? (s.win - (prevWin[f.num] ?? s.win)) * 100 : null;
    return `<tr class="${opts.dark === f.num ? "darkrow" : ""}">
      <td><span class="mark">${marks[k] || ""}</span></td>
      <td>${ub(f.num, f.waku)}</td>
      <td class="hname">${esc(f.name)}${opts.dark === f.num ? ` <span class="chip ana">注目穴馬</span>` : ""}<div class="small">${esc(f.jockey)}・<span class="style ${f.prof.style}">${f.prof.n ? f.prof.style : "—"}</span>${f.pop ? `・${f.pop}人気` : ""} ${popMoveHtml(f)}</div></td>
      <td class="barcell"><div class="bar"><i style="width:${(s.win / maxW * 100).toFixed(1)}%"></i><span>${pct(s.win)}%</span></div></td>
      ${prevWin ? `<td class="r num small">${dv == null ? "" : `<span class="${dv > 0.3 ? "pos" : dv < -0.3 ? "neg" : ""}">${dv > 0 ? "+" : ""}${dv.toFixed(1)}</span>`}</td>` : ""}
      <td class="r num">${pct(s.top2)}%</td>
      <td class="r num">${pct(s.top3)}%</td>
      <td class="r num">${s.avgPos.toFixed(2)}</td>
      <td class="r num">${s.fairOdds ? (s.fairOdds < 1000 ? s.fairOdds.toFixed(1) : "999+") : "—"}</td>
      <td class="r num small">${f.odds ? f.odds.toFixed(1) : "—"}</td>
      ${(() => { const pw = opts.M ? opts.M.win[s.i] : s.win, pp = opts.M ? opts.M.place[s.i] : placeProb(s, N);
        return `<td class="r num ${f.odds ? evCls(pw * f.odds) : ""}">${f.odds ? (pw * f.odds).toFixed(2) : "—"}</td>
      <td class="r num ${f.placeLo ? evCls(pp * f.placeLo) : ""}">${f.placeLo ? (pp * f.placeLo).toFixed(2) : "—"}</td>`; })()}
      <td><div class="dist" aria-label="着順分布">${dist}</div></td>
    </tr>`;
  }).join("");
  return `<div class="tbl-wrap"><table>
      <thead><tr><th>印</th><th>馬番</th><th>馬名</th><th>1着率</th>${prevWin ? `<th class="r">前回比</th>` : ""}<th class="r">連対率</th><th class="r">複勝率</th><th class="r">平均着順</th><th class="r">想定単勝</th><th class="r">実単勝</th><th class="r" title="1着率×単勝オッズ。1.0超で理論上プラス">単勝期待値</th><th class="r" title="複勝率×複勝オッズ（下限）">複勝期待値</th><th>着順分布（1着→${N}着）</th></tr></thead>
      <tbody>${rows}</tbody></table></div>`;
}

let replayInited = false;
function ensureReplay(){
  if (replayInited) return true;
  if (typeof THREE === "undefined"){ $("#stage").innerHTML = `<div class="empty" style="margin:16px">3D描画ライブラリを読み込めませんでした。ネットワーク接続を確認して再読み込みしてください。</div>`; return false; }
  Replay.init($("#stage"), { onTick: hud, onFinish: showFinish });
  replayInited = true; return true;
}
function runOptions(sim){
  const t = sim.triTop[0], f = sim.ctx.field;
  const opts = [`<option value="best">最も可能性が高い決着（${t.idx.map(i => f[i].num).join("→")}・展開は毎回変わる）</option>`,
                `<option value="rand">1万回の中からランダムに1レース（毎回違う）</option>`];
  f.forEach((x, i) => opts.push(`<option value="w${i}">${x.num} ${esc(x.name)} が勝つレース</option>`));

// 再生するレースを選ぶ：シミュレーションで実際に起きた1回（同じ乱数で完全に再現）を毎回選び直す
function chooseRun(sim, pick){
  const N = sim.ctx.N;
  if (pick === "best"){
    const want = sim.triTop[0].idx;
    // 加重した条件の中から、条件の重みに比例してランダムに選び、その条件で最多決着になった回を探す
    const cand = sim.replayCells.filter(c => true);
    for (let tries = 0; tries < 30; tries++){
      let u = Math.random() * cand.reduce((a, c) => a + c.w, 0), cell = cand[0];
      for (const c of cand){ u -= c.w; if (u <= 0){ cell = c; break; } }
      const o = cell.m.orders, R = o.length / N, hits = [];
      for (let k = 0; k < R; k++) if (o[k*N] === want[0] && o[k*N+1] === want[1] && o[k*N+2] === want[2]) hits.push(k);
      if (hits.length) return { ctx: cell.m.ctx, seed: cell.m.seedBase + hits[Math.floor(Math.random() * hits.length)], pace: cell.m.pace, label: `${cell.m.going}馬場・${PACE_LABEL[cell.m.pace]}ペース` };
    }
  }
  if (pick && pick.startsWith("w")){
    const i = +pick.slice(1), o = sim.res.orders, R = sim.res.runs, hits = [];
    for (let k = 0; k < R; k++) if (o[k*N] === i) hits.push(k);
    if (!hits.length) return null;
    return { ctx: sim.ctx, seed: sim.res.seedBase + hits[Math.floor(Math.random() * hits.length)], pace: sim.res.paceMode, label: `${sim.ctx.race.going}馬場・${PACE_LABEL[sim.pace]}` };
  }
  const k = Math.floor(Math.random() * sim.res.runs);
  return { ctx: sim.ctx, seed: sim.res.seedBase + k, pace: sim.res.paceMode, label: `${sim.ctx.race.going}馬場・${PACE_LABEL[sim.pace]}` };

function loadReplayRun(pick){

  if (!ch){ toast("その馬が勝つ回は1万回の中にありませんでした"); return; }
  sim.runPick = pick;
  const trace = Engine.simulateOne(ch.ctx, ch.seed, true, ch.pace);   // 集計と同じ乱数・同じペース設定で再現
  sim.trace = trace; sim.replayCtx = ch.ctx; sim.replayLabel = ch.label;

  const fp = $("#focusPick"); const prevF = fp.value;
  fp.innerHTML = `<option value="">なし（全体を見る）</option>` + ch.ctx.field.map(f => `<option value="${f.num}">${f.num} ${esc(f.name)}</option>`).join("");
  fp.value = ch.ctx.field.some(f => String(f.num) === prevF) ? prevF : "";

  $("#hudRace").textContent = `${r.venue}${r.no}R ${r.name}`;
  $("#hudPace").textContent = `${ch.label}・この回は${trace.paceLabel}・再生${sim.replayCount}回目`;
  $("#finishBox").hidden = true;
  const ev = trace.events.map((e, i) => e.length ? `${ch.ctx.field[i].num}番 ${e.join("・")}` : "").filter(Boolean);
  $("#passing").innerHTML = `1角想定隊列：${trace.earlyOrder.map(i => ch.ctx.field[i].num).join(" - ")}${ev.length ? "　／　アクシデント：" + esc(ev.join("、")) : ""}`;
  $("#playBtn").textContent = "▶ 再生";

const CM = { lines: [], said: new Set(), lastLeader: null, lastT: 0 };
function say(key, text){ if (CM.said.has(key)) return; CM.said.add(key); CM.lines.push(text); if (CM.lines.length > 3) CM.lines.shift(); $("#commentary").innerHTML = CM.lines.map(l => `<div>${l}</div>`).join(""); }
function resetCommentary(){ CM.lines = []; CM.said = new Set(); CM.lastLeader = null; CM.prevRank = null; $("#commentary").innerHTML = ""; }
const nm = o => `<b>${o.num}番</b>${esc(o.name)}`;
function phaseOf(s){
  if (s.t <= 0.01) return "スタート前";
  const run = s.D - s.remaining;
  if (s.remaining <= 0) return "ゴール";
  if (run < 200) return "スタート直後";
  if (s.remaining <= s.str) return "最後の直線";
  if (s.remaining <= s.str + s.curveLen) return "3〜4コーナー";
  return "道中";

function commentate(s, sim){
  if (s.t < CM.lastT - 0.5) resetCommentary();          // 巻き戻し
  CM.lastT = s.t;
  const o = s.order, lead = o[0], run = s.D - s.remaining, tr = sim.trace, f = sim.ctx.field;
  if (s.t > 0.2) say("start", "スタートしました！");
  tr.events.forEach((e, i) => { if (e.includes("出遅れ") && s.t > 1.5) say("slow" + i, `${nm({ num: f[i].num, name: f[i].name })}は出遅れ、後方からの競馬`); });
  if (run > 250) say("lead", `ハナを切ったのは${nm(o[0])}。2番手に${nm(o[1])}、3番手${nm(o[2])}`);
  if (run > 250 && CM.lastLeader && CM.lastLeader !== lead.num && s.remaining > 30) say("lc" + Math.floor(run / 100) + lead.num, `${nm(lead)}が先頭に立った！`);
  if (run > 250) CM.lastLeader = lead.num;
  if (run >= 1000 && s.D >= 1400){ const t1000 = sim.t1000 ?? (sim.t1000 = s.t); say("1000", `1000m通過は約${t1000.toFixed(1)}秒。${tr.paceLabel === "ハイペース" ? "速い流れ、前の馬にはきつい展開" : tr.paceLabel === "スローペース" ? "ゆったりした流れ、前の馬が有利" : "平均的な流れ"}`); }
  if (s.remaining <= s.str + s.curveLen && s.remaining > s.str) say("corner", `3〜4コーナー。先頭${nm(o[0])}、外から各馬が進出開始`);
  if (s.remaining <= s.str) say("straight", `最後の直線！先頭は${nm(o[0])}、2番手${nm(o[1])}、3番手${nm(o[2])}`);
  // 直線で大きく順位を上げた馬
  if (s.remaining <= s.str && CM.prevRank){
    o.forEach((x, r) => { const pr = CM.prevRank[x.num]; if (pr != null && pr - r >= 3 && r <= 4) say("gain" + x.num, `${nm(x)}が外から一気に追い込んでくる！`); });
  }
  if (!CM.prevRank || Math.floor(s.t) !== CM.rankT){ CM.rankT = Math.floor(s.t); if (!CM.hist) CM.hist = []; CM.hist.push(Object.fromEntries(o.map((x, r) => [x.num, r]))); if (CM.hist.length > 4) CM.hist.shift(); CM.prevRank = CM.hist[0]; }

  if (fin.length) say("win", `${nm(fin[0])}、1着でゴールイン！`);

}
function drawMap(s){
  const cv = $("#minimap"); if (!cv || !cv.getContext) return;
  const md = ST.mapCache || (ST.mapCache = Replay.mapData()); if (!md) return;
  const g = cv.getContext("2d"), W = cv.width, H = cv.height;
  g.clearRect(0, 0, W, H);
  let minX = 1e9, maxX = -1e9, minZ = 1e9, maxZ = -1e9;
  md.pts.forEach(p => { minX = Math.min(minX, p[0], p[2]); maxX = Math.max(maxX, p[0], p[2]); minZ = Math.min(minZ, p[1], p[3]); maxZ = Math.max(maxZ, p[1], p[3]); });
  const pad = 22, sc = Math.min((W - pad * 2) / (maxX - minX), (H - pad * 2) / (maxZ - minZ));
  const ox = W / 2 - (minX + maxX) / 2 * sc, oz = H / 2 - (minZ + maxZ) / 2 * sc;
  const X = x => ox + x * sc, Z = z => oz + z * sc;
  // 走路
  g.beginPath(); md.pts.forEach((p, i) => i ? g.lineTo(X(p[2]), Z(p[3])) : g.moveTo(X(p[2]), Z(p[3]))); g.closePath();
  md.pts.slice().reverse().forEach((p, i) => i ? g.lineTo(X(p[0]), Z(p[1])) : g.moveTo(X(p[0]), Z(p[1]))); g.closePath();

  g.strokeStyle = "rgba(255,255,255,.7)"; g.lineWidth = 1;
  g.beginPath(); md.pts.forEach((p, i) => i ? g.lineTo(X(p[0]), Z(p[1])) : g.moveTo(X(p[0]), Z(p[1]))); g.closePath(); g.stroke();

  g.strokeStyle = "#fff"; g.lineWidth = 3; g.beginPath(); g.moveTo(X(md.goal[0]), Z(md.goal[1])); g.lineTo(X(md.goal[2]), Z(md.goal[3])); g.stroke();
  g.fillStyle = "#fff"; g.font = "bold 12px system-ui"; g.textAlign = "center"; g.fillText("ゴール", X(md.goal[2]), Z(md.goal[3]) + 13);
  g.fillStyle = "#cfe"; g.fillText("スタート", X(md.start[0]), Z(md.start[1]) - 8);

  // 馬
  const big = cv.classList.contains("big");
  const r0 = big ? 8 : 6.5;
  s.order.slice().reverse().forEach(o => {
    const x = X(o.x), z = Z(o.z);
    if (o.num === s.focus){ g.beginPath(); g.arc(x, z, r0 + 4, 0, Math.PI * 2); g.strokeStyle = "#ffd23a"; g.lineWidth = 3; g.stroke(); }
    g.beginPath(); g.arc(x, z, r0, 0, Math.PI * 2); g.fillStyle = WAKU[o.waku - 1]; g.fill(); g.lineWidth = 1; g.strokeStyle = "rgba(0,0,0,.6)"; g.stroke();
    g.fillStyle = WAKU_TX[o.waku - 1]; g.font = `bold ${big ? 10 : 8}px system-ui`; g.textAlign = "center"; g.textBaseline = "middle"; g.fillText(o.num, x, z + 0.5); g.textBaseline = "alphabetic";
  });
  const ld = s.order[0]; g.fillStyle = "#ffd23a"; g.font = "bold 11px system-ui"; g.textAlign = "left"; g.fillText(`先頭 ${ld.num}番`, 8, 15);

function drawLineup(s){

    const xPct = (1 - gaps[i] / maxGap) * 100;
    let row = 0; while (rows[row] != null && Math.abs(rows[row] - xPct) < 3.2) row++; rows[row] = xPct;
    html.push(`<span class="ub${o.num === s.focus ? " focus" : ""}" style="left:${xPct.toFixed(2)}%;top:${4 + (row % 2) * 20}px;background:${WAKU[o.waku - 1]};color:${WAKU_TX[o.waku - 1]}">${o.num}</span>`);

// ===== 全レース一括予想・PCサーバー連携 =====
const BATCH = { running: false, rows: {}, done: 0, total: 0, date: null, saved: {} };
const BATCH_RUNS = 5000;
const ymdOf = d => d.replace(/-/g, "");
const isoOf = y => `${y.slice(0, 4)}-${y.slice(4, 6)}-${y.slice(6, 8)}`;
function summarizeSim(r, sim){
  const w = sim.weighted.slice().sort((a, b) => b.win - a.win);
  const f = sim.ctx.field;
  const mk = s => ({ num: s.num, name: s.name, win: s.win, top3: s.top3, odds: f[s.i].odds ?? null, pop: f[s.i].pop ?? null });
  const tri = sim.triTop[0];
  const tk = t => `${t.type} ${t.nums.join("-")} ${t.stake}円→的中${Math.round(t.stake * t.odds).toLocaleString()}円`;
  const tks = pl => pl && !pl.none && !pl.noOdds && pl.tickets?.length ? pl.tickets.map(t => ({ type: t.type, nums: t.nums, stake: t.stake, odds: t.odds })) : null;
  const planTxt = pl => pl && !pl.none && !pl.noOdds && pl.tickets?.length ? pl.tickets.map(tk) : null;
  const kp = pl => pl && !pl.none && !pl.noOdds && pl.tickets?.length ? { exp: pl.expReturn, hit: pl.hitRate } : null;
  const evm = pl => pl?.evmax ? { t: tk(pl.evmax.tickets[0]), ev: pl.evmax.tickets[0].ev, hit: pl.evmax.hitRate } : null;
  const N = f.length;
  const MM = sim.cands?.M;
  const evs = sim.weighted.map(s => ({ num: s.num, name: s.name, win: f[s.i].odds ? (MM ? MM.win[s.i] : s.win) * f[s.i].odds : null, place: f[s.i].placeLo ? (MM ? MM.place[s.i] : placeProb(s, N)) * f[s.i].placeLo : null }));
  const evTop = evs.flatMap(x => [x.win != null ? { ...x, kind: "単勝", ev: x.win } : null, x.place != null ? { ...x, kind: "複勝", ev: x.place } : null]).filter(Boolean).sort((a, b) => b.ev - a.ev).slice(0, 3).map(x => ({ num: x.num, name: x.name, kind: x.kind, ev: x.ev }));
  const moves = f.filter(x => x.popMove && (x.popMove.ratio >= 1.3 || x.popMove.ratio <= 1 / 1.3)).map(x => ({ num: x.num, name: x.name, ...x.popMove }));
  return { id: r.id, no: r.no, venue: r.venue, name: r.name, surface: r.surface, distance: r.distance, field: f.length, postTime: r.postTime || "",
    going: sim.going, runs: sim.runs, at: new Date().toISOString(),
    marks: w.slice(0, 3).map(mk),
    subs: (() => { const m = marksFor(w); return w.map((x, k) => m[k] === "△" ? mk(x) : null).filter(Boolean); })(),
    pace: (() => { const pf = Engine.paceForecast(sim.ctx); return { slow: pf.slow, mid: pf.mid, high: pf.high, best: pf.best, front: pf.frontCount }; })(),
    t1: tks(sim.plans?.[1000]), t5: tks(sim.plans?.[5000]), te: sim.plans?.[1000]?.evmax ? tks(sim.plans[1000].evmax) : null,
    te5: sim.plans?.[5000]?.evmax ? tks(sim.plans[5000].evmax) : null,
    tri: tri ? { nums: tri.idx.map(i => f[i].num), p: tri.p } : null,
    dark: sim.dark ? { num: sim.dark.f.num, name: sim.dark.f.name, odds: sim.dark.f.odds, pop: sim.dark.f.pop, top3: sim.dark.a.top3 } : null,
    bet: planTxt(sim.plans?.[1000]), bet5: planTxt(sim.plans?.[5000]), k1: kp(sim.plans?.[1000]), k5: kp(sim.plans?.[5000]), evm1: evm(sim.plans?.[1000]),
    favPop: f[w[0].i].pop ?? null, mktFav: (f.filter(x => x.odds > 1).sort((a, b) => a.odds - b.odds)[0] || {}).num ?? null, hasOdds: !!sim.cands, oddsAsOf: r.oddsAsOf || null, evTop, moves };
}
// ===== クラウド版（GitHub Pages）：データは data/*.json、更新は GitHub Actions に依頼 =====
const LS = { get(k, d){ try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } }, set(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} } };
async function staticJson(name, timeout){
  const ctl = new AbortController(); const tm = setTimeout(() => ctl.abort(), timeout || 20000);
  try { const r = await fetch(`data/${name}?t=${Date.now()}`, { cache: "no-store", signal: ctl.signal }); if (!r.ok) throw new Error("HTTP " + r.status); return await r.json(); }
  finally { clearTimeout(tm); }
}
async function cloudConfig(){ if (!SERVER.cfg) SERVER.cfg = await staticJson("config.json").catch(() => ({})); return SERVER.cfg; }
async function gh(path, opt = {}){
  const tok = LS.get("keibaGhToken", "");
  if (!tok) throw new Error("NO_TOKEN");
  const r = await fetch("https://api.github.com" + path, { ...opt, headers: { Accept: "application/vnd.github+json", Authorization: "Bearer " + tok, ...(opt.headers || {}) } });
  if (r.status === 401) throw new Error("トークンが無効です（作り直して設定してください）");
  if (!r.ok && r.status !== 204) throw new Error("GitHub " + r.status + " " + ((await r.json().catch(() => ({}))).message || ""));
  return r.status === 204 ? {} : r.json();
}
async function cloudApi(path, opt){
  const u = new URL(path, "http://x"), p = u.pathname, method = opt?.method || "GET";
  if (p === "/api/status"){
    const st = await staticJson("status.json", opt?.timeout).catch(e => { if (String(e).includes("404")) return { dates: [] }; throw e; });
    const d = new Date(); d.setDate(d.getDate() + ((7 - d.getDay()) % 7));
    return { ...st, running: !!SERVER.cloudWait, nextSunday: iso(d).replace(/-/g, "") };
  }
  if (p === "/api/db"){
    const st = SERVER.status?.dates ? SERVER.status : await staticJson("status.json").catch(() => ({ dates: [] }));
    const out = { races: [], horses: {}, track: {}, dates: [] };
    for (const d of st.dates || []){
      try { const j = await staticJson(`races_${d}.json`, 60000); out.races.push(...(j.races || [])); Object.assign(out.horses, j.horses || {}); Object.assign(out.track, j.track || {}); out.dates.push({ date: d, updated: j.updated, races: (j.races || []).length }); } catch (e) {}
    }
    for (const [fn, key] of [["model_weights.json", "modelWeights"], ["upset_weights.json", "anaWeights"]]){
      try { const j = await staticJson(fn); out[key] = j[key] || j; } catch (e) {}
    }
    return out;
  }
  if (p === "/api/tweaks") return method === "GET" ? {} : { ok: true };
  if (p === "/api/summary"){
    const d = u.searchParams.get("date");
    if (method === "GET") return LS.get("keibaSum." + d, {});
    LS.set("keibaSum." + d, JSON.parse(opt.body)); return { ok: true };
  }
  if (p === "/api/update" || p === "/api/odds" || p === "/api/results"){
    const cfg = await cloudConfig();
    if (!cfg.owner) throw new Error("クラウドの設定ファイルが見つかりません");
    const date = u.searchParams.get("date");
    await gh(`/repos/${cfg.owner}/${cfg.repo}/actions/workflows/${cfg.workflow || "update.yml"}/dispatches`, { method: "POST", body: JSON.stringify({ ref: "main", inputs: { kind: p === "/api/odds" ? "odds" : p === "/api/results" ? "results" : "full", date } }) });
    SERVER.cloudWait = { since: Date.now(), prev: SERVER.status?.updated || "", kind: p === "/api/odds" ? "odds" : p === "/api/results" ? "results" : "full", date };
    return { ok: true, date };
  }
  throw new Error("unsupported " + p);
}
async function api(path, opt){
  if (SERVER.cloud) return cloudApi(path, opt);
  const ctl = new AbortController(); const tm = setTimeout(() => ctl.abort(), opt?.timeout || 15000);
  try { const r = await fetch(path, { cache: "no-store", ...opt, signal: ctl.signal }); if (!r.ok) throw new Error("HTTP " + r.status); return await r.json(); }
  finally { clearTimeout(tm); }
}
function racesOfDay(d){ return Object.values(DB.races).filter(r => r.date === d && r.entries?.length >= 2).sort((a, b) => a.venue.localeCompare(b.venue, "ja") || a.no - b.no); }
function raceStart(r){
  const m = /(\d{1,2}):(\d{2})/.exec(r.postTime || "");
  return new Date(`${r.date}T${m ? m[1].padStart(2, "0") + ":" + m[2] : "23:59"}:00+09:00`);
}
async function runBatch(force){
  if (BATCH.running) return;
  const all = racesOfDay(ST.date);
  // 自動実行のときは、発走済みで発走前の予想が残っているレースはそのまま（答え合わせは発走前の買い目で行う）
  const saved0 = Object.fromEntries((BATCH.saved[ST.date]?.rows || []).map(x => [x.id, x]));
  const now = new Date();
  const list = force === true ? all : all.filter(r => !(raceStart(r) <= now && saved0[r.id] && new Date(saved0[r.id].at) <= raceStart(r)));
  if (!list.length){ toast("この日は出馬表のあるレースがありません。先に全レースを取得してください"); return; }
  while (simBusy) await new Promise(r => setTimeout(r, 100));
  BATCH.running = true; BATCH.date = ST.date; BATCH.done = 0; BATCH.total = list.length;
  list.forEach(r => delete BATCH.rows[r.id]);
  all.filter(r => !list.includes(r)).forEach(r => { BATCH.rows[r.id] = saved0[r.id]; });
  if (!list.length){ BATCH.running = false; renderAllTab(); renderUpd(); return; }
  setTab("all"); renderUpd();
  const t0 = performance.now();
  for (const r of list){
    await runSim(true, { id: r.id, runs: BATCH_RUNS, onProgress: p => setUpdProgress((BATCH.done + p) / BATCH.total, `一括シミュレーション中 ${BATCH.done + 1}/${BATCH.total}：${r.venue}${r.no}R ${r.name}`) });
    BATCH.done++; renderAllTab();
  }
  BATCH.running = false;
  const sec = Math.round((performance.now() - t0) / 1000);
  SERVER.lastMsg = `一括シミュレーション完了：${list.length}レース（各条件${BATCH_RUNS.toLocaleString()}回×13条件・${sec}秒）。「全レース予想」タブで一覧できます`;
  renderUpd(); setUpdProgress(1); renderAllTab(); renderVenues();
  if (SERVER.on){
    // 発走後に計算し直したレースは、発走前の予想（買い目）を preRace として残す
    const rows = all.map(r => { const x = BATCH.rows[r.id]; if (!x) return saved0[r.id] || null; const o = saved0[r.id];
      if (o && x !== o && new Date(x.at) > raceStart(r)){ const pre = o.preRace || (new Date(o.at) <= raceStart(r) ? o : null); if (pre){ const { preRace, ...p } = pre; return { ...x, preRace: p }; } }
      return x; }).filter(Boolean);
    api("/api/summary?date=" + ymdOf(ST.date), { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ date: ST.date, at: new Date().toISOString(), rows }) })
      .then(() => { BATCH.saved[ST.date] = { rows }; }).catch(() => {});
  }
  toast(`全${list.length}レースのシミュレーションが完了しました`);
}

async function startJob(kind){

    const j = await api(`/api/${kind}?date=${ymdOf(d)}`, { method: "POST" });

    toast(kind === "odds" ? "オッズの更新を始めました" : "全レースの取得を始めました。終わると自動で一括シミュレーションします");
    pollJob(true);

    if (err.message === "NO_TOKEN"){ setTab("data"); toast("このスマホから更新するには、最初に一度だけ設定が必要です（下の説明をご覧ください）"); return; }

}
function pollJob(now){
  clearTimeout(SERVER.timer);
  const tick = async () => {
    let s;
    if (SERVER.cloud && SERVER.cloudWait){
      const w = SERVER.cloudWait;
      try { s = await api("/api/status", { timeout: 10000 }); SERVER.on = true; } catch (e) { SERVER.timer = setTimeout(tick, 20000); return; }
      let run = null;
      try { const cfg = await cloudConfig(); const j = await gh(`/repos/${cfg.owner}/${cfg.repo}/actions/runs?per_page=1&event=workflow_dispatch`); run = j.workflow_runs?.[0]; } catch (e) {}
      const mins = Math.round((Date.now() - w.since) / 60000);
      SERVER.lastMsg = `クラウドで${w.kind === "odds" ? "オッズ" : w.kind === "results" ? "レース結果" : "全レース"}を取得中（${run ? (run.status === "completed" ? "取得完了・公開待ち" : run.status === "in_progress" ? "実行中" : "順番待ち") : "依頼済み"}・${mins}分経過）。${w.kind === "full" ? "初回は15〜25分" : "通常2〜5分"}で反映されます。この画面は閉じても大丈夫です。`;
      if (s.updated && s.updated !== w.prev){
        SERVER.cloudWait = null; SERVER.status = { ...s, running: false };
        SERVER.lastMsg = s.error ? "取得エラー：" + s.error : `クラウドの取得が完了（${s.updated.replace("T", " ").slice(0, 16)}）`;
        await loadServerDB(); const d = s.date ? isoOf(s.date) : null;
        if (!s.error && d){ ST.date = d; renderDays(); renderVenues(); if (SERVER.afterCheck){ SERVER.afterCheck = false; showCheck(d); } else { BATCH.saved[d] = undefined; await loadServerSummary(d); runBatch(); } }
        renderUpd(); return;
      }
      if (run && run.status === "completed" && run.conclusion === "failure"){ SERVER.cloudWait = null; SERVER.lastMsg = "クラウドの取得が失敗しました。GitHub の Actions 画面でログを確認できます。"; renderUpd(); return; }
      if (Date.now() - w.since > 40 * 60000){ SERVER.cloudWait = null; SERVER.lastMsg = "時間内に反映されませんでした。少し後で開き直してください。"; renderUpd(); return; }
      SERVER.status = { ...s, running: true }; renderUpd();
      SERVER.timer = setTimeout(tick, 20000); return;
    }
    try { s = await api("/api/status", { timeout: 6000 }); SERVER.on = true; } catch (e) { SERVER.on = false; renderUpd(); SERVER.timer = setTimeout(tick, 5000); return; }
    const was = SERVER.status?.running; SERVER.status = s;
    if (s.running){
      renderUpd(); SERVER.timer = setTimeout(tick, 1500); return;
    }
    renderUpd();
    if (was || SERVER.pendingDate){
      SERVER.lastMsg = s.error ? "取得エラー：" + s.error : `取得完了（${s.finished_at || ""}）`;
      await loadServerDB();
      const d = s.date ? isoOf(s.date) : SERVER.pendingDate;
      SERVER.pendingDate = null;
      if (!s.error && d){ ST.date = d; renderDays(); renderVenues(); renderUpd();
        if (SERVER.afterCheck){ SERVER.afterCheck = false; SERVER.autoBatch = false; showCheck(d); }
        else if (SERVER.autoBatch){ SERVER.autoBatch = false; runBatch(); } }
    }
  };
  SERVER.timer = setTimeout(tick, now ? 800 : 0);
}
async function loadServerDB(){
  try {
    const j = await api("/api/db", { timeout: 60000 });
    if (j.races?.length){
      // 新しいオッズが届いたレースは、以前に手入力したオッズを捨てて新しいオッズを使う
      let cleared = false;
      j.races.forEach(r => { const old = DB.races[r.id], tw = tweaks[r.id];
        if (tw && (tw.odds || tw.place) && r.oddsAsOf && r.oddsAsOf !== old?.oddsAsOf){ delete tw.odds; delete tw.place; cleared = true; } });
      if (cleared) persist();
      mergeImport({ races: j.races, horses: j.horses, modelWeights: j.modelWeights, anaWeights: j.anaWeights });
      Object.assign(SEED.track, j.track || {});
      const last = (j.dates || []).map(d => d.updated).filter(Boolean).sort().pop();
      SERVER.dbDates = Object.fromEntries((j.dates || []).map(d => [d.date, d.updated]));
      DB.meta.sources = DB.meta.sources.filter(x => !x.startsWith("PCのDB")).concat(`PCのDB（${(j.dates || []).length}開催日・最終更新 ${last ? last.replace("T", " ") : "—"}）`);
      // シミュレーション済みの結果は出走表が変わった可能性があるので古い扱いに
      Object.keys(ST.sims).forEach(markStale);
    }
    return j;
  } catch (e) { return null; }
}
async function loadServerSummary(d){

function pickInitialDate(j){

  if (ns && racesOfDay(ns).length) ST.date = ns;
  else if (!racesOfDay(ST.date).length){ const ds = (j?.dates || []).map(d => isoOf(d.date)).filter(d => racesOfDay(d).length).sort(); if (ds.length) ST.date = ds[ds.length - 1]; }
  if (!DB.races[ST.raceId]?.entries || DB.races[ST.raceId].date !== ST.date){ const r = DB.races["202605040211"]?.date === ST.date && DB.races["202605040211"].entries ? DB.races["202605040211"] : racesOfDay(ST.date)[0]; if (r) ST.raceId = r.id; }
}
async function serverInit(){
  if (!SERVER.enabled){ renderUpd(); return; }
  try { SERVER.status = await api("/api/status", { timeout: 5000 }); SERVER.on = true; } catch (e) { SERVER.on = false; }
  if (!SERVER.on){
    // 外出先などでPCに届かないとき：最後に読み込んだDB（端末内キャッシュ）で動かす
    if (!SERVER.cachedLoaded){ SERVER.cachedLoaded = true; const j = await loadServerDB(); if (j?.races?.length){ pickInitialDate(j); renderDays(); renderVenues(); renderAll(); } }
    renderUpd(); if (!Object.keys(ST.sims).length) runSim(true); setTimeout(serverInit, 10000); return;
  }
  if (SERVER.on){
    try { const tw = await api("/api/tweaks"); if (tw && typeof tw === "object" && Object.keys(tw).length) tweaks = tw; } catch (e) {}
    const j = await loadServerDB();
    refreshCloudInfo().then(() => renderUpd());
    pickInitialDate(j);
    renderDays(); renderVenues(); renderAll();
    if (SERVER.status.running){ pollJob(); renderUpd(); return; }
    await loadServerSummary(ST.date);
    // 取得済みでまだ一括予想していない（またはオッズ更新後）の開催日は、開いたときに自動で一括シミュレーション
    const upd = SERVER.dbDates?.[ymdOf(ST.date)], sv = BATCH.saved[ST.date];
    if (racesOfDay(ST.date).length >= 3 && (!sv || (upd && sv.at && new Date(sv.at) < new Date(upd)))){ renderUpd(); runBatch(); return; }
    if (sv?.rows?.length) setTab("all");

  renderUpd();
  if (!Object.keys(ST.sims).length) runSim(true);
}
// ===== 答え合わせ（発走前の買い目 × 実際の払戻） =====
const CHECK = {};
const PAY_KEY = { 単勝: "単勝", 複勝: "複勝", 馬連: "馬連", ワイド: "ワイド", 三連複: "三連複" };
function parseTickets(list){
  if (!list) return null;
  if (typeof list[0] === "object") return list;
  return list.map(t => { const m = /^(単勝|複勝|馬連|ワイド|三連複) ([\d-]+) (\d+)円/.exec(t); return m ? { type: m[1], nums: m[2].split("-").map(Number), stake: +m[3] } : null; }).filter(Boolean);
}
function payOf(t, res){
  const tbl = res.pay?.[PAY_KEY[t.type]]; if (!tbl) return 0;
  const key = t.type === "単勝" || t.type === "複勝" ? String(t.nums[0]) : t.nums.slice().sort((a, b) => a - b).join("-");
  return tbl[key] ? t.stake / 100 * tbl[key] : 0;
}
function checkRows(d){
  const saved = Object.fromEntries((BATCH.saved[d]?.rows || []).map(x => [x.id, x]));
  return Object.values(DB.races).filter(r => r.date === d && r.entries?.length).sort((a, b) => a.venue.localeCompare(b.venue, "ja") || a.no - b.no)
    .map(r => ({ r, row: (() => { const x = BATCH.rows[r.id] || saved[r.id]; return x ? (x.preRace || x) : null; })(), res: r.result || null }));
}
function computeCheck(d){
  const items = checkRows(d).filter(x => x.res && x.row);
  const plans = { "1000": { label: "1,000円（推奨）", key: "t1", alt: "bet" }, "5000": { label: "5,000円（推奨）", key: "t5", alt: "bet5" }, "e1000": { label: "期待値最大 1点（1,000円）", key: "te" }, "e5000": { label: "期待値最大 1点（5,000円）", key: "te5" } };
  const tot = {};
  Object.entries(plans).forEach(([k, p]) => tot[k] = { ...p, invest: 0, ret: 0, races: 0, hitRaces: 0 });
  let fav1 = 0, fav3 = 0, tri = 0, dark3 = 0, darkN = 0, pre = 0;
  const per = {};
  items.forEach(({ r, row, res }) => {
    const o = res.order, out = { order: o.slice(0, 3), plans: {} };
    Object.entries(plans).forEach(([k, p]) => {
      const t = parseTickets(row[p.key] || (p.alt ? row[p.alt] : null));
      if (!t?.length) { out.plans[k] = null; return; }
      const inv = t.reduce((a, x) => a + x.stake, 0), ret = t.reduce((a, x) => a + payOf(x, res), 0);
      tot[k].invest += inv; tot[k].ret += ret; tot[k].races++; if (ret > 0) tot[k].hitRaces++;
      out.plans[k] = { inv, ret, hits: t.filter(x => payOf(x, res) > 0).map(x => `${x.type}${x.nums.join("-")}`) };
    });
    const m0 = row.marks?.[0]?.num;
    if (m0 === o[0]) fav1++; if (o.slice(0, 3).includes(m0)) fav3++;
    if (row.tri && row.tri.nums.join("-") === o.slice(0, 3).join("-")) tri++;
    if (row.dark){ darkN++; if (o.slice(0, 3).includes(row.dark.num)) dark3++; }
    if (new Date(row.at) <= raceStart(r)) pre++;
    out.favPos = o.indexOf(m0) + 1; out.marks = [...(row.marks || []), ...(row.subs || [])].map(x => x.num);
    per[r.id] = out;
  });
  CHECK[d] = { n: items.length, total: checkRows(d).length, tot, fav1, fav3, tri, dark3, darkN, pre, per, at: new Date().toISOString() };
  return CHECK[d];
}
async function startCheck(){
  const d = ST.date, rows = checkRows(d);
  if (!rows.some(x => x.row)){ toast("この日の予想（一括シミュレーション）がありません。先に一括シミュレーションしてください"); return; }
  const need = rows.filter(x => !x.res).length;
  if (!need || !SERVER.enabled){ showCheck(d); return; }
  if (SERVER.cloud && !LS.get("keibaGhToken", "")){ showCheck(d); toast("結果は日曜16:50と17:40に自動で取得されます。すぐ見たいときはPCのアプリで「答え合わせ」を押してください"); return; }
  if (!SERVER.on){ showCheck(d); toast("取得済みの結果だけで集計しました"); return; }
  SERVER.afterCheck = true; SERVER.updDate = d;
  await startJob("results");
}
function showCheck(d){ computeCheck(d); setTab("all"); renderAllTab(); window.scrollTo?.({ top: 0, behavior: "smooth" }); }
function checkPanel(d){

  const row = t => `<tr><td>${t.label}</td><td class="r num">${t.races}</td><td class="r num">${yen(t.invest)}</td><td class="r num">${yen(t.ret)}</td><td class="r num ${t.ret - t.invest >= 0 ? "pos" : "neg"}"><b>${sgn(t.ret - t.invest)}</b></td><td class="r num">${t.invest ? Math.round(t.ret / t.invest * 100) : 0}%</td><td class="r num">${t.hitRaces}/${t.races}</td></tr>`;
  return `<div class="checkbox"><h3>答え合わせ <span class="small">${c.n}/${c.total}レース確定分</span></h3>

      ${(() => { const c = CHECK[d]?.per?.[r.id]; if (!c) return r.result ? `<div class="resline">結果 <b>${r.result.order.slice(0, 3).join("→")}</b></div>` : ""; const pl = k => c.plans[k] ? `${c.plans[k].ret - c.plans[k].inv >= 0 ? "+" : "−"}${Math.abs(Math.round(c.plans[k].ret - c.plans[k].inv)).toLocaleString()}円` : "見送り";
        return `<div class="resline">結果 <b>${c.order.join("→")}</b>　◎${c.favPos ? c.favPos + "着" : "着外"}<br>1,000円 <b class="${c.plans["1000"] && c.plans["1000"].ret >= c.plans["1000"].inv ? "pos" : "neg"}">${pl("1000")}</b>　5,000円 <b class="${c.plans["5000"] && c.plans["5000"].ret >= c.plans["5000"].inv ? "pos" : "neg"}">${pl("5000")}</b>${c.plans["1000"]?.hits.length || c.plans["5000"]?.hits.length ? `<span class="small">（的中 ${[...new Set([...(c.plans["1000"]?.hits || []), ...(c.plans["5000"]?.hits || [])])].join("・")}）</span>` : ""}</div>`; })()}
      <div class="foot"><button class="btn" data-open="${r.id}">詳しく見る・3D再生</button></div>
    </div>`;
  };
  const done = list.map(rowOf).filter(x => x && x.marks?.length);
  const diag = (() => {
    if (done.length < 3) return "";
    const pops = done.map(x => x.favPop).filter(p => p);
    const c = k => pops.filter(p => k(p)).length;
    const expWins = done.reduce((a, x) => a + x.marks[0].win, 0);
    const diff = done.filter(x => x.mktFav != null && x.marks[0].num !== x.mktFav).length;
    return `<div class="diag"><b>◎の人気の内訳</b>（${done.length}レース）：1番人気 ${c(p => p === 1)}・2番人気 ${c(p => p === 2)}・3番人気 ${c(p => p === 3)}・4番人気以下 ${c(p => p >= 4)}。
      ◎の1着率の合計から見込まれる◎の勝利数は <b>${expWins.toFixed(1)}レース</b>（約${Math.round(expWins / done.length * 100)}%）。◎が単勝1番人気と違うレースは ${diff}。<br>
      <span class="small">参考：JRAでは1番人気の勝率はおよそ3割強、1〜3番人気のどれかが勝つのは全体のおよそ3分の2。上位人気が◎に多いのは自然です。もうけは◎ではなく、モデルと市場（オッズ）の見立てがずれる馬から出るので、買い方は◎ではなく期待値で選んでいます。</span></div>`;
  })();
  el.innerHTML = `
    ${checkPanel(d)}
    ${diag}
    <div class="allhead"><h3>${esc(d.slice(5).replace("-", "/"))} 全レース予想</h3><span class="small">${doneN}/${list.length}レース計算済み${BATCH.running ? `（計算中 ${BATCH.done}/${BATCH.total}）` : ""}。一括計算は各条件 ${BATCH_RUNS.toLocaleString()}回×馬場4×ペース3。レースを開いて「シミュレーション実行」を押すと1万回で計算し直せます。</span></div>
    ${venues.map(v => `<h3 class="sec">${esc(v)}</h3><div class="allgrid">${list.filter(r => r.venue === v).map(card).join("")}</div>`).join("")}
    <div class="note">◎○▲は天気予報の馬場と脚質構成から起きやすいペースで重み付けした1着率の上位3頭。確率は過去データにもとづく推定で、的中を保証するものではありません。馬券は余裕資金の範囲で。</div>`;
  el.querySelectorAll("[data-open]").forEach(b => b.onclick = () => { ST.raceId = b.dataset.open; ST.venue = DB.races[ST.raceId]?.venue; renderVenues(); renderAll(); setTab(ST.sims[ST.raceId] ? "result" : "card"); window.scrollTo({ top: 0, behavior: "smooth" }); });
}

// ===== 外出先から使う（クラウド公開） =====
async function refreshCloudInfo(){ if (!SERVER.enabled || SERVER.cloud) return; try { SERVER.cloudInfo = await api("/api/cloud"); } catch (e) {} }
function renderCloudPanel(){
  const el = $("#cloudPanel"); if (!el) return;
  if (!SERVER.enabled){ el.innerHTML = ""; return; }
  if (SERVER.cloud){
    const has = !!LS.get("keibaGhToken", "");
    el.innerHTML = `<div class="drop cloudbox"><h3 style="font-size:15px">このスマホから「全レースを取得」「オッズだけ更新」を使う</h3>
      ${has ? `<p>設定済みです。上のボタンでクラウドに取得を依頼できます（オッズは2〜5分、全レースは15〜25分で反映）。</p><div class="ctrls"><button class="btn" id="ghOff">このスマホの設定を解除</button></div>`
      : `<p class="small">何もしなくても、金曜20時・土曜18時に全レース、土曜夜と日曜7〜16時は30分ごとにオッズが自動で更新されます。<b>好きなときに今すぐ更新したい場合だけ</b>、最初に一度、次の設定をします。</p>
      <ol class="steps">
        <li><a href="https://github.com/settings/personal-access-tokens/new" target="_blank" rel="noopener">GitHub のトークン作成ページ</a>を開く（GitHub にログイン）</li>
        <li>Token name に <span class="mono">keiba-phone</span>、Expiration は <b>1年</b>（365 days）</li>
        <li>Repository access で <b>Only select repositories</b> → <span class="mono">keiba-sim</span> を選ぶ</li>
        <li>Permissions の Repository permissions で <b>Actions</b> を <b>Read and write</b> にする（他はそのまま）</li>
        <li>一番下の Generate token → 表示された <span class="mono">github_pat_…</span> をコピーして下に貼る</li>
      </ol>
      <div class="ctrls"><input id="ghTok" class="mono" placeholder="github_pat_..." style="flex:1;min-width:200px;padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface2);color:var(--ink)"><button class="btn primary" id="ghSave">保存して確認</button></div>
      <p class="small">このトークンでできるのは keiba-sim の自動取得を動かすことだけです。トークンはこのスマホの中にだけ保存されます。</p>`}</div>`;
    const off = $("#ghOff"); if (off) off.onclick = () => { LS.set("keibaGhToken", ""); renderCloudPanel(); };
    const sv = $("#ghSave"); if (sv) sv.onclick = async () => {
      const t = $("#ghTok").value.trim(); if (!t) return;
      LS.set("keibaGhToken", t);
      try { const cfg = await cloudConfig(); await gh(`/repos/${cfg.owner}/${cfg.repo}/actions/workflows`); toast("設定しました。上のボタンで今すぐ更新できます"); }
      catch (e) { LS.set("keibaGhToken", ""); toast("確認できませんでした：" + e.message); }
      renderCloudPanel();
    };
    return;
  }
  const c = SERVER.cloudInfo || {};
  const tokenUrl = "https://github.com/settings/tokens/new?scopes=repo,workflow&description=keiba-sim";
  el.innerHTML = `<div class="drop cloudbox"><h3 style="font-size:15px">外出先からスマホで使う（クラウド公開・無料）</h3>
    ${c.configured ? `
      <p>公開済みです。PCの電源が切れていても、スマホでこのアドレスを開けば最新データで使えます。</p>
      <div class="cloudurl"><a href="${esc(c.url)}" target="_blank" rel="noopener" class="mono">${esc(c.url)}</a>
        <img src="/api/cloud/qr.svg?u=${encodeURIComponent(c.url || "")}" alt="スマホで読み取るQRコード" width="150" height="150" onerror="this.remove()"></div>
      <p class="small">スマホのカメラでQRコードを読み取って開き、共有メニューの「ホーム画面に追加」でアプリのように使えます。初回の公開直後は表示まで1〜3分かかります。
      自動更新は金曜20時・土曜18時（全レース）、土曜夜と日曜7〜16時の30分ごと（オッズ）。PCで取得したときもクラウドへ自動で送ります。${c.lastPush ? `最終送信 ${esc(c.lastPush.replace("T", " "))}。` : ""}
      動作状況は <a href="${esc(c.actionsUrl)}" target="_blank" rel="noopener">GitHub の Actions 画面</a> で見られます。</p>
      <div class="ctrls"><button class="btn" id="cPush" ${c.running ? "disabled" : ""}>今すぐPCのデータをクラウドへ送る</button><button class="btn" id="cRepub" ${c.running ? "disabled" : ""}>クラウドのアプリを最新版にする</button><button class="btn" id="cForget">このPCの公開設定を解除</button></div>`
    : `
      <p class="small">あなたの GitHub（無料）にこのアプリを置き、GitHub が決まった時間に自動でレースとオッズを取得します。設定は最初に一度だけで、あとはPCを消していてもスマホから使えます。</p>
      <ol class="steps">
        <li>GitHub のアカウントがなければ <a href="https://github.com/signup" target="_blank" rel="noopener">github.com/signup</a> で無料登録（メールアドレスとパスワードだけ）</li>
        <li><a href="${tokenUrl}" target="_blank" rel="noopener">トークン作成ページ</a>を開く（<b>repo</b> と <b>workflow</b> にチェックが入った状態で開きます）</li>
        <li>Expiration（有効期限）を <b>No expiration</b> か 1年にして、一番下の <b>Generate token</b> を押す</li>
        <li>表示された <span class="mono">ghp_…</span> をコピーして下に貼り、「クラウドに公開」を押す</li>
      </ol>
      <div class="ctrls"><input id="cTok" class="mono" placeholder="ghp_..." style="flex:1;min-width:220px;padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface2);color:var(--ink)"><button class="btn primary" id="cSetup" ${c.running ? "disabled" : ""}>クラウドに公開</button></div>
      <p class="small">トークンはこのPCの keiba_app フォルダ（cloud.json）にだけ保存され、GitHub への送信にだけ使います。他人に見せないでください。</p>`}
    ${c.running || c.error || c.log?.length ? `<div class="msg">${c.running ? `<b>${esc(c.step)}</b>…` : ""}${c.error ? `<b class="neg">エラー：</b>${esc(c.error)}` : ""}</div><pre class="clog">${esc((c.log || []).join("\n"))}</pre>` : ""}
  </div>`;
  const poll = () => { clearTimeout(SERVER.cloudTimer); SERVER.cloudTimer = setTimeout(async () => { await refreshCloudInfo(); if (ST.tab === "data") renderCloudPanel(); if (SERVER.cloudInfo?.running) poll(); }, 1500); };
  const post = async (path, body) => { try { const j = await api(path, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body || {}) }); if (!j.ok) throw new Error(j.message || "失敗"); SERVER.cloudInfo = { ...c, running: true, error: null }; renderCloudPanel(); poll(); } catch (e) { toast("できませんでした：" + e.message); } };
  const st = $("#cSetup"); if (st) st.onclick = () => { const t = $("#cTok").value.trim(); if (!t) { toast("トークンを貼り付けてください"); return; } post("/api/cloud/setup", { token: t }); };
  const pu = $("#cPush"); if (pu) pu.onclick = () => post("/api/cloud/push");
  const rp = $("#cRepub"); if (rp) rp.onclick = () => post("/api/cloud/republish");
  const fg = $("#cForget"); if (fg) fg.onclick = async () => { await post("/api/cloud/forget"); await refreshCloudInfo(); renderCloudPanel(); };
  if (c.running) poll();
}

// ===== タブ =====
function setTab(t){
  ST.tab = t;
  $("#tabs").querySelectorAll(".tab").forEach(b => b.setAttribute("aria-selected", b.dataset.tab === t));
  ["all","card","result","replay","db","data"].forEach(k => $("#p-" + k).hidden = k !== t);
  if (t === "all") renderAllTab();
  if (t !== "replay" && replayInited) Replay.stop();
  if (t === "replay") renderReplayPanel();
  if (t === "db") renderDB();
  if (t === "data") renderData();
}
$("#tabs").onclick = e => { const b = e.target.closest(".tab"); if (b) setTab(b.dataset.tab); };

function renderAll(){ renderBand(); renderCard(); renderResult(); if (ST.tab === "replay") renderReplayPanel(); if (ST.tab === "db") renderDB(); }
renderDays(); renderVenues(); renderAll(); renderUpd();
if (SERVER.enabled) serverInit(); else runSim(true);
})();
</script>
