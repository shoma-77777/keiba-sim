      ${(x.hasOdds ?? !!x.marks[0]?.odds) ? `${[[1000, x.bet, x.k1, x.bet1s, x.k1s], [5000, x.bet5, x.k5, x.bet5s, x.k5s]].map(([b, bet, k, bs, ks]) => bet
          ? `<div class="line small"><span class="verdict go">勝負</span> <b>${b.toLocaleString()}円</b>（期待払戻 ${Math.round(k.exp).toLocaleString()}円・的中率${pct(k.hit)}%） ${esc(bet.join("／"))}</div>`
          : `<div class="line small"><span class="verdict skip">見送り推奨</span> <b>${b.toLocaleString()}円</b>${bs ? `（買うなら：期待払戻 ${Math.round(ks.exp).toLocaleString()}円・的中率${pct(ks.hit)}%） ${esc(bs.join("／"))}` : "（候補なし）"}</div>`).join("")}${x.evm1 ? `<div class="line small">期待値最大の1点：${esc(x.evm1.t)}（期待値${x.evm1.ev.toFixed(2)}・的中率${pct(x.evm1.hit)}%）</div>` : ""}` : `<div class="line small">オッズ未取得のため期待値・買い目は未計算（「オッズだけ更新」で取得）</div>`}
      ${x.oddsAsOf ? `<div class="cond">オッズ ${esc(x.oddsAsOf)} 時点</div>` : ""}
      ${(() => { const c = CHECK[d]?.per?.[r.id]; if (!c) return r.result ? `<div class="resline">結果 <b>${r.result.order.slice(0, 3).join("→")}</b></div>` : ""; const pl = k => c.plans[k] ? `${c.plans[k].ret - c.plans[k].inv >= 0 ? "+" : "−"}${Math.abs(Math.round(c.plans[k].ret - c.plans[k].inv)).toLocaleString()}円` : "見送り";
        return `<div class="resline">結果 <b>${c.order.join("→")}</b>　◎${c.favPos ? c.favPos + "着" : "着外"}<br>1,000円 <b class="${c.plans["1000"] && c.plans["1000"].ret >= c.plans["1000"].inv ? "pos" : "neg"}">${pl("1000")}</b>　5,000円 <b class="${c.plans["5000"] && c.plans["5000"].ret >= c.plans["5000"].inv ? "pos" : "neg"}">${pl("5000")}</b>${c.plans["1000"]?.hits.length || c.plans["5000"]?.hits.length ? `<span class="small">（的中 ${[...new Set([...(c.plans["1000"]?.hits || []), ...(c.plans["5000"]?.hits || [])])].join("・")}）</span>` : ""}</div>`; })()}
      <div class="foot"><button class="btn" data-open="${r.id}">詳しく見る・3D再生</button></div>
    </div>`;
  };
  const done = list.map(rowOf).filter(x => x && x.marks?.length);
  const diag = (() => {
    if (done.length < 3) return "";
    const pops = done.map(x => x.favPop).filter(p => p);
    const c = k => pops.filter(p => k(p)).length;
    const expWins = done.reduce((a, x) => a + x.marks[0].win, 0);
    const diff = done.filter(x => x.mktFav != null && x.marks[0].num !== x.mktFav).length;
    return `<div class="diag"><b>◎の人気の内訳</b>（${done.length}レース）：1番人気 ${c(p => p === 1)}・2番人気 ${c(p => p === 2)}・3番人気 ${c(p => p === 3)}・4番人気以下 ${c(p => p >= 4)}。
      ◎の1着率の合計から見込まれる◎の勝利数は <b>${expWins.toFixed(1)}レース</b>（約${Math.round(expWins / done.length * 100)}%）。◎が単勝1番人気と違うレースは ${diff}。<br>
      <span class="small">参考：JRAでは1番人気の勝率はおよそ3割強、1〜3番人気のどれかが勝つのは全体のおよそ3分の2。上位人気が◎に多いのは自然です。もうけは◎ではなく、モデルと市場（オッズ）の見立てがずれる馬から出るので、買い方は◎ではなく期待値で選んでいます。</span></div>`;
  })();
  el.innerHTML = `
    ${checkPanel(d)}
    ${CHECK[d] ? checkAllPanel() : ""}
    ${CHECK[d] || LEARN.model ? upsetPanel(d) + learnPanel() : ""}
    ${diag}
    <div class="allhead"><h3>${esc(d.slice(5).replace("-", "/"))} 全レース予想</h3><span class="small">${doneN}/${list.length}レース計算済み${BATCH.running ? `（計算中 ${BATCH.done}/${BATCH.total}）` : ""}。一括計算は各条件 ${BATCH_RUNS.toLocaleString()}回×馬場4×ペース3。レースを開いて「シミュレーション実行」を押すと1万回で計算し直せます。</span></div>
    ${venues.map(v => `<h3 class="sec">${esc(v)}</h3><div class="allgrid">${list.filter(r => r.venue === v).map(card).join("")}</div>`).join("")}
    <div class="note">1,000円・5,000円の買い方と◎○▲は、各レースを「馬場4種×ペース3種」の12条件で各${BATCH_RUNS.toLocaleString()}回走らせ、馬場（発表済みなら発表の馬場、発表前は予報）とペース（脚質構成から計算した各ペースの起きやすさ）の確率で混ぜた結果から計算しています。確率は、学習した比率でオッズと統合し、当日の馬場の偏り・クッション値・馬体重の効き（反映条件を満たすときだけ）も入っています。確率は過去データにもとづく推定で、的中を保証するものではありません。馬券は余裕資金の範囲で。</div>`;
  el.querySelectorAll("[data-cm]").forEach(b => b.onclick = () => { CHECK_MODE.v = b.dataset.cm; CHECK_ALL.res = null; computeCheck(d); renderAllTab(); });
  const pr = el.querySelector("#perfRace"); if (pr) pr.onchange = e => { PERF.race = e.target.value; renderAllTab(); };
  const ca = el.querySelector("#checkAll"); if (ca) ca.onclick = () => checkAllDates();
  el.querySelectorAll("[data-open]").forEach(b => b.onclick = () => { ST.raceId = b.dataset.open; ST.venue = DB.races[ST.raceId]?.venue; renderVenues(); renderAll(); setTab(ST.sims[ST.raceId] ? "result" : "card"); window.scrollTo({ top: 0, behavior: "smooth" }); });
}

// ===== 外出先から使う（クラウド公開） =====
async function refreshCloudInfo(){ if (!SERVER.enabled || SERVER.cloud) return; try { SERVER.cloudInfo = await api("/api/cloud"); } catch (e) {} }
function renderCloudPanel(){
  const el = $("#cloudPanel"); if (!el) return;
  if (!SERVER.enabled){ el.innerHTML = ""; return; }
  if (SERVER.cloud){
    const has = !!LS.get("keibaGhToken", "");
    el.innerHTML = `<div class="drop cloudbox"><h3 style="font-size:15px">このスマホから「全レースを取得」「オッズだけ更新」を使う</h3>
      ${has ? `<p>設定済みです。上のボタンでクラウドに取得を依頼できます（オッズは2〜5分、全レースは15〜25分で反映）。</p><div class="ctrls"><button class="btn" id="ghOff">このスマホの設定を解除</button></div>`
      : `<p class="small">何もしなくても、金曜20時・土曜18時に全レース、土曜夜と日曜7〜16時は30分ごとにオッズが自動で更新されます。<b>好きなときに今すぐ更新したい場合だけ</b>、最初に一度、次の設定をします。</p>
      <ol class="steps">
        <li><a href="https://github.com/settings/personal-access-tokens/new" target="_blank" rel="noopener">GitHub のトークン作成ページ</a>を開く（GitHub にログイン）</li>
        <li>Token name に <span class="mono">keiba-phone</span>、Expiration は <b>1年</b>（365 days）</li>
        <li>Repository access で <b>Only select repositories</b> → <span class="mono">keiba-sim</span> を選ぶ</li>
        <li>Permissions の Repository permissions で <b>Actions</b> を <b>Read and write</b> にする（他はそのまま）</li>
        <li>一番下の Generate token → 表示された <span class="mono">github_pat_…</span> をコピーして下に貼る</li>
      </ol>
      <div class="ctrls"><input id="ghTok" class="mono" placeholder="github_pat_..." style="flex:1;min-width:200px;padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface2);color:var(--ink)"><button class="btn primary" id="ghSave">保存して確認</button></div>
      <p class="small">このトークンでできるのは keiba-sim の自動取得を動かすことだけです。トークンはこのスマホの中にだけ保存されます。</p>`}</div>`;
    const off = $("#ghOff"); if (off) off.onclick = () => { LS.set("keibaGhToken", ""); renderCloudPanel(); };
    const sv = $("#ghSave"); if (sv) sv.onclick = async () => {
      const t = $("#ghTok").value.trim(); if (!t) return;
      LS.set("keibaGhToken", t);
      try { const cfg = await cloudConfig(); await gh(`/repos/${cfg.owner}/${cfg.repo}/actions/workflows`); toast("設定しました。上のボタンで今すぐ更新できます"); }
      catch (e) { LS.set("keibaGhToken", ""); toast("確認できませんでした：" + e.message); }
      renderCloudPanel();
    };
    return;
  }
  const c = SERVER.cloudInfo || {};
  const tokenUrl = "https://github.com/settings/tokens/new?scopes=repo,workflow&description=keiba-sim";
  el.innerHTML = `<div class="drop cloudbox"><h3 style="font-size:15px">外出先からスマホで使う（クラウド公開・無料）</h3>
    ${c.configured ? `
      <p>公開済みです。PCの電源が切れていても、スマホでこのアドレスを開けば最新データで使えます。</p>
      <div class="cloudurl"><a href="${esc(c.url)}" target="_blank" rel="noopener" class="mono">${esc(c.url)}</a>
        <img src="/api/cloud/qr.svg?u=${encodeURIComponent(c.url || "")}" alt="スマホで読み取るQRコード" width="150" height="150" onerror="this.remove()"></div>
      <p class="small">スマホのカメラでQRコードを読み取って開き、共有メニューの「ホーム画面に追加」でアプリのように使えます。初回の公開直後は表示まで1〜3分かかります。
      自動更新は金曜20時・土曜18時（全レース）、土曜夜と日曜7〜16時の30分ごと（オッズ）。PCで取得したときもクラウドへ自動で送ります。${c.lastPush ? `最終送信 ${esc(c.lastPush.replace("T", " "))}。` : ""}
      動作状況は <a href="${esc(c.actionsUrl)}" target="_blank" rel="noopener">GitHub の Actions 画面</a> で見られます。</p>
      <div class="ctrls"><button class="btn" id="cPush" ${c.running ? "disabled" : ""}>今すぐPCのデータをクラウドへ送る</button><button class="btn" id="cRepub" ${c.running ? "disabled" : ""}>クラウドのアプリを最新版にする</button><button class="btn" id="cForget">このPCの公開設定を解除</button></div>`
    : `
      <p class="small">あなたの GitHub（無料）にこのアプリを置き、GitHub が決まった時間に自動でレースとオッズを取得します。設定は最初に一度だけで、あとはPCを消していてもスマホから使えます。</p>
      <ol class="steps">
        <li>GitHub のアカウントがなければ <a href="https://github.com/signup" target="_blank" rel="noopener">github.com/signup</a> で無料登録（メールアドレスとパスワードだけ）</li>
        <li><a href="${tokenUrl}" target="_blank" rel="noopener">トークン作成ページ</a>を開く（<b>repo</b> と <b>workflow</b> にチェックが入った状態で開きます）</li>
        <li>Expiration（有効期限）を <b>No expiration</b> か 1年にして、一番下の <b>Generate token</b> を押す</li>
        <li>表示された <span class="mono">ghp_…</span> をコピーして下に貼り、「クラウドに公開」を押す</li>
      </ol>
      <div class="ctrls"><input id="cTok" class="mono" placeholder="ghp_..." style="flex:1;min-width:220px;padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface2);color:var(--ink)"><button class="btn primary" id="cSetup" ${c.running ? "disabled" : ""}>クラウドに公開</button></div>
      <p class="small">トークンはこのPCの keiba_app フォルダ（cloud.json）にだけ保存され、GitHub への送信にだけ使います。他人に見せないでください。</p>`}
    ${c.running || c.error || c.log?.length ? `<div class="msg">${c.running ? `<b>${esc(c.step)}</b>…` : ""}${c.error ? `<b class="neg">エラー：</b>${esc(c.error)}` : ""}</div><pre class="clog">${esc((c.log || []).join("\n"))}</pre>` : ""}
  </div>`;
  const poll = () => { clearTimeout(SERVER.cloudTimer); SERVER.cloudTimer = setTimeout(async () => { await refreshCloudInfo(); if (ST.tab === "data") renderCloudPanel(); if (SERVER.cloudInfo?.running) poll(); }, 1500); };
  const post = async (path, body) => { try { const j = await api(path, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body || {}) }); if (!j.ok) throw new Error(j.message || "失敗"); SERVER.cloudInfo = { ...c, running: true, error: null }; renderCloudPanel(); poll(); } catch (e) { toast("できませんでした：" + e.message); } };
  const st = $("#cSetup"); if (st) st.onclick = () => { const t = $("#cTok").value.trim(); if (!t) { toast("トークンを貼り付けてください"); return; } post("/api/cloud/setup", { token: t }); };
  const pu = $("#cPush"); if (pu) pu.onclick = () => post("/api/cloud/push");
  const rp = $("#cRepub"); if (rp) rp.onclick = () => post("/api/cloud/republish");
  const fg = $("#cForget"); if (fg) fg.onclick = async () => { await post("/api/cloud/forget"); await refreshCloudInfo(); renderCloudPanel(); };
  if (c.running) poll();
}

// ===== タブ =====
function setTab(t){
  ST.tab = t;
  $("#tabs").querySelectorAll(".tab").forEach(b => b.setAttribute("aria-selected", b.dataset.tab === t));
  ["all","card","result","replay","learn","db","data"].forEach(k => $("#p-" + k).hidden = k !== t);
  if (t === "learn") renderLearnTab();
  if (t === "all") renderAllTab();
  if (t !== "replay" && replayInited) Replay.stop();
  if (t === "replay") renderReplayPanel();
  if (t === "db") renderDB();
  if (t === "data") renderData();
}
$("#tabs").onclick = e => { const b = e.target.closest(".tab"); if (b) setTab(b.dataset.tab); };

function renderAll(){ renderBand(); renderCard(); renderResult(); if (ST.tab === "replay") renderReplayPanel(); if (ST.tab === "db") renderDB(); }
renderDays(); renderVenues(); renderAll(); renderUpd();
// ヘッドレス実行（クラウドで発走前の予想を自動記録する predict_run.js から使う）
if (typeof globalThis !== "undefined" && globalThis.__HEADLESS){ globalThis.__APP = { ST, DB, SERVER, BATCH, BATCH_RUNS, LEARN, runSim, racesOfDay, raceStart, loadServerDB, loadLearn, api, preRowOf }; }
else if (SERVER.enabled) serverInit(); else runSim(true);
})();
</script>
