      (h.ana || []).forEach(a => why.push("穴パターン:" + a));
      const plus = FEATS.map((k, j) => [k, h.z[j] - mean[j]]).filter(([, d]) => d >= 0.6).sort((a, b) => b[1] - a[1]).slice(0, 3);
      plus.forEach(([k]) => why.push("強み:" + k));
      return { id: r.id, date: r.date, venue: r.venue, num: h.num, pop: h.pop, odds: h.odds, pos: h.pos, pm: h.pm, pk: h.pk, why, favFlop };
    });
  }
  // 穴馬（6番人気以下）の中で、各要因があったときの3着内率と、なかったときの比（リフト）
  // 確定オッズから見た「3着以内に入る確率」（Harville。人気薄の2・3着を少なめに見積もるくせは、全穴馬の比で割って打ち消す）
  function top3FromMarket(pk){
    const n = pk.length, out = new Array(n).fill(0);
    for (let i = 0; i < n; i++){ out[i] += pk[i];
      for (let j = 0; j < n; j++){ if (j === i) continue; const pj = pk[j], d1 = 1 - pj; if (d1 <= 0) continue; out[i] += pj * pk[i] / d1;
        for (let k = 0; k < n; k++){ if (k === i || k === j) continue; const d2 = 1 - pj - pk[k]; if (d2 <= 0) continue; out[i] += pj * pk[k] / d1 * pk[i] / d2; } } }
    return out;
  }
  // 穴馬（6番人気以下・15倍以上）について、各要因があったときに「オッズから見た期待」より何倍3着以内に来たか。
  // 人気（オッズ）の差でできる見かけの差は取り除き、オッズが見落としていた分だけを測る（お金になるのはこの分だけ）
  function upsetStats(recs){
    const cnt = {}; let base = 0, baseHit = 0, baseExp = 0;
    recs.forEach(r => {
      const H = r.h.filter(h => h.pos && h.pk > 0); if (H.length < 5) return;
      const s = H.reduce((a, h) => a + h.pk, 0), t3 = top3FromMarket(H.map(h => h.pk / s));
      H.forEach((h, i) => { if (!isLong(h)) return;
        base++; const hit = h.pos <= 3; if (hit) baseHit++; baseExp += t3[i];
        const keys = [];
        if (h.early != null && h.early <= 0.25) keys.push("展開:前に行った");
        if (h.early != null && h.early >= 0.55) keys.push("展開:後方待機");
        if (h.gate <= 0.2) keys.push("枠:内枠"); if (h.gate >= 0.8) keys.push("枠:外枠");
        if (r.going && r.going !== "良") keys.push("馬場:道悪");
        if (h.pm >= h.pk * 1.3) keys.push("モデル:市場より高評価");
        (h.ana || []).forEach(a => keys.push("穴パターン:" + a));
        keys.forEach(k => { const c = (cnt[k] ||= { n: 0, hit: 0, exp: 0 }); c.n++; if (hit) c.hit++; c.exp += t3[i]; });
      });
    });
    const p0 = base ? baseHit / base : 0, r0 = baseExp ? baseHit / baseExp : 1;
    return { longshots: base, top3Rate: +p0.toFixed(4), marketRatio: +r0.toFixed(3), factors: Object.entries(cnt).map(([k, c]) => {
      const e = c.exp * r0;                                   // くせを打ち消した期待数
      const lift = (c.hit + 2) / (e + 2);                     // 件数が少ないときは1に寄せる
      const z = e > 0 ? (c.hit - e) / Math.sqrt(e) : 0;
      return { k, n: c.n, hit: c.hit, exp: +e.toFixed(1), rate: +(c.hit / c.n).toFixed(4), lift: +lift.toFixed(3), z: +z.toFixed(2) };
    }).sort((a, b) => b.lift - a.lift) };
  }
  // 穴パターンの加点を、穴馬の3着内率のリフトから更新（件数が少ないうちは初期値のまま）
  const ANA_PTS = { "前走度外視": 0.8, "G1からの格下げ": 0.6, "実績の割に人気薄": 0.7, "距離短縮": 0.4, "叩き2戦目": 0.5, "鞍上強化": 0.4, "内枠の先行馬": 0.4, "コース巧者": 0.5,
    // 追加の候補（初期値0。オッズ以上に来ると分かったものだけ加点が育つ）
    "前走で追い込み届かず": 0, "先行力あり": 0, "単騎逃げ見込み": 0, "斤量3kg以上減": 0, "減量騎手": 0, "芝ダ替わり": 0,
    "道悪巧者×道悪": 0, "調教高評価の人気薄": 0, "直前に買われた": 0, "持ち時計上位": 0, "昇級2戦目": 0, "鉄砲駆け実績": 0 };
  function anaWeights(stats){
    const out = {};
    Object.entries(ANA_PTS).forEach(([k, pts]) => {
      const f = stats.factors.find(x => x.k === "穴パターン:" + k); if (!f) return;
      const t = f.n / (f.n + 300);                       // 300頭分で半分の重み（偶然の偏りに振り回されないように）
      // オッズ比のリフトから加点を決める（リフト2倍 ≒ +1.7Pt）。偶然と区別できない（|z|<1.5）ときは加点0の方向へ寄せる
      const learned = Math.abs(f.z ?? 0) >= 1.5 ? clamp(Math.log(Math.max(f.lift, 0.2)) * 2.5, -0.5, 2.5) : 0;
      out[k] = { pts: +(pts * (1 - t) + learned * t).toFixed(3) };
    });
    return out;
  }
  // 仮想収支：毎レース、発走前の推奨どおりに買っていたらどうなったか（長期でプラスかを統計的に判定）
  function paperStats(recs){
    const out = {};
    ["t1", "t5", "t1s", "te"].forEach(k => {
      const xs = recs.map(r => r.bets?.[k]).filter(Boolean).filter(b => b[0] > 0);
      const inv = xs.reduce((a, b) => a + b[0], 0), ret = xs.reduce((a, b) => a + b[1], 0);
      if (!xs.length){ out[k] = { races: 0 }; return; }
      // 1円あたりの回収の平均と標準誤差（レースごとの比を投資額で重み付け）
      const rr = xs.map(b => b[1] / b[0]), w = xs.map(b => b[0] / inv);
      const m = rr.reduce((a, x, i) => a + w[i] * x, 0);
      // 投資額で重み付けした平均の標準誤差（賭け額が不ぞろいでも正しい形）: se² = Σ w_i² (r_i − m)² × n/(n−1)
      const n = xs.length;
      const se = Math.sqrt(rr.reduce((a, x, i) => a + w[i] * w[i] * (x - m) ** 2, 0) * n / Math.max(1, n - 1));
      const v = se * se * n;   // 1レースあたりの分散（必要レース数の見積もり用）
      out[k] = { races: xs.length, invest: inv, ret: Math.round(ret), roi: +(ret / inv).toFixed(4), lo95: +Math.max(0, m - 1.96 * se).toFixed(4), hi95: +(m + 1.96 * se).toFixed(4),
        need: se > 0 ? Math.ceil((1.96 * Math.sqrt(v) / Math.max(0.02, Math.abs(m - 1))) ** 2) : null };
    });
    return out;
  }

  // 上位3着の Plackett–Luce 対数尤度（パラメータ θ = [a, b, c_1..c_K]）
  // 1レース分の特徴（log p_model, log p_market, 要素の値）と上位3着の位置を一度だけ作っておく（学習の繰り返しを速くするため。結果は同じ）
  const PRE = new WeakMap();
  function prep(r){
    let p = PRE.get(r); if (p) return p;
    const H = r.h, n = H.length, D = 2 + FEATS.length, X = new Float64Array(n * D);
    H.forEach((h, i) => { X[i * D] = Math.log(h.pm); X[i * D + 1] = Math.log(h.pk); for (let k = 0; k < FEATS.length; k++) X[i * D + 2 + k] = h.z[k]; });
    const idx = [], seen = new Set();
    for (const num of r.order.slice(0, 3)){ const wi = H.findIndex(h => h.num === num); if (wi < 0 || seen.has(wi)) break; idx.push(wi); seen.add(wi); }
    p = { n, D, X, idx }; PRE.set(r, p); return p;
  }
  function nll(recs, th, grad){
    const K = FEATS.length; let L = 0;
    if (grad) grad.fill(0);
    for (const r of recs){
      if (r.h.length < 2 || !r.order?.length) continue;
      const { n, D, X, idx } = prep(r);
      const u = new Float64Array(n);
      for (let i = 0; i < n; i++){ let s = 0; for (let j = 0; j < D; j++) s += th[j] * X[i * D + j]; u[i] = s; }
      const used = new Uint8Array(n), e = new Float64Array(n);
      for (let st = 0; st < idx.length; st++){
        const wi = idx[st], lam = LAM[st];
        let mx = -1e9; for (let i = 0; i < n; i++) if (!used[i]) mx = Math.max(mx, lam * u[i]);
        let Z = 0; for (let i = 0; i < n; i++){ e[i] = used[i] ? 0 : Math.exp(lam * u[i] - mx); Z += e[i]; }
        L -= lam * u[wi] - mx - Math.log(Z);
        if (grad){
          for (let j = 0; j < D; j++) grad[j] -= lam * X[wi * D + j];
          for (let i = 0; i < n; i++) if (!used[i]){ const p = lam * e[i] / Z; for (let j = 0; j < D; j++) grad[j] += p * X[i * D + j]; }
        }
        used[wi] = 1;
      }
    }
    // 事前分布（データが少ないうちは事前の値に寄せる）
    const pr = [[th[0] - PRIOR.a, PRIOR.sa], [th[1] - PRIOR.b, PRIOR.sb]];
    pr.forEach(([d, s], j) => { L += d * d / (2 * s * s); if (grad) grad[j] += d / (s * s); });
    for (let k = 0; k < K; k++){ const d = th[2 + k]; L += d * d / (2 * PRIOR.sc ** 2); if (grad) grad[2 + k] += d / PRIOR.sc ** 2; }
    return L;
  }

  // 統合の比率 a, b と要素の補正 c を、上位3着の尤度が最大になるように推定する。
  // 目的関数は凸（Plackett–Luce＋正規分布の事前分布）なので、ニュートン法で数回の反復で最適解に着く（前の方法より約10倍速い）。
  // 制約（0≦a,b≦1.5、a+b≧1）に当たったときだけ、前と同じ方法（制約つきの勾配法）で仕上げる。
  function nllHess(recs, th, g, Hm){
    const K = FEATS.length, D = 2 + K; let L = 0;
    g.fill(0); Hm.fill(0);
    const mu = new Float64Array(D);
    for (const r of recs){
      if (r.h.length < 2 || !r.order?.length) continue;
      const { n, X, idx } = prep(r);
      const u = new Float64Array(n);
      for (let i = 0; i < n; i++){ let s2 = 0; for (let j = 0; j < D; j++) s2 += th[j] * X[i * D + j]; u[i] = s2; }
      const used = new Uint8Array(n), e = new Float64Array(n);
      for (let st = 0; st < idx.length; st++){
        const wi = idx[st], lam = LAM[st];
        let mx = -1e9; for (let i = 0; i < n; i++) if (!used[i]) mx = Math.max(mx, lam * u[i]);
        let Z = 0; for (let i = 0; i < n; i++){ e[i] = used[i] ? 0 : Math.exp(lam * u[i] - mx); Z += e[i]; }
        L -= lam * u[wi] - mx - Math.log(Z);
        mu.fill(0);
        for (let i = 0; i < n; i++) if (e[i] > 0){ const p = e[i] / Z; for (let j = 0; j < D; j++) mu[j] += p * X[i * D + j]; }
        for (let j = 0; j < D; j++) g[j] += lam * (mu[j] - X[wi * D + j]);
        const l2 = lam * lam;
        for (let i = 0; i < n; i++) if (e[i] > 0){ const p = e[i] / Z;
          for (let j = 0; j < D; j++){ const dj = X[i * D + j] - mu[j]; if (dj === 0) continue; const pj = l2 * p * dj; for (let k = j; k < D; k++) Hm[j * D + k] += pj * (X[i * D + k] - mu[k]); } }
        used[wi] = 1;
      }
    }
    const pr = [[th[0] - PRIOR.a, PRIOR.sa], [th[1] - PRIOR.b, PRIOR.sb]];
    pr.forEach(([d, s2], j) => { L += d * d / (2 * s2 * s2); g[j] += d / (s2 * s2); Hm[j * D + j] += 1 / (s2 * s2); });
    for (let k = 0; k < K; k++){ const d = th[2 + k]; L += d * d / (2 * PRIOR.sc ** 2); g[2 + k] += d / PRIOR.sc ** 2; Hm[(2 + k) * D + 2 + k] += 1 / PRIOR.sc ** 2; }
    for (let j = 0; j < D; j++) for (let k = 0; k < j; k++) Hm[j * D + k] = Hm[k * D + j];
    return L;
  }
  const feasible = th => th[0] >= 0 && th[0] <= 1.5 && th[1] >= 0 && th[1] <= 1.5 && th[0] + th[1] >= AB_MIN - 1e-9;
  function fitAdam(recs, th, iters){
    const K = FEATS.length;
    const g = new Float64Array(2 + K), m = new Float64Array(2 + K), v = new Float64Array(2 + K);
    const lr = 0.02;
    for (let t = 1; t <= iters; t++){
      nll(recs, th, g);
      for (let j = 0; j < th.length; j++){
        m[j] = 0.9 * m[j] + 0.1 * g[j]; v[j] = 0.999 * v[j] + 0.001 * g[j] * g[j];
        th[j] -= lr * (m[j] / (1 - 0.9 ** t)) / (Math.sqrt(v[j] / (1 - 0.999 ** t)) + 1e-8);
      }
      th[0] = clamp(th[0], 0, 1.5); th[1] = clamp(th[1], 0, 1.5);
      if (th[0] + th[1] < AB_MIN){ const d = (AB_MIN - th[0] - th[1]) / 2; th[0] += d; th[1] += d; }
    }
    return th;
  }
  function fit(recs){
    const K = FEATS.length, D = 2 + K, th = new Float64Array(D); th[0] = PRIOR.a; th[1] = PRIOR.b;
    const g = new Float64Array(D), Hm = new Float64Array(D * D), tmp = new Float64Array(D);
    let L = nllHess(recs, th, g, Hm);
    for (let it = 0; it < 40; it++){
      const H2 = Array.from({ length: D }, (_, j) => Array.from(Hm.subarray(j * D, j * D + D)));
      const step = solve(H2, Array.from(g, x => -x));
      if (!step.every(isFinite)) break;
      let t = 1, ok = false;
      for (let ls = 0; ls < 20; ls++){
        for (let j = 0; j < D; j++) tmp[j] = th[j] + t * step[j];
        const L2 = nll(recs, tmp, null);
        if (L2 <= L + 1e-10){ ok = true; break; } t /= 2;
      }
      if (!ok) break;
      th.set(tmp);
      const mx = Math.max(...step.map(Math.abs)) * t;
      L = nllHess(recs, th, g, Hm);
      if (mx < 1e-7) break;
    }
    if (!feasible(th)){
      // 制約に当たるとき：制約の内側へ戻してから、前と同じ方法で仕上げる
      th[0] = clamp(th[0], 0, 1.5); th[1] = clamp(th[1], 0, 1.5);
      if (th[0] + th[1] < AB_MIN){ const d = (AB_MIN - th[0] - th[1]) / 2; th[0] += d; th[1] += d; }
      fitAdam(recs, th, 400);
    }
    return th;
  }

  // 1着の対数損失（小さいほど良い）
  function logloss(recs, fn){
    let L = 0, n = 0;
    for (const r of recs){ const w = r.h.find(h => h.num === r.order?.[0]); if (!w) continue; const q = r.h.map(fn); const s = q.reduce((a, b) => a + b, 0); L += -Math.log(fn(w) / s); n++; }
    return n ? L / n : null;
  }

  // 競馬場・芝ダごとの偏り（直近14日）：前に行った馬・内枠の馬が上位に来たか
  function bias(recs, today){
    const out = {}, lim = new Date(new Date(today + "T12:00:00") - 14 * 864e5).toISOString().slice(0, 10);
    const groups = {};
    recs.filter(r => r.date >= lim).forEach(r => { (groups[r.venue + "|" + r.surface] ||= []).push(r); });
    const corr = (xs, ys) => { const n = xs.length; if (n < 4) return null; const mx = xs.reduce((a, b) => a + b, 0) / n, my = ys.reduce((a, b) => a + b, 0) / n;
      let sxy = 0, sx = 0, sy = 0; xs.forEach((x, i) => { sxy += (x - mx) * (ys[i] - my); sx += (x - mx) ** 2; sy += (ys[i] - my) ** 2; }); return sx && sy ? sxy / Math.sqrt(sx * sy) : null; };
    Object.entries(groups).forEach(([k, rs]) => {
      let fe = [], fg = [], n = 0;
      rs.forEach(r => { const hs = r.h.filter(h => h.pos); if (hs.length < 5) return; n++;
        const pr = h => (h.pos - 1) / (hs.length - 1);
        const ce = corr(hs.filter(h => h.early != null).map(h => h.early), hs.filter(h => h.early != null).map(pr)); if (ce != null) fe.push(ce);
        const cg = corr(hs.map(h => h.gate), hs.map(pr)); if (cg != null) fg.push(cg); });
      const avg = a => a.length ? a.reduce((x, y) => x + y, 0) / a.length : null;
      const e = avg(fe), gte = avg(fg);
      // 相関（前ほど小さい値 × 着順が良いほど小さい値）が正なら「前残り」。レース数が少ないほど控えめに
      const shrink = n / (n + 6);
      out[k] = { races: n, front: e != null ? +clamp(e * 0.9 * shrink, -0.5, 0.6).toFixed(3) : null, inner: gte != null ? +clamp(gte * 0.8 * shrink, -0.4, 0.4).toFixed(3) : null,
        corrEarly: e != null ? +e.toFixed(3) : null, corrGate: gte != null ? +gte.toFixed(3) : null };
    });
    return out;
  }

  // 学習結果をまとめる
  // light：過去データの日ごとのモデル用（予想に要る統合の比率・要素の重み・穴パターンの加点だけ作る）
  function build(recs, today, opt = {}){
    const th = fit(recs);
    const K = FEATS.length;
    const sens = recs.length ? recs.reduce((a, r) => a + (r.sens || 0.4), 0) / recs.length : 0.4;
    const weights = {};
    // 要素の補正はレースが十分たまるまで控えめに（200レースで半分、600レースで3/4の強さ）
    const trust = recs.length / (recs.length + 200);
    // 記録時に効いていた重み（基準に対する倍率）の平均に、残差の係数 c を上乗せする。
    // 要素の効きは、オッズとの混合（市場の重み0.4）で確率への効きが0.6倍になっている分を戻して換算
    FEATS.forEach((k, j) => {
      const c = th[2 + j];
      const rel = recs.length ? recs.reduce((a, r) => a + (r.wr ? r.wr[j] : 1), 0) / recs.length : 1;
      const mult = clamp(rel + c / (Math.max(0.3, th[0]) * sens * 0.6) * trust, 0.6, 1.5);
      if (Math.abs(mult - 1) >= 0.02) weights[k] = +mult.toFixed(3);
    });
    const a = th[0], b = th[1];
    const us = upsetStats(recs);
    const base = { version: 2, updated: new Date().toISOString(), races: recs.length, upto: recs.reduce((m, r) => r.date > m ? r.date : m, "0000-00-00"),
      calib: { a: +a.toFixed(3), b: +b.toFixed(3) }, weights, featCoef: Object.fromEntries(FEATS.map((k, j) => [k, +th[2 + j].toFixed(4)])), sens: +sens.toFixed(3), anaWeights: anaWeights(us) };
    if (opt.light) return { ...base, light: true };
    const byDate = {};
    recs.forEach(r => (byDate[r.date] ||= []).push(r));
    const hist = Object.keys(byDate).sort().map(d => ({ date: d, races: byDate[d].length,
      model: +logloss(byDate[d], h => h.pm).toFixed(3), market: +logloss(byDate[d], h => h.pk).toFixed(3),
      blend: +logloss(byDate[d], h => Math.pow(h.pm, a) * Math.pow(h.pk, b)).toFixed(3) }));
    return { ...base,
      metrics: { model: logloss(recs, h => h.pm), market: logloss(recs, h => h.pk), blend: logloss(recs, h => Math.pow(h.pm, a) * Math.pow(h.pk, b)) },
      hist, bias: bias(recs, today || new Date().toISOString().slice(0, 10)),
      upsets: recs.slice(-400).flatMap(analyzeUpsets).slice(-60), upsetStats: { ...us, factors: us.factors.slice(0, 16) },
      paper: paperStats(recs), indep: (() => { try { return indBuild(recs); } catch (e) { return null; } })() };
  }

  function merge(oldRecs, newRecs){
    const m = new Map((oldRecs || []).map(r => [r.id, r])); (newRecs || []).forEach(r => { const o = m.get(r.id); m.set(r.id, o && !r.bets && o.bets ? { ...r, bets: o.bets } : r); });
    return [...m.values()].sort((x, y) => (x.date + x.id).localeCompare(y.date + y.id));
  }

  // 結果の出ているレースについて、モデルの1着確率を計算して記録を作る（ブラウザでもNodeでも同じ）
  async function recordsForRaces(Engine, races, horses, trackOf, runs = 2500, betsOf, baseW, upto){
    const out = []; ENG = Engine;
    for (const r of races){
      const res = r.result; if (!res || !r.entries?.length) continue;
      const fin = {}; (res.rows || []).forEach(x => fin[x.num] = x);
      const ents = r.entries.filter(e => !res.rows?.length || fin[e.num]).map(e => ({ ...e, odds: fin[e.num]?.odds > 1 ? fin[e.num].odds : e.odds, pop: fin[e.num]?.pop || e.pop }));
      if (ents.length < 2) continue;

  // ===== 前走の分解（記録の中に前走のレースがあるときだけ）：着順という圧縮された情報を、上がり順位・ペース・位置取りに戻す =====

    ring.rotation.x = -Math.PI / 2; ring.visible = false; world.root.add(ring); S.ring = ring;
    positionAll(0, 0); placeCamera(1, true, 1);
    renderOnce();
  }

  function distAt(h, t){
    if (t <= h.tCross) return Math.max(0, S.raw(h, t));
    const v = S.vAvg; const dt = t - h.tCross;
    return S.D + v * 7 * (1 - Math.exp(-dt / 7));
  }

  function positionAll(t, dt){
    const { horses, D } = S, path = world.path;
    horses.forEach(h => { h.d = distAt(h, t); });
    const sorted = horses.slice().sort((a, b) => b.d - a.d);
    const occ = [];
    const N = horses.length;
    sorted.forEach((h, rank) => {
      const u = h.d / D, rem = D - h.d;

      if (t < 0.01) pref = ((h.f.num - 1) * 1.15 + 0.6) / 1.25;
      else if (rem > 450) pref = 0.3 + Math.min(4, rank * 0.18);
      else pref = 0.3 + Math.max(0, (h.f.prof?.kick || 0) * 10 + (rank > 4 ? 2.5 : 0));
      let best = pref, bestCost = Infinity;
      for (let L = 0; L <= 14; L += 0.5){
        let blocked = false;
        for (const o of occ){ const dd = o.d - h.d; if (Math.abs(o.lane - L) < 1.0 && dd > -0.5 && dd < 3.2){ blocked = true; break; } }
        if (blocked) continue;
        const cost = Math.abs(L - pref) + 0.6 * Math.abs(L - h.lane);
        if (cost < bestCost){ bestCost = cost; best = L; }
      }
      if (t > 0.01 && dt > 0){ const maxStep = 1.4 * dt; h.lane += Math.max(-maxStep, Math.min(maxStep, best - h.lane)); }

      occ.push({ d: h.d, lane: h.lane });
      const p = path.finishP - D + h.d;
      const a = path.at(p, h.lane * 1.25);
      const m = h.mesh;
      m.position.set(a.x, 0, a.z);
      m.rotation.y = Math.atan2(-a.hz, a.hx);
      const phase = h.d / 6.8 * Math.PI * 2;
      const run = t > 0 ? Math.min(1, (h.tCross && t > h.tCross + 5) ? 0.4 : 1) : 0;
      const L = m.userData.legs, amp = 0.65 * run;
      L[0].rotation.z = amp * Math.sin(phase); L[1].rotation.z = amp * Math.sin(phase + 0.35);
      L[2].rotation.z = amp * Math.sin(phase + Math.PI); L[3].rotation.z = amp * Math.sin(phase + Math.PI + 0.35);
      m.position.y = run * 0.1 * Math.abs(Math.sin(phase));

  }

  function placeCamera(dt, snap, rate = 1){
    const path = world.path, { D } = S;
    const sorted = S.sorted, leader = sorted[0], lastH = sorted[sorted.length - 1];
    // 馬群全体（先頭〜最後方）が収まるように、中央を見てカメラ距離を広げる
    const dLead = Math.min(leader.d, D + 30), dLast = Math.min(lastH.d, D + 30);
    const spread = Math.max(8, dLead - dLast);
    const dMid = (dLead + dLast) / 2;
    const pm = path.finishP - D + dMid;
    const pl = path.finishP - D + dLead;
    let pos, look;
    const f = path.at(pm, 6);
    const goalMode = S.cam === "ゴール" || (S.autoGoal && S.cam !== "俯瞰" && S.cam !== "注目馬" && S.t >= S.slowStart - 0.6);
    const wantFov = goalMode ? 24 : 40;
    if (Math.abs(camera.fov - wantFov) > 0.05){ camera.fov += (wantFov - camera.fov) * (snap ? 1 : Math.min(1, dt * 3)); camera.updateProjectionMatrix(); }
    if (goalMode && !S.goalMode) snap = true;   // ゴールカメラへは即切替
    S.goalMode = goalMode;
    const fit = Math.min(260, 40 + spread * 1.15);        // 馬群の長さに応じて引く
    switch (goalMode ? "ゴール" : S.cam){
      case "ゴール": {   // ゴール線の延長上（スタンド側）から線に沿って見る＝写真判定の画角
        const g = path.at(path.finishP, 46); pos = new THREE.Vector3(g.x, 7, g.z);
        const c = path.at(path.finishP, 5); look = new THREE.Vector3(c.x, 1.4, c.z); break; }
      case "追走": { const b = path.at(pm - spread / 2 - 30, 5); pos = new THREE.Vector3(b.x, 10 + spread * 0.25, b.z); const l = path.at(pl + 10, 6); look = new THREE.Vector3(l.x, 1.5, l.z); break; }
      case "俯瞰": { pos = new THREE.Vector3(0, (path.St + 2 * path.R) * 1.15 + 60, 0.01); look = new THREE.Vector3(0, 0, 0); break; }
      case "先頭": { const a = path.at(pl - 4, 22); pos = new THREE.Vector3(a.x, 4, a.z); const l = path.at(pl - 3, 2); look = new THREE.Vector3(l.x, 1.6, l.z); break; }
      case "注目馬": {
        const h = S.horses.find(x => x.f.num === S.focus) || leader;
        const ph = path.finishP - D + Math.min(h.d, D + 30);
        const a = path.at(ph - 12, 24); pos = new THREE.Vector3(a.x, 7, a.z); const l = path.at(ph + 4, h.lane * 1.25); look = new THREE.Vector3(l.x, 1.4, l.z); break; }
      default: { const a = path.at(pm - 4, fit * 0.75); pos = new THREE.Vector3(a.x, 12 + fit * 0.22, a.z); look = new THREE.Vector3(f.x, 1.5, f.z); }
    }

    camera.position.copy(S.camPos); camera.lookAt(S.camLook);
    const sun = scene.userData.sun; sun.position.set(f.x + 60, 120, f.z + 40); sun.target.position.set(f.x, 0, f.z);
    const sc = sun.shadow.camera, half = Math.max(70, spread / 2 + 30);
    if (Math.abs(sc.right - half) > 5){ sc.left = -half; sc.right = half; sc.top = half; sc.bottom = -half; sc.updateProjectionMatrix(); }
    if (S.ring){ const h = S.horses.find(x => x.f.num === S.focus); S.ring.visible = !!h; if (h){ S.ring.position.set(h.mesh.position.x, 0.12, h.mesh.position.z); } }
  }

  function renderOnce(){ renderer.render(scene, camera); }

  function frame(ts){
    raf = requestAnimationFrame(frame);

    if (!S) return;
    const inSlow = S.autoGoal && S.t >= S.slowStart && S.t <= S.slowEnd;
    S.slowMix += ((inSlow ? 1 : 0) - S.slowMix) * Math.min(1, dt * 4);     // なめらかに減速・復帰
    const rate = S.speed * (1 - 0.8 * S.slowMix);                               // 最大 1/5 速
    if (S.playing){
      S.t = Math.min(S.tEnd, S.t + dt * rate);
      if (S.t >= S.tEnd) S.playing = false;
    }
    S.horses.forEach(h => { if (h.badge) h.badge.visible = S.t >= h.tCross; });
    positionAll(S.t, dt * (S.playing ? rate : 1));
    placeCamera(dt, false, S.playing ? rate : 1);
    if (world.gate) world.gate.visible = S.t < 1.5;
    renderer.render(scene, camera);
    if (onTick) onTick(status());
    const allIn = S.horses.every(h => S.t >= h.tCross);
    if (allIn && !S.finishedFired){ S.finishedFired = true; if (onFinish) onFinish(results()); }
  }

  function status(){
    const lead = S.sorted[0];
    return { t: S.t, tEnd: S.tEnd, playing: S.playing, slow: S.slowMix > 0.5, goalMode: S.goalMode, remaining: Math.max(0, S.D - lead.d),
             D: S.D, str: world.path.St, curveLen: Math.PI * world.path.R, tWin: S.tWin, focus: S.focus,
             order: S.sorted.map(h => ({ num: h.f.num, waku: h.waku, name: h.f.name, d: h.d, done: S.t >= h.tCross, tCross: h.tCross,
               x: h.mesh.position.x, z: h.mesh.position.z })) };
  }
  // 真上から見た全体図用：コースの外形（内ラチ）とゴール・スタート位置
  function mapData(){
    if (!world) return null;
    const path = world.path, pts = [];
    for (let p = 0; p < path.L; p += 8){ const a = path.at(p, -1.5), b = path.at(p, 27); pts.push([a.x, a.z, b.x, b.z]); }
    const g = path.at(path.finishP, -2), g2 = path.at(path.finishP, 29), st = path.at(path.finishP - S.D, 12);
    const marks = []; for (let r = 200; r < S.D; r += 200){ const m = path.at(path.finishP - r, -4); marks.push({ r, x: m.x, z: m.z }); }
    return { pts, goal: [g.x, g.z, g2.x, g2.z], start: [st.x, st.z], marks, R: path.R, St: path.St };
  }
  function setFocus(num){ if (S) S.focus = num; }
  function results(){
    return S.horses.slice().sort((a, b) => a.tCross - b.tCross).map(h => ({ num: h.f.num, waku: h.waku, name: h.f.name, time: h.tCross, jockey: h.f.jockey }));
  }

  function start(){ if (!raf){ last = 0; raf = requestAnimationFrame(frame); } }
  function stop(){ if (raf){ cancelAnimationFrame(raf); raf = 0; } }
  function play(){ if (!S) return; if (S.t >= S.tEnd){ S.t = 0; S.finishedFired = false; } S.playing = true; }
  function pause(){ if (S) S.playing = false; }
  function seek(t){ if (!S) return; S.t = Math.max(0, Math.min(S.tEnd, t)); if (S.t < S.tEnd - 0.1) S.finishedFired = S.horses.every(h => S.t >= h.tCross); }
  function setSpeed(v){ if (S) S.speed = v; }
  function setCam(c){ if (S){ S.cam = c; placeCamera(0, true); } }
  function setAutoGoal(v){ if (S){ S.autoGoal = v; } }
  return { init, load, start, stop, play, pause, seek, setSpeed, setCam, setAutoGoal, setFocus, mapData, resize, WAKU, WAKU_TX, get state(){ return S; } };
})();

function curRace(){ return DB.races[ST.raceId]; }
// 条件変更時：結果は消さずに「条件変更あり・再実行してください」と表示
function markStale(id){ if (ST.sims[id]) ST.sims[id].stale = true; }
// クッション値：当日の朝にJRAが発表した値。発表前・記録のない日は、その競馬場の記録の平均（なければ全体の平均）
const CUSHION = { avg: null };
function trackOf(r){
  let t = SEED.track?.[r.date + "|" + r.venue] || null;
  if (r.surface === "芝" && t?.cushion == null){
    const a = CUSHION.avg, v = a?.venue?.[r.venue] ?? a?.all;
    if (v != null) t = { ...(t || {}), cushion: v, cushionLabel: `平均値・当日の発表前（${a?.venue?.[r.venue] != null ? `${r.venue}の記録${a.n[r.venue]}回` : "全競馬場の記録"}）`, cushionAvg: true };
  }
  // 当日（同じ開催・同じ週末）に先に終わったレースの結果から、前残り・内枠有利の偏りを重ねる。
  // 条件：同じ競馬場・同じ芝/ダート・同じ馬場の区分（良〜稍重／重〜不良）・このレースより前に発走・4レース以上・偏りが統計的にはっきりしている（95%で有意）
  const lb = LS.get("keibaBiasMode", "auto") === "off" ? null : dayBias(r);
  if (lb && (lb.front || lb.inner)){
    t = { ...(t || {}), frontBias: +(((t?.frontBias ?? 0) * 0.5) + lb.front).toFixed(3), innerBias: +(((t?.innerBias ?? 0) * 0.5) + lb.inner).toFixed(3),
          learnedBias: lb, note: [t?.note, lb.text].filter(Boolean).join("／") };
  }
  if (!t) return null; const c = ST.cushion[r.id]; return c != null ? { ...t, cushion: c } : t;
}
const goingClass = g => /重|不/.test(g || "") && !/稍/.test(g || "") ? "wet" : "dry";
const kaiKey = k => (k || "").replace(/\s*\d+日目.*/, "").replace(/\s+/g, "");
function biasCorr(xs, ys){ const n = xs.length; if (n < 4) return null; const mx = xs.reduce((a, b) => a + b, 0) / n, my = ys.reduce((a, b) => a + b, 0) / n;
  let sxy = 0, sx = 0, sy = 0; xs.forEach((x, i) => { sxy += (x - mx) * (ys[i] - my); sx += (x - mx) ** 2; sy += (ys[i] - my) ** 2; }); return sx && sy ? sxy / Math.sqrt(sx * sy) : null; }
// 1レースの「前に行った馬ほど上位か」「内枠ほど上位か」の相関（+ なら前残り・内有利）
function raceBiasOf(x){
  const res = x.result; if (!res?.rows?.length) return null;
  const fin = res.rows.filter(h => /^\d+$/.test(String(h.pos))); const n = fin.length; if (n < 6) return null;
  const pr = h => (+h.pos - 1) / (n - 1);
  const c = res.corners?.length ? res.corners[Math.min(1, res.corners.length - 1)] : null;
  const early = {}; if (c) c.forEach((num, k) => early[num] = k / Math.max(1, c.length - 1));
  const fe = fin.filter(h => early[h.num] != null);
  const N = x.entries?.length || n;
  return { ce: fe.length >= 6 ? biasCorr(fe.map(h => early[h.num]), fe.map(pr)) : null, cg: biasCorr(fin.map(h => (h.num - 1) / Math.max(1, N - 1)), fin.map(pr)) };
}
function dayBias(r){
  if (r.surface === "障") return null;
  const t0 = raceStart(r), gc = goingClass(ST.going[r.id] || r.going || "良"), kk = kaiKey(r.kai);
  const lo = new Date(new Date(r.date + "T12:00:00+09:00") - 1.5 * 864e5);
  const prev = Object.values(DB.races).filter(x => x.id !== r.id && x.venue === r.venue && x.surface === r.surface && x.result?.rows?.length
    && raceStart(x) < t0 && raceStart(x) >= lo && (!kk || !x.kai || kaiKey(x.kai) === kk) && goingClass(x.result.going || x.going) === gc);
  const bs = prev.map(raceBiasOf).filter(Boolean);
  const stat = k => { const v = bs.map(b => b[k]).filter(v => v != null); const n = v.length; if (n < 4) return { n, m: 0, t: 0 };
    const m = v.reduce((a, b) => a + b, 0) / n, sd = Math.sqrt(v.reduce((a, b) => a + (b - m) ** 2, 0) / (n - 1)) || 1e-6; return { n, m, t: m / (sd / Math.sqrt(n)) }; };
  const e = stat("ce"), g = stat("cg");
  // 95%で偶然とは言えない偏りだけを反映（t分布の両側5%点。レース数が少ないほど厳しく）
  const tcrit = n => [99, 99, 99, 99, 3.18, 2.78, 2.57, 2.45, 2.36, 2.31, 2.26][n] || 2.2;
  if (e.n < 4 && g.n < 4) return null;
  // はっきりしない偏り（95%で有意でないもの）は反映しない（誤った反映を防ぐ）。反映するときもレース数が少ないほど控えめに
  const front = Math.abs(e.t) >= tcrit(e.n) ? Math.max(-0.5, Math.min(0.6, e.m * 0.9 * e.n / (e.n + 6))) : 0;
  const inner = Math.abs(g.t) >= tcrit(g.n) ? Math.max(-0.4, Math.min(0.4, g.m * 0.8 * g.n / (g.n + 6))) : 0;
  const cond = `${r.venue}${r.surface}・${gc === "wet" ? "重〜不良" : "良〜稍重"}・この日このレースより前の${bs.length}R`;
  const text = `当日の偏り（${cond}）：${front > 0.04 ? "前残り" : front < -0.04 ? "差し有利" : "脚質は反映なし"}・${inner > 0.04 ? "内枠有利" : inner < -0.04 ? "外枠有利" : "枠は反映なし"}`;
  return { front: +front.toFixed(3), inner: +inner.toFixed(3), races: bs.length, tFront: +e.t.toFixed(2), tInner: +g.t.toFixed(2), corrEarly: +e.m.toFixed(3), corrGate: +g.m.toFixed(3), cond, text };
}
function trendOf(r){ const k = Object.keys(SEED.trends || {}).find(k => (r.name || "").includes(k)); return k ? { key: k, ...SEED.trends[k] } : null; }
function forecastGoing(r){ const t = trackOf(r); if (!t?.goingProb) return null; return Object.entries(t.goingProb).sort((a, b) => b[1] - a[1])[0][0]; }
function goingOf(r){ return ST.going[r.id] || r.going || forecastGoing(r) || "良"; }
function paceOf(r){ return ST.pace[r.id] || "auto"; }
const PACE_LABEL = { auto: "自然発生", slow: "スロー", mid: "ミドル", high: "ハイ" };
const GOINGS = ["良", "稍", "重", "不"], PACES = ["slow", "mid", "high"];
function makeCtx(r, goingOverride){

  const tw = tweaks[r.id] || {};
  if (tw.odds) race.entries = race.entries.map(e => tw.odds[e.num] != null ? { ...e, odds: tw.odds[e.num] || null } : e);
  if (tw.place) race.entries = race.entries.map(e => tw.place[e.num] != null ? { ...e, placeLo: tw.place[e.num] || null } : e);
  return Engine.buildContext(race, DB.horses, { going: race.going, training: tw.training || {}, manual: tw.manual || {}, trend: trendOf(r), track: trackOf(r) });
}

// 複数条件の平均
function averageStats(list, field){
  const N = field.length;
  return field.map((f, i) => {
    const s = list.map(x => x.stats[i]);
    const avg = k => s.reduce((a, x) => a + x[k], 0) / s.length;
    const hist = Array.from({ length: N }, (_, p) => s.reduce((a, x) => a + x.hist[p], 0) / s.length);
    const win = avg("win");
    return { i, num: f.num, name: f.name, win, top2: avg("top2"), top3: avg("top3"), avgPos: avg("avgPos"), fairOdds: win ? 1 / win : null, hist };
  });
}

// 注目穴馬：6番人気以下（オッズ10倍以上）から、複勝期待値と穴要素で選ぶ
function pickDarkHorse(ctx, stats, avgStats, M){
  const cand = ctx.field.map((f, i) => ({ f, i, s: stats[i], a: avgStats[i] }))
    .filter(x => x.f.odds > 1 && (x.f.odds >= 10 || (x.f.pop && x.f.pop >= 6)));
  if (!cand.length || !Engine.oddsReady(ctx.field)) return null;
  cand.forEach(x => {
    // 複勝オッズが取れていないときは推定値を使わず、複勝期待値は出さない（実際のオッズだけで計算する）
    const po = x.f.placeLo > 0 ? x.f.placeLo : null;
    x.placeEV = po ? (M ? M.place[x.i] : x.a.top3) * po : null; x.winEV = (M ? M.win[x.i] : x.a.win) * x.f.odds;
    x.score = (x.placeEV ?? x.winEV * 0.8) + 0.5 * x.winEV + 0.15 * x.f.ana.length;
  });
  cand.sort((a, b) => b.score - a.score);
  return cand[0];
}

// 条件ごとの着順を、重みに比例した本数ずつ混ぜて1つの「予想条件の着順」にする
function mixRes(cells, N){
  const tot = cells.reduce((a, c) => a + c.w, 0) || 1, R = cells[0].m.orders.length / N;
  const out = new Uint8Array(R * N); let k = 0;
  cells.forEach((c, ci) => {
    const o = c.m.orders, Rc = o.length / N;
    const n = ci === cells.length - 1 ? R - k : Math.round(c.w / tot * R);
    for (let j = 0; j < n && k < R; j++, k++) out.set(o.subarray((j % Rc) * N, (j % Rc) * N + N), k * N);
  });
  return { orders: out.subarray(0, k * N), runs: k };
}
let simBusy = false;
async function runSim(silent, opt = {}){
  const r = opt.id ? DB.races[opt.id] : curRace(); if (!r?.entries?.length) return;
  // 一括予想・過去データの処理が同時に動いても、レースを飛ばさないよう順番待ちする（画面のボタンからの実行は、計算中なら無視）
  if (simBusy){ if (!opt.id) return; while (simBusy) await new Promise(res => setTimeout(res, 50)); if (!DB.races[r.id]) return; }
  simBusy = true;
  const RUNS = opt.runs || ST.runs, isCur = r.id === ST.raceId;
  const btn = isCur ? $("#runBtn") : null; if (btn){ btn.disabled = true; btn.textContent = "計算中…"; }
  try {
    const t0 = performance.now();
    const seed = (Math.random() * 1e9) >>> 0;          // 実行ごとに新しい乱数列
    const total = 1 + GOINGS.length * PACES.length;
    let done = 0;
    const prog = () => p => { if (opt.onProgress) opt.onProgress((done + p) / total); if (!isCur) return; const el = $("#prog"); if (el) el.style.width = ((done + p) / total * 100) + "%"; };
    // 選択条件（馬場×ペース）
    const ctx = makeCtx(r);
    const pm = paceOf(r) === "auto" ? null : paceOf(r);
    const res = await Engine.monteCarlo(ctx, RUNS, seed, prog(), pm); done++;
    // 馬場4×ペース3 の全12条件
    const matrix = {};
    for (const g of GOINGS){
      const cg = makeCtx(r, g);
      for (const p of PACES){
        const m = await Engine.monteCarlo(cg, RUNS, seed + 7919 * (done + 1), prog(), p); done++;

        matrix[g + "|" + p] = { going: g, pace: p, stats: m.stats, ctx: cg, orders: m.orders, seedBase: m.seedBase };
      }
    }
    const avgAll = averageStats(Object.values(matrix), ctx.field);
    // 予想条件で加重：馬場は当日の天気予報、ペースは出走馬の脚質構成から自然に起きる割合
    const t = trackOf(r), pd = res.paceDist;
    // 馬場の重み：発表済みの馬場（結果の馬場＝発走時点の発表、または当日の発表）があればそれを優先。予報は発表前だけ使う
    const g1 = x => (x || "").slice(0, 1);
    const ann = ST.going[r.id] ? null : g1(r.result?.going) || (r.date <= iso(new Date()) ? g1(r.going) : "");
    const gW = ST.going[r.id] ? Object.fromEntries(GOINGS.map(g => [g, g === g1(goingOf(r)) ? 1 : 0]))
      : ann && GOINGS.includes(ann) ? Object.fromEntries(GOINGS.map(g => [g, g === ann ? 1 : 0]))
      : t?.goingProb || Object.fromEntries(GOINGS.map(g => [g, g === g1(goingOf(r)) ? 1 : 0]));
    const pf = Engine.paceForecast(ctx);                      // 選んだペースに関係なく、脚質構成から自然に起きる割合
    const pW = { slow: pf.slow, mid: pf.mid, high: pf.high };
    const cells = []; Object.values(matrix).forEach(m => { const w = (gW[m.going] || 0) * (pW[m.pace] || 0); if (w > 0) cells.push({ m, w }); });
    const wsum = cells.reduce((a, c) => a + c.w, 0) || 1;
    const weighted = ctx.field.map((f, i) => {
      const g = k => cells.reduce((a, c) => a + c.m.stats[i][k] * c.w, 0) / wsum;
      const hist = Array.from({ length: ctx.N }, (_, p) => cells.reduce((a, c) => a + c.m.stats[i].hist[p] * c.w, 0) / wsum);
      const win = g("win"); return { i, num: f.num, name: f.name, win, top2: g("top2"), top3: g("top3"), avgPos: g("avgPos"), fairOdds: win ? 1 / win : null, hist };
    });
    // 最も多かった決着（3連単）を加重で集計
    const tri = new Map(); const N = ctx.N;
    cells.forEach(({ m, w }) => { const o = m.orders, R = o.length / N; for (let k = 0; k < R; k++){ const key = o[k*N] + "-" + o[k*N+1] + "-" + o[k*N+2]; tri.set(key, (tri.get(key) || 0) + w / R / wsum); } });
    const triTop = [...tri.entries()].sort((a, b) => b[1] - a[1]).slice(0, 5).map(([k, p]) => ({ idx: k.split("-").map(Number), p }));
    const weightsInfo = { gW, pW, cells: cells.length };
    const replayCells = cells;
    const prev = ST.sims[r.id] || ST.lastSims?.[r.id];
    const runNo = (ST.runCount[r.id] || 0) + 1; ST.runCount[r.id] = runNo;
    // 買い方の計算に使う着順：馬場・ペースを指定したらその条件、指定なしなら予報で加重した全条件の混合
    const explicit = !!ST.going[r.id] || paceOf(r) !== "auto";
    const planRes = explicit ? res : mixRes(cells, ctx.N);
    const cands = Bets.candidates(ctx, planRes);
    const plans = cands ? { 1000: Bets.plan(ctx, planRes, 1000, cands), 5000: Bets.plan(ctx, planRes, 5000, cands) } : null;
    const planBasis = explicit ? `馬場「${ctx.race.going}」・ペース「${PACE_LABEL[paceOf(r)]}」` : "馬場予報×起きやすいペースで加重した全条件";
    const dark = pickDarkHorse(ctx, res.stats, weighted, cands?.M);
    ST.sims[r.id] = { runs: RUNS, ctx, res, matrix, avgAll, weighted, triTop, triMap: tri, replayCells, weightsInfo, cands, plans, planBasis, planRuns: planRes.runs, planRes, dark, seed, runNo, prevStats: prev?.res?.stats || null,
      ms: performance.now() - t0, runPick: "best", going: ctx.race.going, pace: paceOf(r), cell: goingOf(r) + "|" + (pm || "mid") };
    ST.lastSims[r.id] = ST.sims[r.id];
  } catch (err) {
    console.error(err); toast("計算中にエラーが起きました：" + err.message);
  } finally {
    simBusy = false;
    const b = isCur ? $("#runBtn") : null; if (b){ b.disabled = false; b.textContent = "シミュレーション実行"; }
  }
  if (ST.sims[r.id]) BATCH.rows[r.id] = summarizeSim(r, ST.sims[r.id]);
  if (isCur){ renderBand(); renderResult(); }
  if (ST.tab === "all" && !BATCH.running) renderAllTab();
  if (silent === true) return;
  toast(`選択条件＋全12条件（各${RUNS.toLocaleString()}回）の計算が完了しました`);
  setTab("result");
}

// ===== 市場乖離候補（独自勝率＝オッズを使わないモデル → 最後にだけ市場と比べる）：参考表示。1,000円の推奨・実戦テストには使わない =====
function indepModel(){ return (LOCK.info?.model || BF.full || LEARN.saved || LEARN.model)?.indep || null; }
// 前走の分解（上がり順位・ペース・展開不利）：前走のレースが手元の記録にあるときだけ使える。記録が変わったら作り直す
let PREV_OF = { recs: null, f: null };
function prevOfNow(){ const R = BF.recs; if (!R?.length) return null; if (PREV_OF.recs !== R) PREV_OF = { recs: R, f: Learn.prevBuilder(R) }; return PREV_OF.f; }
function indepBox(sim, r){
  const M = indepModel(); if (!M) return "";
  try {
    const pf = prevOfNow();
    if (!sim.indep || sim.indep.m !== M || sim.indep.pf !== pf) sim.indep = { m: M, pf, rows: Learn.livePredict(M, sim.ctx, sim.ctx.race, Engine, 200, pf) };
  } catch (e) { console.error(e); return ""; }
  const rows = sim.indep.rows; if (!rows) return "";
  const F = sim.ctx.field, inv = F.map(f => f.odds > 1 ? 1 / f.odds : 0), s0 = inv.reduce((a, b) => a + b, 0);
  if (!s0) return "";
  const cand = rows.map((x, i) => { const f = F[i], pk = inv[i] / s0, odds = f.odds; if (!(odds > 1)) return null;
    const ratio = x.p / pk, ev = x.p * odds, evLo = x.lo != null ? x.lo * odds : null;
    const grade = ratio >= 2 && evLo != null && evLo >= 1 ? "A+" : ratio >= 1.5 && ev >= 1.3 ? "A" : ratio >= 1.2 && ev >= 1.1 ? "B" : null;
    const why = []; const ct = x.ct; if (ct){ if (ct[0] >= 0.35) why.push("前走大きく出遅れ"); if (ct[1] >= 0.25) why.push("前走4角から伸び"); if (ct[1] <= -0.25) why.push("前走失速"); if (ct[2] != null && ct[2] <= -0.8) why.push("前走の上がりが普段より速い"); }
    const pv = x.pv; if (pv){ if (pv[5] != null && pv[5] <= 3 && pv[6] >= 4) why.push(`前走 上がり${pv[5]}位で${pv[6]}着`); if (pv[4] != null && pv[4] >= 0.3) why.push(pv[7] < 0.5 ? "前走 前でハイペースに巻き込まれた" : "前走 後ろでスローに泣いた"); }
    return { f, x, pk, ratio, ev, evLo, grade, why }; }).filter(c => c && c.grade).sort((a, b) => b.ratio - a.ratio);
  const I = REPORT.r?.indep, hiBands = I?.ready ? I.bands.filter(b => /^(2〜3倍|3倍以上)$/.test(b.band) && b.n) : [];
  const vN = hiBands.reduce((a, b) => a + b.n, 0), vRoi = vN ? hiBands.reduce((a, b) => a + b.roi * b.n, 0) / vN : null;
  const verdict = !I?.ready ? "検証はまだです（「学習・成績」タブの検証レポート13番で確かめられます）" : `検証レポート13番：市場比2倍以上の馬の単勝回収率 ${Math.round(vRoi * 100)}%（${vN.toLocaleString()}頭）${hiBands.every(b => b.lo95 >= 1) ? "・<b class='pos'>95%の範囲の下限も100%超え</b>" : "・<b>まだ有効とは言えません</b>"}`;
  const pc = v => v == null ? "—" : (v * 100).toFixed(1) + "%";
  return `<div class="learnbox"><h3>市場乖離候補 <span class="small">オッズを使わない独自勝率 × 最後に市場と比較（参考表示・1,000円の推奨と実戦テストには使っていません）</span></h3>
    ${cand.length ? `<div class="tbl-wrap"><table><thead><tr><th>判定</th><th>馬</th><th class="r">独自勝率（95%の範囲）</th><th class="r">市場の確率</th><th class="r">市場比</th><th class="r">単勝の期待値</th><th>前走の内容</th></tr></thead><tbody>
      ${cand.map(c => `<tr><td><b class="${c.grade === "A+" ? "pos" : ""}">${c.grade}</b></td><td>${ub(c.f.num, c.f.waku)} ${esc(c.f.name)} <span class="small">${c.f.pop ? c.f.pop + "人気・" : ""}${c.f.odds}倍</span></td><td class="r num">${pc(c.x.p)}<span class="small">（${pc(c.x.lo)}〜${pc(c.x.hi)}）</span></td><td class="r num">${pc(c.pk)}</td><td class="r num"><b>${c.ratio.toFixed(2)}倍</b></td><td class="r num">${c.ev.toFixed(2)}</td><td class="small">${esc(c.why.join("・")) || "—"}</td></tr>`).join("")}</tbody></table></div>`
      : `<p class="small"><b>このレースは市場とのずれが大きい馬はいません（見送り）。</b></p>`}
    <p class="small">判定：A+＝市場比2倍以上で、独自勝率の範囲の下限でも期待値1以上／A＝市場比1.5倍以上・期待値1.3以上／B＝市場比1.2倍以上・期待値1.1以上。${verdict}。</p></div>`;
}

// ===== 3D再生 =====
let replayInited = false;
function ensureReplay(){
  if (replayInited) return true;
  if (typeof THREE === "undefined"){ $("#stage").innerHTML = `<div class="empty" style="margin:16px">3D描画ライブラリを読み込めませんでした。ネットワーク接続を確認して再読み込みしてください。</div>`; return false; }
  Replay.init($("#stage"), { onTick: hud, onFinish: showFinish });
  replayInited = true; return true;
}
function runOptions(sim){
  const t = sim.triTop[0], f = sim.ctx.field;
  const opts = [`<option value="best">最も可能性が高い決着（${t.idx.map(i => f[i].num).join("→")}・展開は毎回変わる）</option>`,
                `<option value="rand">1万回の中からランダムに1レース（毎回違う）</option>`];
  f.forEach((x, i) => opts.push(`<option value="w${i}">${x.num} ${esc(x.name)} が勝つレース</option>`));
  return opts.join("");
}
// 再生するレースを選ぶ：シミュレーションで実際に起きた1回（同じ乱数で完全に再現）を毎回選び直す
function chooseRun(sim, pick){
  const N = sim.ctx.N;
  if (pick === "best"){
    const want = sim.triTop[0].idx;
    // 加重した条件の中から、条件の重みに比例してランダムに選び、その条件で最多決着になった回を探す
    const cand = sim.replayCells.filter(c => true);
    for (let tries = 0; tries < 30; tries++){
      let u = Math.random() * cand.reduce((a, c) => a + c.w, 0), cell = cand[0];
      for (const c of cand){ u -= c.w; if (u <= 0){ cell = c; break; } }
      const o = cell.m.orders, R = o.length / N, hits = [];
      for (let k = 0; k < R; k++) if (o[k*N] === want[0] && o[k*N+1] === want[1] && o[k*N+2] === want[2]) hits.push(k);
      if (hits.length) return { ctx: cell.m.ctx, seed: cell.m.seedBase + hits[Math.floor(Math.random() * hits.length)], pace: cell.m.pace, label: `${cell.m.going}馬場・${PACE_LABEL[cell.m.pace]}ペース` };
    }
  }
  if (pick && pick.startsWith("w")){
    const i = +pick.slice(1), o = sim.res.orders, R = sim.res.runs, hits = [];
    for (let k = 0; k < R; k++) if (o[k*N] === i) hits.push(k);
    if (!hits.length) return null;
    return { ctx: sim.ctx, seed: sim.res.seedBase + hits[Math.floor(Math.random() * hits.length)], pace: sim.res.paceMode, label: `${sim.ctx.race.going}馬場・${PACE_LABEL[sim.pace]}` };
  }
  const k = Math.floor(Math.random() * sim.res.runs);
  return { ctx: sim.ctx, seed: sim.res.seedBase + k, pace: sim.res.paceMode, label: `${sim.ctx.race.going}馬場・${PACE_LABEL[sim.pace]}` };
}
function loadReplayRun(pick){
  const r = curRace(), sim = r && ST.sims[r.id];
  if (!sim || !ensureReplay()) return;
  pick = pick || sim.runPick || "best";
  const ch = chooseRun(sim, pick);
  if (!ch){ toast("その馬が勝つ回は1万回の中にありませんでした"); return; }
  sim.runPick = pick;
  const trace = Engine.simulateOne(ch.ctx, ch.seed, true, ch.pace);   // 集計と同じ乱数・同じペース設定で再現
  sim.trace = trace; sim.replayCtx = ch.ctx; sim.replayLabel = ch.label;
  sim.replayCount = (sim.replayCount || 0) + 1;
  Replay.load(ch.ctx, trace); Replay.start();
  ST.mapCache = null; sim.t1000 = null; resetCommentary();
  const fp = $("#focusPick"); const prevF = fp.value;
  fp.innerHTML = `<option value="">なし（全体を見る）</option>` + ch.ctx.field.map(f => `<option value="${f.num}">${f.num} ${esc(f.name)}</option>`).join("");
  fp.value = ch.ctx.field.some(f => String(f.num) === prevF) ? prevF : "";
  Replay.setFocus(fp.value ? +fp.value : null);
  $("#runPick").innerHTML = runOptions(sim); $("#runPick").value = pick;
  $("#hudRace").textContent = `${r.venue}${r.no}R ${r.name}`;
  $("#hudPace").textContent = `${ch.label}・この回は${trace.paceLabel}・再生${sim.replayCount}回目`;
  $("#finishBox").hidden = true;
  const ev = trace.events.map((e, i) => e.length ? `${ch.ctx.field[i].num}番 ${e.join("・")}` : "").filter(Boolean);
  $("#passing").innerHTML = `1角想定隊列：${trace.earlyOrder.map(i => ch.ctx.field[i].num).join(" - ")}${ev.length ? "　／　アクシデント：" + esc(ev.join("、")) : ""}`;
  $("#playBtn").textContent = "▶ 再生";
}
// ---- 実況・全体図・隊列 ----
const CM = { lines: [], said: new Set(), lastLeader: null, lastT: 0 };
function say(key, text){ if (CM.said.has(key)) return; CM.said.add(key); CM.lines.push(text); if (CM.lines.length > 3) CM.lines.shift(); $("#commentary").innerHTML = CM.lines.map(l => `<div>${l}</div>`).join(""); }
function resetCommentary(){ CM.lines = []; CM.said = new Set(); CM.lastLeader = null; CM.prevRank = null; $("#commentary").innerHTML = ""; }
const nm = o => `<b>${o.num}番</b>${esc(o.name)}`;
function phaseOf(s){
  if (s.t <= 0.01) return "スタート前";
  const run = s.D - s.remaining;
  if (s.remaining <= 0) return "ゴール";
  if (run < 200) return "スタート直後";
  if (s.remaining <= s.str) return "最後の直線";
  if (s.remaining <= s.str + s.curveLen) return "3〜4コーナー";
  return "道中";
}
function commentate(s, sim){
  if (s.t < CM.lastT - 0.5) resetCommentary();          // 巻き戻し
  CM.lastT = s.t;
  const o = s.order, lead = o[0], run = s.D - s.remaining, tr = sim.trace, f = sim.ctx.field;
  if (s.t > 0.2) say("start", "スタートしました！");
  tr.events.forEach((e, i) => { if (e.includes("出遅れ") && s.t > 1.5) say("slow" + i, `${nm({ num: f[i].num, name: f[i].name })}は出遅れ、後方からの競馬`); });
  if (run > 250) say("lead", `ハナを切ったのは${nm(o[0])}。2番手に${nm(o[1])}、3番手${nm(o[2])}`);
  if (run > 250 && CM.lastLeader && CM.lastLeader !== lead.num && s.remaining > 30) say("lc" + Math.floor(run / 100) + lead.num, `${nm(lead)}が先頭に立った！`);
  if (run > 250) CM.lastLeader = lead.num;
  if (run >= 1000 && s.D >= 1400){ const t1000 = sim.t1000 ?? (sim.t1000 = s.t); say("1000", `1000m通過は約${t1000.toFixed(1)}秒。${tr.paceLabel === "ハイペース" ? "速い流れ、前の馬にはきつい展開" : tr.paceLabel === "スローペース" ? "ゆったりした流れ、前の馬が有利" : "平均的な流れ"}`); }
  if (s.remaining <= s.str + s.curveLen && s.remaining > s.str) say("corner", `3〜4コーナー。先頭${nm(o[0])}、外から各馬が進出開始`);
  if (s.remaining <= s.str) say("straight", `最後の直線！先頭は${nm(o[0])}、2番手${nm(o[1])}、3番手${nm(o[2])}`);
  // 直線で大きく順位を上げた馬
  if (s.remaining <= s.str && CM.prevRank){
    o.forEach((x, r) => { const pr = CM.prevRank[x.num]; if (pr != null && pr - r >= 3 && r <= 4) say("gain" + x.num, `${nm(x)}が外から一気に追い込んでくる！`); });
  }
  if (!CM.prevRank || Math.floor(s.t) !== CM.rankT){ CM.rankT = Math.floor(s.t); if (!CM.hist) CM.hist = []; CM.hist.push(Object.fromEntries(o.map((x, r) => [x.num, r]))); if (CM.hist.length > 4) CM.hist.shift(); CM.prevRank = CM.hist[0]; }
  if (s.remaining <= 200 && s.remaining > 0) say("200", `残り200m！${nm(o[0])}が粘るか、${nm(o[1])}が迫る！`);
  const fin = o.filter(x => x.done).sort((a, b) => a.tCross - b.tCross);
  if (fin.length) say("win", `${nm(fin[0])}、1着でゴールイン！`);
  if (fin.length >= 3) say("top3", `2着${nm(fin[1])}、3着${nm(fin[2])}`);
}
function drawMap(s){
  const cv = $("#minimap"); if (!cv || !cv.getContext) return;
  const md = ST.mapCache || (ST.mapCache = Replay.mapData()); if (!md) return;
  const g = cv.getContext("2d"), W = cv.width, H = cv.height;
  g.clearRect(0, 0, W, H);
  let minX = 1e9, maxX = -1e9, minZ = 1e9, maxZ = -1e9;
  md.pts.forEach(p => { minX = Math.min(minX, p[0], p[2]); maxX = Math.max(maxX, p[0], p[2]); minZ = Math.min(minZ, p[1], p[3]); maxZ = Math.max(maxZ, p[1], p[3]); });
  const pad = 22, sc = Math.min((W - pad * 2) / (maxX - minX), (H - pad * 2) / (maxZ - minZ));
  const ox = W / 2 - (minX + maxX) / 2 * sc, oz = H / 2 - (minZ + maxZ) / 2 * sc;
  const X = x => ox + x * sc, Z = z => oz + z * sc;
  // 走路
  g.beginPath(); md.pts.forEach((p, i) => i ? g.lineTo(X(p[2]), Z(p[3])) : g.moveTo(X(p[2]), Z(p[3]))); g.closePath();
  md.pts.slice().reverse().forEach((p, i) => i ? g.lineTo(X(p[0]), Z(p[1])) : g.moveTo(X(p[0]), Z(p[1]))); g.closePath();
  g.fillStyle = curRace()?.surface === "ダ" ? "#8a6a48" : "#4c8c43"; g.fill("evenodd");
  g.strokeStyle = "rgba(255,255,255,.7)"; g.lineWidth = 1;
  g.beginPath(); md.pts.forEach((p, i) => i ? g.lineTo(X(p[0]), Z(p[1])) : g.moveTo(X(p[0]), Z(p[1]))); g.closePath(); g.stroke();
  // ゴール線・スタート
  g.strokeStyle = "#fff"; g.lineWidth = 3; g.beginPath(); g.moveTo(X(md.goal[0]), Z(md.goal[1])); g.lineTo(X(md.goal[2]), Z(md.goal[3])); g.stroke();
  g.fillStyle = "#fff"; g.font = "bold 12px system-ui"; g.textAlign = "center"; g.fillText("ゴール", X(md.goal[2]), Z(md.goal[3]) + 13);
  g.fillStyle = "#cfe"; g.fillText("スタート", X(md.start[0]), Z(md.start[1]) - 8);
  md.marks.forEach(m => { if (m.r % 400 === 0){ g.fillStyle = "rgba(255,255,255,.75)"; g.font = "9px system-ui"; g.fillText(m.r, X(m.x), Z(m.z)); } });
  // 馬
  const big = cv.classList.contains("big");
  const r0 = big ? 8 : 6.5;
  s.order.slice().reverse().forEach(o => {
    const x = X(o.x), z = Z(o.z);
    if (o.num === s.focus){ g.beginPath(); g.arc(x, z, r0 + 4, 0, Math.PI * 2); g.strokeStyle = "#ffd23a"; g.lineWidth = 3; g.stroke(); }
    g.beginPath(); g.arc(x, z, r0, 0, Math.PI * 2); g.fillStyle = WAKU[o.waku - 1]; g.fill(); g.lineWidth = 1; g.strokeStyle = "rgba(0,0,0,.6)"; g.stroke();
    g.fillStyle = WAKU_TX[o.waku - 1]; g.font = `bold ${big ? 10 : 8}px system-ui`; g.textAlign = "center"; g.textBaseline = "middle"; g.fillText(o.num, x, z + 0.5); g.textBaseline = "alphabetic";
  });
  const ld = s.order[0]; g.fillStyle = "#ffd23a"; g.font = "bold 11px system-ui"; g.textAlign = "left"; g.fillText(`先頭 ${ld.num}番`, 8, 15);
}
function drawLineup(s){
  const L = 2.4, lead = s.order[0].d;
  const gaps = s.order.map(o => (lead - o.d) / L);
  const maxGap = Math.max(10, Math.ceil(Math.max(...gaps) / 5) * 5);
  const axis = []; for (let g = 0; g <= maxGap; g += maxGap > 20 ? 5 : 2) axis.push(`<span style="left:${(1 - g / maxGap) * 100}%">${g ? g + "馬身" : "先頭"}</span>`);
  const ak = axis.join(""); if (drawLineup.ak !== ak){ drawLineup.ak = ak; $("#luAxis").innerHTML = ak; }
  const rows = []; const html = [];
  s.order.forEach((o, i) => {
    const xPct = (1 - gaps[i] / maxGap) * 100;
    let row = 0; while (rows[row] != null && Math.abs(rows[row] - xPct) < 3.2) row++; rows[row] = xPct;
    html.push(`<span class="ub${o.num === s.focus ? " focus" : ""}" style="left:${xPct.toFixed(2)}%;top:${4 + (row % 2) * 20}px;background:${WAKU[o.waku - 1]};color:${WAKU_TX[o.waku - 1]}">${o.num}</span>`);
  });
  $("#luTrack").innerHTML = html.join("");
}

  $("#hudPhase").textContent = phaseOf(s);
  const sc = $("#scrub"); if (document.activeElement !== sc) sc.value = Math.round(s.t / s.tEnd * 1000);
  drawLineup(s); drawMap(s);

  const pb = $("#playBtn"); const want = s.playing ? "❚❚ 一時停止" : "▶ 再生"; if (pb.textContent !== want) pb.textContent = want;
}
function margin(dt){
  const L = dt / 0.18;
  if (L < 0.06) return "ハナ"; if (L < 0.15) return "アタマ"; if (L < 0.3) return "クビ";
  if (L > 10) return "大差";
  const q = Math.round(L * 4) / 4, w = Math.floor(q), fr = q - w;
  const f = fr === 0.25 ? "1/4" : fr === 0.5 ? "1/2" : fr === 0.75 ? "3/4" : "";
  return w ? (f ? `${w}.${f}`.replace(".", " ") : `${w}`) : f;
}

const BATCH = { running: false, rows: {}, done: 0, total: 0, date: null, saved: {} };
const BATCH_RUNS = 5000;
const ymdOf = d => d.replace(/-/g, "");
const isoOf = y => `${y.slice(0, 4)}-${y.slice(4, 6)}-${y.slice(6, 8)}`;
function summarizeSim(r, sim){
  const w = sim.weighted.slice().sort((a, b) => b.win - a.win);
  const f = sim.ctx.field;
  const mk = s => ({ num: s.num, name: s.name, win: s.win, top3: s.top3, odds: f[s.i].odds ?? null, pop: f[s.i].pop ?? null });
  const tri = sim.triTop[0];
  const tk = t => `${t.type} ${t.nums.join("-")} ${t.stake}円→的中${Math.round(t.stake * t.odds).toLocaleString()}円`;
  const tks = pl => pl && !pl.none && !pl.noOdds && pl.tickets?.length ? pl.tickets.map(t => ({ type: t.type, nums: t.nums, stake: t.stake, odds: t.odds })) : null;
  const planTxt = pl => pl && !pl.none && !pl.noOdds && pl.tickets?.length ? pl.tickets.map(tk) : null;
  const kp = pl => pl && !pl.none && !pl.noOdds && pl.tickets?.length ? { exp: pl.expReturn, hit: pl.hitRate } : null;
  const evm = pl => pl?.evmax ? { t: tk(pl.evmax.tickets[0]), ev: pl.evmax.tickets[0].ev, hit: pl.evmax.hitRate } : null;
  const N = f.length;

    CHECK_MODE.v = "pre";
    for (const d of dates){
      await loadServerSummary(d);
      const c = computeCheck(d);
      checkRows(d, "pre").filter(x => x.res && x.row).forEach(({ r, row }) => {
        const ok = new Date(row.at) >= new Date(L.at) && new Date(row.at) <= raceStart(r) && row.calc && !row.calc.manual
          && Math.abs(row.calc.a - L.model.calib.a) < 0.005 && Math.abs(row.calc.b - L.model.calib.b) < 0.005 && (!L.logic || row.calc.logic === L.logic);
        if (!ok){ skipped++; return; }
        const p = c.per[r.id]?.plans || {};

      });
    }

    const xs = seq.filter(x => x[key]?.inv > 0).map(x => ({ d: x.d, inv: x[key].inv, ret: x[key].ret }));
    if (!xs.length) return { n: 0 };

      bal += x.ret - x.inv; peak = Math.max(peak, bal); dd = Math.max(dd, peak - bal);

}

const REPORT = { r: null, busy: false };
async function makeReport(){
  if (REPORT.busy) return; REPORT.busy = true; renderLearnTab();
  try {
    // PCでは過去データの処理が持っている記録（最新）をそのまま使う（同じ記録を二重に読み込んでメモリを使わないように）
    let recs = !SERVER.cloud ? BF.recs : null;
    if (!recs){ const full = SERVER.cloud ? await staticJson("learn.json", 120000) : await api("/api/learn?full=1", { timeout: 300000 }); recs = full.records || []; if (!SERVER.cloud && !BF.recs) BF.recs = recs; }
    await new Promise(r => setTimeout(r, 30));
    REPORT.r = await Learn.report(recs);
  } catch (e) { toast("レポートを作れませんでした：" + e.message); }
  REPORT.busy = false; renderLearnTab();
}
// 付け足しがまだの記録の数（新しい材料を足したときも、ボタンが出るように）
const fillNeed = r => r && r.h.some(h => !("plp" in h) || !("hid" in h) || h.ct === undefined || (h.ct && h.ct.length < 4));
function fillNeeded(){ const recs = BF.recs; return recs ? recs.filter(fillNeed).length : null; }
// 前の版の記録に、位置取りの材料（過去の通過順・距離の増減・同型の頭数・実際の1角/4角）だけを付け足す。
// シミュレーションはしないので数分で終わる。モデルの確率は変えない（記録の作り直しは別に自動で進む）
const POSFILL = { busy: false, msg: "" };
async function fillPositions(){
  if (POSFILL.busy || !SERVER.enabled || SERVER.cloud) return;
  POSFILL.busy = true; POSFILL.msg = "準備中"; renderLearnTab();
  const wasPaused = BF.pause; BF.pause = true;           // 過去データの処理と同時に記録を書き換えないよう、いったん止める
  try {
    while (BF.proc) await bfSleep(500);
    const full = await api("/api/learn?full=1", { timeout: 120000 });
    const recs = full.records || [], byId = new Map(recs.map(r => [r.id, r]));
    const need = fillNeed;     // 位置取り・能力の内訳・前走の内容（道中の位置変化まで）・複勝の払戻のどれかが欠けている記録
    const changed = [];
    Object.values(DB.races).forEach(r => { const rec = byId.get(r.id); if (need(rec) && Learn.posFill(rec, r, DB.horses, Engine)) changed.push(rec); });
    const st = await bfRefresh();
    const days = [...new Set([...Object.keys(st?.processed || {}), ...(st?.pending || [])])].sort();
    const needDates = new Set(recs.filter(need).map(r => ymdOf(r.date)));
    const todo = days.filter(d => needDates.has(d));
    for (let i = 0; i < todo.length; i++){
      POSFILL.msg = `${i + 1}/${todo.length}開催日`; if (ST.tab === "learn") renderLearnTab();
      const j = await api("/api/backfill/day?date=" + todo[i], { timeout: 180000 }).catch(() => null); if (!j?.races) continue;
      j.races.forEach(r => { const rec = byId.get(r.id); if (need(rec) && Learn.posFill(rec, { ...r, date: r.date || j.date }, j.horses || {}, Engine)) changed.push(rec); });
    }
    if (changed.length){
      const latest = recs.reduce((m, r) => r.date > m ? r.date : m, "");
      const model = Learn.build(recs, latest);      // 全部の記録で学習したモデル（今使っているものが不完全でも上書きしないように）
      BF.full = model; if (!simBusy) applyLearn(model);
      await api("/api/learn", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ model, append: changed, bulk: true }), timeout: 120000 });
    }
    BF.recs = recs;      // 付け足し後の記録を、以後の処理・レポートで使う1つのコピーにする
    toast(`${changed.length.toLocaleString()}レースの記録に位置取りの材料を付け足しました（材料がないレース${recs.filter(need).length - changed.length}件）`);
    POSFILL.busy = false; BF.pause = wasPaused; if (!wasPaused) bfProcessLoop();
    await makeReport();
  } catch (e) { toast("付け足しできませんでした：" + e.message); }
  finally { POSFILL.busy = false; BF.pause = wasPaused; if (ST.tab === "learn") renderLearnTab(); }
}

function bodyWeightPanel(){

  const row = k => { const w = e.win[k], t = e.top3[k]; const cls = x => x.applied ? (x.applied > 0 ? "pos" : "neg") : "";

async function loadServerDB(){
  try {
    const j = await api("/api/db", { timeout: 60000 });
    if (j.races?.length){
      // 新しいオッズが届いたレースは、以前に手入力したオッズを捨てて新しいオッズを使う
      let cleared = false;
      j.races.forEach(r => { const old = DB.races[r.id], tw = tweaks[r.id];
        if (tw && (tw.odds || tw.place) && r.oddsAsOf && r.oddsAsOf !== old?.oddsAsOf){ delete tw.odds; delete tw.place; cleared = true; } });
      if (cleared) persist();
      mergeImport({ races: j.races, horses: j.horses });
      Object.assign(SEED.track, j.track || {});
      if (j.cushion) CUSHION.avg = j.cushion;
      applyBodyWeight();
      const last = (j.dates || []).map(d => d.updated).filter(Boolean).sort().pop();
      SERVER.dbDates = Object.fromEntries((j.dates || []).map(d => [d.date, d.updated]));
      DB.meta.sources = DB.meta.sources.filter(x => !x.startsWith("PCのDB")).concat(`PCのDB（${(j.dates || []).length}開催日・最終更新 ${last ? last.replace("T", " ") : "—"}）`);
      // シミュレーション済みの結果は出走表が変わった可能性があるので古い扱いに
      Object.keys(ST.sims).forEach(markStale);
    }
    return j;
  } catch (e) { return null; }
}
async function loadServerSummary(d){
  if (!SERVER.on || BATCH.saved[d] !== undefined) return;
  try { const j = await api("/api/summary?date=" + ymdOf(d)); BATCH.saved[d] = j && j.rows ? j : null; } catch (e) { BATCH.saved[d] = null; }
  // クラウドが自動で記録した「発走前の予想」を取り込む（この端末に発走前の予想がないレースの答え合わせ用）
  try {
    const pre = SERVER.cloud ? await staticJson(`pre_${ymdOf(d)}.json`) : await api("/api/pre?date=" + ymdOf(d));
    if (pre?.rows && Object.keys(pre.rows).length){
      const sv = BATCH.saved[d] || { date: d, rows: [] }; const by = Object.fromEntries((sv.rows || []).map(x => [x.id, x]));
      Object.entries(pre.rows).forEach(([id, p]) => {
        const r = DB.races[id]; if (!r || new Date(p.at) > raceStart(r)) return;
        const x = by[id];
        if (!x){ by[id] = p; return; }
        const mine = preRowOf(r, x);
        if (!mine || new Date(mine.at) < new Date(p.at)){ if (x === mine || new Date(x.at) <= raceStart(r)) by[id] = p; else by[id] = { ...x, preRace: p }; }
      });
      BATCH.saved[d] = { ...sv, rows: Object.values(by) };
    }
  } catch (e) {}
  if (ST.tab === "all") renderAllTab();
}
function pickInitialDate(j){
  const ns = SERVER.status?.nextSunday ? isoOf(SERVER.status.nextSunday) : null;
  if (ns && racesOfDay(ns).length) ST.date = ns;
  else if (!racesOfDay(ST.date).length){ const ds = (j?.dates || []).map(d => isoOf(d.date)).filter(d => racesOfDay(d).length).sort(); if (ds.length) ST.date = ds[ds.length - 1]; }
  if (!DB.races[ST.raceId]?.entries || DB.races[ST.raceId].date !== ST.date){ const r = DB.races["202605040211"]?.date === ST.date && DB.races["202605040211"].entries ? DB.races["202605040211"] : racesOfDay(ST.date)[0]; if (r) ST.raceId = r.id; }
}
// クラウド版：開催当日の発走前に、オッズが15分以上古ければ自動で更新を依頼（スマホ用の鍵を登録している場合。GitHubの予定実行が遅れたときの保険）
function autoOddsRefresh(){
  if (!SERVER.cloud || !LS.get("keibaGhToken", "")) return;
  const today = iso(new Date()), rs = racesOfDay(today); if (!rs.length) return;
  const now = new Date(), last = Math.max(...rs.map(raceStart).map(Number));
  if (now.getHours() < 8 || now > new Date(last)) return;
  const asof = rs.map(r => r.oddsAsOf || "").sort().pop();
  const age = asof ? (now - new Date(asof.replace(" ", "T") + "+09:00")) / 60000 : 999;
  if (age < 17 || Date.now() - LS.get("keibaAutoOdds", 0) < 15 * 60000 || SERVER.cloudWait) return;
  LS.set("keibaAutoOdds", Date.now()); SERVER.updDate = today;
  startJob("odds").then(() => toast(`オッズが${Math.round(age)}分前のものだったので、自動で更新を依頼しました`));
}
// 画面を開いたままでも、新しいオッズ・結果が入ったら自動で読み直して一括予想をやり直す（5分ごとに確認）
function startAutoRefresh(){
  if (SERVER.autoTimer) return;
  SERVER.autoTimer = setInterval(async () => {
    if (!SERVER.on || BATCH.running || SERVER.cloudWait || SERVER.status?.running || simBusy) return;
    try {
      const s = await api("/api/status", { timeout: 8000 });
      const key = s.updated || s.finished_at, prev = SERVER.status?.updated || SERVER.status?.finished_at;
      SERVER.status = { ...SERVER.status, ...s };
      if (key && prev && key !== prev){
        await loadServerDB(); await loadLearn();
        const auto = LS.get("keibaAutoPredict", false);
        if (racesOfDay(ST.date).length){ BATCH.saved[ST.date] = undefined; await loadServerSummary(ST.date); if (auto) runBatch(); }
        SERVER.lastMsg = `新しいデータ（オッズ・結果）を読み込みました（${String(key).replace("T", " ").slice(5, 16)}）。${auto ? "" : "予想し直すときは「一括シミュレーション」を押してください。"}`; renderUpd();
      }
      autoOddsRefresh();
    } catch (e) {}
  }, 5 * 60000);
}
async function serverInit(){
  if (!SERVER.enabled){ renderUpd(); return; }
  try { SERVER.status = await api("/api/status", { timeout: 5000 }); SERVER.on = true; } catch (e) { SERVER.on = false; }
  if (!SERVER.on){
    // 外出先などでPCに届かないとき：最後に読み込んだDB（端末内キャッシュ）で動かす

    renderUpd(); if (!Object.keys(ST.sims).length) runSim(true); setTimeout(serverInit, 10000); return;
  }
  if (SERVER.on){
    try { const tw = await api("/api/tweaks"); if (tw && typeof tw === "object" && Object.keys(tw).length) tweaks = tw; } catch (e) {}
    const j = await loadServerDB();

    api("/api/learn?count=1").then(async c => { if (c?.records && ((LEARN.saved || LEARN.model)?.races || 0) < c.records * 0.9){ if (!BF.recs) await bfLoadRecs(); else await ensureFullModel(BF.recs); } }).catch(e => console.error(e));
    startAutoRefresh();
    // 過去データの予想・学習は、ボタンを押したとき（または「起動したら自動で続ける」がオンのとき）だけ進める
    bfRefresh().then(s => { if (s?.autoResume) BF.pause = false; if (s && (s.running || s.pending?.length)) bfEnsure(); });
    refreshCloudInfo().then(() => renderUpd());

// 学習の記録を全部読み込む。読み込めなかったときは処理を止める（記録0件のまま進むと、空のモデルで予想・保存してしまうため）

async function ensureFullModel(recs){
  if (!recs?.length) return;
  const cur = BF.full || LEARN.saved || LEARN.model;
  if (cur && (cur.races || 0) >= recs.length * 0.9) { if (!BF.full) BF.full = cur; return; }
  const latest = recs.reduce((m, r) => r.date > m ? r.date : m, "");

  if (!simBusy) applyLearn(BF.full);

// ===== 動作状況の記録（落ちたときの原因調べ用）：エラーとメモリの使用量を、PCのアプリの data/client_log.txt に残す =====
const DIAG = { last: null };
function diagSnapshot(){
  const mem = performance?.memory ? Math.round(performance.memory.usedJSHeapSize / 1048576) : null;
  return { t: new Date().toISOString(), memMB: mem, records: BF.recs?.length ?? null, horses: Object.keys(DB.horses || {}).length, races: Object.keys(DB.races || {}).length, sims: Object.keys(ST.sims || {}).length, bf: BF.proc ? BF.msg : "" };
}
function diagSend(kind, extra){
  if (!SERVER.enabled || SERVER.cloud || !SERVER.on) return;
  DIAG.last = diagSnapshot();
  fetch("/api/clientlog", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ kind, ...DIAG.last, ...(extra || {}) }) }).catch(() => {});
}
if (typeof window !== "undefined" && window.addEventListener){
  window.addEventListener("error", e => diagSend("error", { msg: String(e.message || e).slice(0, 300), at: `${e.filename || ""}:${e.lineno || ""}` }));
  window.addEventListener("unhandledrejection", e => diagSend("rejection", { msg: String(e.reason?.message || e.reason).slice(0, 300) }));
  setInterval(() => diagSend("heartbeat"), 5 * 60 * 1000);
}
async function bfProcessLoop(){
  if (BF.proc || BF.pause || !SERVER.enabled || SERVER.cloud || !SERVER.on) return;
  const st = BF.status || await bfRefresh();
  if (!st?.pending?.length) return;
  BF.proc = true;
  try {
    if (!BF.recs) await bfLoadRecs();
    while (!BF.pause){
      const s = await bfRefresh(); const ymd = s?.pending?.[0]; if (!ymd) break;
      while (BATCH.running || simBusy || CHECK_ALL.running) await bfSleep(1000);   // 画面で一括予想などをしている間は待つ
      const j = await api("/api/backfill/day?date=" + ymd, { timeout: 180000 }).catch(() => null);
      if (!j?.races){ await bfSleep(5000); continue; }
      await bfProcessDay(j, s.pending.length);
      if (ST.tab === "learn") renderLearnTab();
    }
    if (BF.pendRecs.length) await bfPostLearn();
  } catch (e) { console.error(e); BF.msg = "処理が止まりました：" + e.message; }

    // 処理が終わったら（止めたときも）、すべての記録で学習したモデルに戻して、これからの予想に使う
    if (BF.recs?.length){ const latest = BF.recs.reduce((m, r) => r.date > m ? r.date : m, ""); BF.full = Learn.build(BF.recs, latest); applyLearn(BF.full); }
    BF.proc = false; if (ST.tab === "learn") renderLearnTab();
  }
}
async function bfPostLearn(){
  // 保存するのは、すべての記録で学習したモデル（今後の予想に使う）
  const latest = BF.recs.reduce((m, r) => r.date > m ? r.date : m, "");
  const model = Learn.build(BF.recs, latest || iso(new Date()));
  BF.full = model; if (!simBusy) applyLearn(model);

async function bfProcessDay(j, left){
  const d = j.date, t0 = Date.now();

  mergeImport({ races: j.races, horses: j.horses });
  applyBodyWeight();

  BF.msg = `${d.slice(0, 4)}/${d.slice(5).replace("-", "/")} を予想中（残り${left}開催日）`;

    // その日より前の結果だけで学習したモデル（未来の結果で学習したモデルで過去を予想しない）。
    // 使うのはこの処理の予想の間だけで、1レースごとに元のモデル（全部の記録で学習）に戻す＝画面で同時に予想しても混ざらない

async function loadLearn(){
  try {
    const m = SERVER.cloud ? await staticJson("learn_model.json") : SERVER.enabled ? await api("/api/learn") : null;
    if (m && m.calib) LEARN.saved = m;
    try { const L = SERVER.cloud ? await staticJson("lock.json") : SERVER.enabled ? await api("/api/lock") : null; LOCK.info = L?.model?.calib ? L : null; } catch (e) { LOCK.info = null; }
    const use = LOCK.info?.model || (m && m.calib ? m : null);
    if (use){ applyLearn(use); Object.keys(ST.sims).forEach(markStale); }
  } catch (e) {}
}
async function runLearn(d){
  if (!SERVER.enabled || SERVER.cloud || !SERVER.on) return null;
  // 取得済みのすべての開催日（土曜・過去の日を含む）で、結果の出ているレースを学習に使う
  const races = Object.values(DB.races).filter(r => r.result?.rows?.length && r.entries?.length);
  if (!races.length) return null;
  const full = await api("/api/learn?full=1").catch(() => ({}));
  // 作り方が古い記録（未来の出走歴が混ざりうる版など）は、データが手元にあれば作り直す
  // その日より前の記録だけで学習したモデルで作ったと確認できない記録（clean でないもの）も作り直す
  const done = new Set((full.records || []).filter(x => (x.rv || 0) >= Learn.RV && Learn.clean(x)).map(x => x.id));
  const todo = races.filter(r => !done.has(r.id));
  setUpdProgress(0.5, `結果を学習中…（${todo.length}レースのモデル確率を計算）`);
  const betsOf = r => betsForLearn(r.date, r.id);
  // 開催日ごとに「その日より前の記録だけ」で学習したモデルを使って記録を作る（検証に未来の情報を混ぜない）
  const byD = {}; todo.forEach(r => (byD[r.date] ||= []).push(r));
  let recs = [];
  for (const d0 of Object.keys(byD).sort()){
    const wf = Learn.build((full.records || []).filter(x => x.date < d0), d0, { light: true });
    while (simBusy) await new Promise(res => setTimeout(res, 100));
    simBusy = true; const keep = LEARN.model; applyLearn(wf);
    try { recs = recs.concat(await Learn.recordsForRaces(Engine, byD[d0], DB.horses, trackOf, 2000, betsOf, LEARN.base || Engine.WEIGHTS, wf.upto)); }
    finally { applyLearn(BF.full || keep); simBusy = false; }
  }
  // 既に記録済みのレースにも、答え合わせの仮想収支を付け足す
  (full.records || []).forEach(x => { if (!x.bets) x.bets = betsOf({ id: x.id, date: x.date }); });
  const all = Learn.merge(full.records, recs);
  const model = Learn.build(all, all.reduce((m, x) => x.date > m ? x.date : m, d));
  await api("/api/learn", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ model, records: all }) });
  applyLearn(model);
  setUpdProgress(1, `学習を更新しました（累計${model.races}レース）`);
  return model;
}
// 予想の中身（◎○▲・1,000円の買い目・勝負／見送り推奨・計算の版）を記録に残す（あとで全レースの予想と結果を一覧するため）
function predDetail(row){
  if (!row) return {};
  return { mk: (row.marks || []).slice(0, 3).map(x => x.num), tk: row.t1s || null, md: row.mode1 || null, lv: row.calc?.logic || (typeof LOGIC_VER !== "undefined" ? LOGIC_VER : null), pa: row.at || null };
}
// 答え合わせの結果から、学習用の仮想収支 [投資, 払戻] を作る
function betsForLearn(d, id){
  if (CHECK_MODE.v !== "pre") return null;      // 仮想収支（実力の判定）には発走前の予想だけを使う
  const c = CHECK[d]?.per?.[id]; if (!c) return null;
  const pick = k => c.plans[k] ? [c.plans[k].inv, Math.round(c.plans[k].ret)] : [0, 0];
  const row = checkRows(d, "pre").find(x => x.r.id === id)?.row;
  return { t1: pick("1000"), t5: pick("5000"), te: pick("e1000"), t1s: pick("1000s"), t5s: pick("5000s"), ...predDetail(row) };
}

    <p class="small">要素の効きの補正（${m.races < 200 ? "レースが少ないうちは控えめ" : "蓄積にもとづく"}）：${W.length ? W.slice(0, 8).map(([k, v]) => `${esc(k)} ×${v}`).join("・") : "まだ変更なし"}</p>

// ===== 答え合わせ（発走前の買い目 × 実際の払戻） =====
const CHECK = {};
const CHECK_MODE = { v: "pre" };   // pre=発走前の予想で集計 / latest=最新の予想で集計
const PAY_KEY = { 単勝: "単勝", 複勝: "複勝", 馬連: "馬連", ワイド: "ワイド", 馬単: "馬単", 三連複: "三連複" };
function parseTickets(list){
  if (!list) return null;
  if (typeof list[0] === "object") return list;
  return list.map(t => { const m = /^(単勝|複勝|馬連|ワイド|馬単|三連複) ([\d-]+) (\d+)円/.exec(t); return m ? { type: m[1], nums: m[2].split("-").map(Number), stake: +m[3] } : null; }).filter(Boolean);
}
function payOf(t, res){
  const tbl = res.pay?.[PAY_KEY[t.type]]; if (!tbl) return 0;
  const key = t.type === "単勝" || t.type === "複勝" ? String(t.nums[0]) : t.type === "馬単" ? t.nums.join("-") : t.nums.slice().sort((a, b) => a - b).join("-");
  return tbl[key] ? t.stake / 100 * tbl[key] : 0;
}
// 発走前の予想：発走時刻より前に計算した行（発走後に計算し直した場合は preRace に残した方）
function preRowOf(r, x){ if (!x) return null; if (x.preRace) return x.preRace; return new Date(x.at) <= raceStart(r) ? x : null; }
function checkRows(d, mode){
  mode = mode || CHECK_MODE.v;
  const saved = Object.fromEntries((BATCH.saved[d]?.rows || []).map(x => [x.id, x]));
  return Object.values(DB.races).filter(r => r.date === d && r.entries?.length).sort((a, b) => a.venue.localeCompare(b.venue, "ja") || a.no - b.no)
    .map(r => { const x = BATCH.rows[r.id] || saved[r.id] || null; return { r, row: mode === "latest" ? x : (preRowOf(r, x) || preRowOf(r, saved[r.id])), any: x, res: r.result || null }; });
}
function computeCheck(d){
  const items = checkRows(d).filter(x => x.res && x.row);
  const plans = { "1000": { label: "1,000円（勝負レースだけ）", key: "t1", alt: "bet" }, "5000": { label: "5,000円（勝負レースだけ）", key: "t5", alt: "bet5" },
    "1000s": { label: "1,000円（全レース・見送り推奨も購入）", key: "t1s" }, "5000s": { label: "5,000円（全レース・見送り推奨も購入）", key: "t5s" }, "e1000": { label: "期待値最大 1点（1,000円）", key: "te" }, "e5000": { label: "期待値最大 1点（5,000円）", key: "te5" } };
  const tot = {};
  Object.entries(plans).forEach(([k, p]) => tot[k] = { ...p, invest: 0, ret: 0, races: 0, hitRaces: 0 });
  let fav1 = 0, fav3 = 0, tri = 0, dark3 = 0, darkN = 0, pre = 0;
  const per = {};
  items.forEach(({ r, row, res }) => {
    const o = res.order, out = { order: o.slice(0, 3), plans: {} };
    Object.entries(plans).forEach(([k, p]) => {
      const t = parseTickets(row[p.key] || (p.alt ? row[p.alt] : null));
      if (!t?.length) { out.plans[k] = null; return; }
      const inv = t.reduce((a, x) => a + x.stake, 0), ret = t.reduce((a, x) => a + payOf(x, res), 0);
      tot[k].invest += inv; tot[k].ret += ret; tot[k].races++; if (ret > 0) tot[k].hitRaces++;
      out.plans[k] = { inv, ret, hits: t.filter(x => payOf(x, res) > 0).map(x => `${x.type}${x.nums.join("-")}`) };
    });
    const m0 = row.marks?.[0]?.num;
    if (m0 === o[0]) fav1++; if (o.slice(0, 3).includes(m0)) fav3++;
    if (row.tri && row.tri.nums.join("-") === o.slice(0, 3).join("-")) tri++;
    if (row.dark){ darkN++; if (o.slice(0, 3).includes(row.dark.num)) dark3++; }
    if (new Date(row.at) <= raceStart(r)) pre++;
    out.favPos = o.indexOf(m0) + 1; out.marks = [...(row.marks || []), ...(row.subs || [])].map(x => x.num);
    per[r.id] = out;
  });
  const all = checkRows(d);
  const preAvail = checkRows(d, "pre").filter(x => x.res && x.row).length;

const PERF = { race: null, loading: false };

function perfCell(x, empty){
  if (!x || !x.n) return `<td><div class="big" style="color:var(--muted)">—</div><div class="sub">${empty || "購入なし"}</div></td>`;
  const roi = x.inv ? x.ret / x.inv : 0, prof = x.ret - x.inv;
  return `<td class="${roi >= 1 ? "win" : ""}"><div class="big ${roi >= 1 ? "pos" : "neg"}">${Math.round(roi * 100)}%</div>
    <div class="sub">的中率 <b>${Math.round(x.hit / x.n * 100)}%</b>（${x.hit}/${x.n}）</div>
    <div class="sub ${prof >= 0 ? "pos" : "neg"}">${prof >= 0 ? "+" : "−"}${Math.abs(Math.round(prof)).toLocaleString()}円</div></td>`;
}
function perfCum(){
  const recs = SERVER.cloud ? HIST.recs : BF.recs; if (!recs) return null;
  const out = {}; PERF_PLANS.forEach(([, key]) => out[key] = { n: 0, inv: 0, ret: 0, hit: 0 });
  let races = 0;
  recs.forEach(r => { if (!r.bets) return; races++; PERF_PLANS.forEach(([, key]) => { const v = r.bets[key]; if (v && v[0] > 0){ const o = out[key]; o.n++; o.inv += v[0]; o.ret += v[1]; if (v[1] > 0) o.hit++; } }); });
  return { out, races };
}
function perfLoad(){
  if (PERF.loading || (SERVER.cloud ? HIST.recs : BF.recs)) return;

    PERF.loading = false; if (ST.tab === "all") renderAllTab(); })();
}
